<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etiqueta de Palete - Validade Rotativa</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f0f0f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Courier New', monospace;
            margin: 0;
        }
        
        .container {
            max-width: 1200px;
            width: 100%;
        }
        
        .card {
            background: white;
            border: 3px solid #000;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        /* Etiqueta em modo paisagem - TAMANHO GRANDE */
        .etiqueta {
            font-family: 'Courier New', monospace;
            border: 4px solid #000;
            padding: 40px;
            margin: 20px auto;
            background: white;
            width: 100%;
            max-width: 1100px;
            min-height: 700px;
            display: flex;
            flex-direction: column;
            page-break-inside: avoid;
        }
        
        .etiqueta-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid #000;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        
        .etiqueta-codigo {
            font-size: 48px;
            font-weight: bold;
        }
        
        .etiqueta-ordem {
            font-size: 120px;
            font-weight: bold;
            color: #000;
            line-height: 1;
        }
        
        .etiqueta-descricao {
            font-size: 42px;
            font-weight: bold;
            margin: 30px 0;
            text-transform: uppercase;
            line-height: 1.3;
            border-bottom: 2px solid #000;
            padding-bottom: 20px;
        }
        
        .etiqueta-linha {
            display: flex;
            margin: 25px 0;
            font-size: 40px;
            align-items: baseline;
        }
        
        .etiqueta-label {
            font-weight: bold;
            width: 200px;
        }
        
        .etiqueta-valor {
            flex: 1;
            font-weight: bold;
        }
        
        .etiqueta-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 4px solid #000;
            font-weight: bold;
            font-size: 48px;
        }
        
        .qr-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 40px;
            padding: 20px;
            background: #f8f9fa;
            border: 2px solid #000;
        }
        
        .qr-code-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #000;
        }
        
        #qrcode canvas, #qrcode img {
            width: 200px;
            height: 200px;
        }
        
        .qr-info {
            font-size: 24px;
            margin-left: 30px;
        }
        
        .qr-info p {
            margin: 10px 0;
        }
        
        .info-paletes {
            background: #f8f9fa;
            border: 3px solid #333;
            border-radius: 10px;
            padding: 30px;
            margin: 30px 0;
        }
        
        .info-paletes h3 {
            font-size: 32px;
            margin: 0 0 20px 0;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }
        
        .tabela-validades {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Courier New', monospace;
            font-size: 24px;
        }
        
        .tabela-validades th {
            background: #333;
            color: white;
            padding: 15px;
            text-align: left;
            font-size: 24px;
        }
        
        .tabela-validades td {
            padding: 15px;
            border-bottom: 1px solid #ccc;
            font-size: 22px;
        }
        
        .tabela-validades tr.atual {
            background: #fff3cd;
            font-weight: bold;
        }
        
        .ordem-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 24px;
            color: white;
        }
        
        .ordem-1 { background: #dc3545; }
        .ordem-2 { background: #fd7e14; }
        .ordem-3 { background: #ffc107; color: #000; }
        .ordem-4 { background: #28a745; }
        .ordem-5 { background: #17a2b8; }
        
        .qr-actions {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        
        .qr-actions button {
            padding: 20px 40px;
            border: none;
            border-radius: 10px;
            font-size: 24px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 200px;
            justify-content: center;
        }
        
        .btn-download {
            background: #007bff;
            color: white;
        }
        
        .btn-print {
            background: #28a745;
            color: white;
        }
        
        .btn-close {
            background: #dc3545;
            color: white;
        }
        
        .btn-view {
            background: #6c757d;
            color: white;
        }
        
        .qr-actions button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        
        .resumo-sku {
            background: #e9ecef;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            font-size: 28px;
            border: 2px solid #333;
            text-align: center;
        }
        
        @media print {
            body {
                background: white;
                padding: 0;
                margin: 0;
            }
            
            .container {
                max-width: 100%;
                padding: 0;
                margin: 0;
            }
            
            .card {
                box-shadow: none;
                border: none;
                padding: 0;
                margin: 0;
            }
            
            .qr-actions, .info-paletes, .btn-view, h2 {
                display: none !important;
            }
            
            .etiqueta {
                border: 3px solid #000;
                page-break-inside: avoid;
                margin: 0;
                max-width: 100%;
                min-height: 100vh;
                box-shadow: none;
                padding: 30px;
            }
            
            .qr-section {
                border: 2px solid #000;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2 style="text-align: center; font-size: 36px; margin-bottom: 30px;">Etiqueta de Palete - Ordem Rotativa</h2>
            
            <!-- Resumo do SKU -->
            <div class="resumo-sku" id="resumo-sku">
                Carregando informações...
            </div>
            
            <!-- Visualização da etiqueta GRANDE em modo paisagem -->
            <div class="etiqueta" id="etiquetaVisualizacao">
                <!-- Será preenchido via JavaScript -->
            </div>
            
            <!-- Informações de todos os paletes do mesmo SKU -->
            <div class="info-paletes" id="infoPaletes">
                <!-- Será preenchido via JavaScript -->
            </div>
            
            <div class="qr-actions">
                <button class="btn-download" onclick="baixarEtiqueta()">
                    <i class="bi bi-download"></i> Baixar PNG
                </button>
                <button class="btn-print" onclick="imprimirEtiqueta()">
                    <i class="bi bi-printer"></i> Imprimir Etiqueta
                </button>
                <button class="btn-view" onclick="window.location.href='qr-view.html'">
                    <i class="bi bi-arrow-left"></i> Voltar
                </button>
                <button class="btn-close" onclick="window.close()">
                    <i class="bi bi-x-lg"></i> Fechar
                </button>
            </div>
        </div>
    </div>

    <script>
        // Função para converter data nos formatos DD/MM/YYYY ou YYYY-MM-DD
        function parseData(dataStr) {
            if (!dataStr) return null;
            
            // Tentar formato YYYY-MM-DD
            if (dataStr.includes('-')) {
                const partes = dataStr.split('-');
                if (partes.length === 3) {
                    return new Date(partes[0], partes[1] - 1, partes[2]);
                }
            }
            
            // Tentar formato DD/MM/YYYY
            if (dataStr.includes('/')) {
                const partes = dataStr.split('/');
                if (partes.length === 3) {
                    return new Date(partes[2], partes[1] - 1, partes[0]);
                }
            }
            
            return new Date(dataStr);
        }

        // Função para formatar data
        function formatarData(data) {
            if (!data) return '';
            if (data instanceof Date) {
                return data.toLocaleDateString('pt-BR');
            }
            return data;
        }

        // Função para buscar todas as unidades do mesmo SKU
        function buscarUnidadesPorSKU(sku, unidadeAtualId) {
            // Simulação dos dados baseado na imagem fornecida
            const todasUnidades = [
                {
                    id: 'UN-KØNLQSNX-AMZK',
                    sku: '00030202',
                    produto: 'FILME BISC. ROSQUINHA COCO EMEGE 600GR',
                    lote: 'AAACXB0101',
                    validade: '07/04/2026',
                    volume: '583.50',
                    quantidade: '1',
                    unidade: 'PLT'
                },
                {
                    id: 'UN-2EP1M8IO-9Y8R',
                    sku: '00030202',
                    produto: 'FILME BISC. ROSQUINHA COCO EMEGE 600GR',
                    lote: 'AAACS60101',
                    validade: '25/06/2026',
                    volume: '535.87',
                    quantidade: '1',
                    unidade: 'PLT'
                },
                {
                    id: 'UN-CUT9HP6G-46K4',
                    sku: '00030202',
                    produto: 'FILME BISC. ROSQUINHA COCO EMEGE 600GR',
                    lote: 'AAACS60101',
                    validade: '25/06/2026',
                    volume: '555.88',
                    quantidade: '1',
                    unidade: 'PLT'
                }
            ];
            
            // Filtrar apenas unidades do mesmo SKU
            return todasUnidades.filter(u => u.sku === sku);
        }

        // Função principal para calcular a ordem baseada no SKU
        function calcularOrdemPorSKU(sku, validadeAtual, unidadeAtualId) {
            // Buscar todas unidades do mesmo SKU
            const unidadesDoSKU = buscarUnidadesPorSKU(sku, unidadeAtualId);
            
            if (!unidadesDoSKU || unidadesDoSKU.length === 0) {
                return { ordem: '1º', posicao: 1, unidades: [], totalUnidades: 1 };
            }
            
            // Mapear unidades com suas datas
            const unidadesComData = unidadesDoSKU.map(u => ({
                ...u,
                dataObj: parseData(u.validade)
            })).filter(u => u.dataObj !== null);
            
            // Agrupar por data de validade
            const grupos = {};
            unidadesComData.forEach(u => {
                const dataStr = u.validade;
                if (!grupos[dataStr]) {
                    grupos[dataStr] = [];
                }
                grupos[dataStr].push(u);
            });
            
            // Ordenar as datas (mais antiga primeiro)
            const datasOrdenadas = Object.keys(grupos).sort((a, b) => {
                const dataA = parseData(a);
                const dataB = parseData(b);
                return dataA - dataB;
            });
            
            // Mapear cada data para sua posição
            const posicaoPorData = {};
            datasOrdenadas.forEach((data, index) => {
                posicaoPorData[data] = index + 1; // 1º, 2º, 3º...
            });
            
            // Encontrar a posição da data atual
            const posicao = posicaoPorData[validadeAtual] || 1;
            
            // Converter para ordinal
            const ordinais = ['1º', '2º', '3º', '4º', '5º', '6º', '7º', '8º', '9º', '10º'];
            const ordem = ordinais[Math.min(posicao - 1, ordinais.length - 1)] || posicao + 'º';
            
            return {
                ordem,
                posicao,
                grupos,
                datasOrdenadas,
                unidades: unidadesComData,
                totalUnidades: unidadesComData.length
            };
        }

        // Carregar dados da URL
        const urlParams = new URLSearchParams(window.location.search);
        const unidadeId = urlParams.get('id') || 'UN-2EP1M8IO-9Y8R';
        const sku = urlParams.get('sku') || '00030202';
        const lote = urlParams.get('lote') || 'AAACS60101';
        const validade = urlParams.get('validade') || '25/06/2026';
        const produtoNome = decodeURIComponent(urlParams.get('produto') || 'FILME BISC. ROSQUINHA COCO EMEGE 600GR');
        const volume = urlParams.get('volume') || '535.87';
        const quantidade = urlParams.get('quantidade') || '1';
        const unidade = urlParams.get('unidade') || 'PLT';

        // Calcular ordem baseada em TODAS as unidades do mesmo SKU
        const resultado = calcularOrdemPorSKU(sku, validade, unidadeId);
        const ordem = resultado.ordem;

        // Construir link completo
        const baseUrl = 'https://rdnegocios8.github.io/ControleEstoqueGoogleSheets/baixa-view.html';
        const linkCompleto = `${baseUrl}?id=${unidadeId}&sku=${sku}&lote=${lote}&validade=${validade}&produto=${encodeURIComponent(produtoNome)}&volume=${volume}&quantidade=${quantidade}&unidade=${unidade}`;

        // Função para atualizar a visualização da etiqueta GRANDE
        function atualizarEtiqueta() {
            const etiquetaDiv = document.getElementById('etiquetaVisualizacao');
            
            // Formatar a data para exibição
            let dataExibicao = validade;
            if (validade.includes('/')) {
                const partes = validade.split('/');
                dataExibicao = `${partes[2]}-${partes[1]}-${partes[0]}`;
            }
            
            etiquetaDiv.innerHTML = `
                <div class="etiqueta-header">
                    <div class="etiqueta-codigo">CODIGO: ${sku}</div>
                    <div class="etiqueta-ordem">${ordem}</div>
                </div>
                <div class="etiqueta-descricao">${produtoNome}</div>
                <div class="etiqueta-linha">
                    <span class="etiqueta-label">LOTE:</span>
                    <span class="etiqueta-valor">${lote}</span>
                </div>
                <div class="etiqueta-linha">
                    <span class="etiqueta-label">VALIDADE:</span>
                    <span class="etiqueta-valor">${dataExibicao}</span>
                </div>
                <div class="etiqueta-footer">
                    <span>${volume} Kg</span>
                    <span>${quantidade} ${unidade}</span>
                </div>
                <div class="qr-section">
                    <div class="qr-code-box" id="qr-code-container">
                        <div id="qrcode"></div>
                    </div>
                    <div class="qr-info">
                        <p><strong>SKU:</strong> ${sku}</p>
                        <p><strong>Total:</strong> ${resultado.totalUnidades} unidades</p>
                        <p><strong>ID:</strong> ${unidadeId.substring(0, 15)}...</p>
                    </div>
                </div>
            `;
        }

        // Função para gerar QR Code
        function gerarQRCode() {
            const qrcodeDiv = document.getElementById('qrcode');
            if (!qrcodeDiv) return;
            
            qrcodeDiv.innerHTML = '';
            
            if (typeof QRCode !== 'undefined') {
                try {
                    QRCode.toCanvas(document.createElement('canvas'), linkCompleto, {
                        width: 200,
                        margin: 2
                    }, function(err, canvas) {
                        if (err) {
                            console.error('Erro:', err);
                            return;
                        }
                        qrcodeDiv.innerHTML = '';
                        canvas.style.width = '100%';
                        canvas.style.height = 'auto';
                        qrcodeDiv.appendChild(canvas);
                    });

                    // Atualizar resumo do SKU
                    document.getElementById('resumo-sku').innerHTML = `
                        <strong>SKU: ${sku}</strong> | 
                        <strong>Total de unidades:</strong> ${resultado.totalUnidades} | 
                        <strong>Datas diferentes:</strong> ${resultado.datasOrdenadas.length} |
                        <strong>Unidade atual:</strong> ${ordem}
                    `;

                    // Atualizar tabela com TODAS as unidades do mesmo SKU
                    let infoHtml = '<h3>📦 TODAS AS UNIDADES DO SKU ' + sku + ':</h3>';
                    infoHtml += '<table class="tabela-validades">';
                    infoHtml += '<tr><th>ID</th><th>LOTE</th><th>VALIDADE</th><th>ORDEM</th></tr>';
                    
                    resultado.datasOrdenadas.forEach(data => {
                        const unidadesDaData = resultado.grupos[data];
                        
                        unidadesDaData.forEach(u => {
                            // Calcular ordem para esta unidade
                            const resultadoUnidade = calcularOrdemPorSKU(sku, u.validade, u.id);
                            
                            let classeOrdem = 'ordem-1';
                            if (resultadoUnidade.posicao === 1) classeOrdem = 'ordem-1';
                            else if (resultadoUnidade.posicao === 2) classeOrdem = 'ordem-2';
                            else if (resultadoUnidade.posicao === 3) classeOrdem = 'ordem-3';
                            else if (resultadoUnidade.posicao === 4) classeOrdem = 'ordem-4';
                            else classeOrdem = 'ordem-5';
                            
                            infoHtml += `<tr ${u.id === unidadeId ? 'class="atual"' : ''}>`;
                            infoHtml += `<td>${u.id.substring(0, 15)}...</td>`;
                            infoHtml += `<td>${u.lote}</td>`;
                            infoHtml += `<td>${u.validade}</td>`;
                            infoHtml += `<td><span class="ordem-badge ${classeOrdem}">${resultadoUnidade.ordem}</span></td>`;
                            infoHtml += `</tr>`;
                        });
                    });
                    
                    infoHtml += '</table>';
                    document.getElementById('infoPaletes').innerHTML = infoHtml;

                } catch (e) {
                    console.error('Erro:', e);
                }
            }
        }

        // Função para imprimir a etiqueta GRANDE em paisagem
        function imprimirEtiqueta() {
            const janelaImpressao = window.open('', '_blank');
            
            // Formatar a data para exibição
            let dataExibicao = validade;
            if (validade.includes('/')) {
                const partes = validade.split('/');
                dataExibicao = `${partes[2]}-${partes[1]}-${partes[0]}`;
            }
            
            const conteudoImpressao = `
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Etiqueta de Palete - SKU ${sku} - ${ordem}</title>
                    <style>
                        * {
                            margin: 0;
                            padding: 0;
                            box-sizing: border-box;
                        }
                        
                        body {
                            font-family: 'Courier New', monospace;
                            background: white;
                            margin: 0;
                            padding: 20px;
                            display: flex;
                            justify-content: center;
                            align-items: center;
                            min-height: 100vh;
                        }
                        
                        .etiqueta {
                            border: 4px solid #000;
                            padding: 50px;
                            width: 1100px;
                            min-height: 750px;
                            margin: 0 auto;
                            page-break-inside: avoid;
                            display: flex;
                            flex-direction: column;
                            background: white;
                        }
                        
                        .etiqueta-header {
                            display: flex;
                            justify-content: space-between;
                            align-items: center;
                            border-bottom: 4px solid #000;
                            padding-bottom: 25px;
                            margin-bottom: 35px;
                        }
                        
                        .etiqueta-codigo {
                            font-size: 52px;
                            font-weight: bold;
                        }
                        
                        .etiqueta-ordem {
                            font-size: 140px;
                            font-weight: bold;
                            line-height: 1;
                        }
                        
                        .etiqueta-descricao {
                            font-size: 48px;
                            font-weight: bold;
                            margin: 35px 0;
                            text-transform: uppercase;
                            line-height: 1.3;
                            border-bottom: 2px solid #000;
                            padding-bottom: 25px;
                        }
                        
                        .etiqueta-linha {
                            display: flex;
                            margin: 30px 0;
                            font-size: 44px;
                            align-items: baseline;
                        }
                        
                        .etiqueta-label {
                            font-weight: bold;
                            width: 220px;
                        }
                        
                        .etiqueta-valor {
                            flex: 1;
                            font-weight: bold;
                        }
                        
                        .etiqueta-footer {
                            display: flex;
                            justify-content: space-between;
                            margin-top: 45px;
                            padding-top: 25px;
                            border-top: 4px solid #000;
                            font-weight: bold;
                            font-size: 52px;
                        }
                        
                        .qr-section {
                            display: flex;
                            align-items: center;
                            justify-content: space-between;
                            margin-top: 45px;
                            padding: 25px;
                            background: #f8f9fa;
                            border: 3px solid #000;
                        }
                        
                        .qr-code-box {
                            background: white;
                            padding: 20px;
                            border: 2px solid #000;
                        }
                        
                        #qrcode-img {
                            width: 200px;
                            height: 200px;
                        }
                        
                        .qr-info {
                            font-size: 28px;
                            margin-left: 35px;
                        }
                        
                        .qr-info p {
                            margin: 12px 0;
                        }
                        
                        @media print {
                            body {
                                padding: 0;
                                margin: 0;
                            }
                            .etiqueta {
                                box-shadow: none;
                                margin: 0;
                                width: 100%;
                                min-height: 100vh;
                            }
                        }
                    </style>
                </head>
                <body>
                    <div class="etiqueta">
                        <div class="etiqueta-header">
                            <div class="etiqueta-codigo">CODIGO: ${sku}</div>
                            <div class="etiqueta-ordem">${ordem}</div>
                        </div>
                        <div class="etiqueta-descricao">${produtoNome}</div>
                        <div class="etiqueta-linha">
                            <span class="etiqueta-label">LOTE:</span>
                            <span class="etiqueta-valor">${lote}</span>
                        </div>
                        <div class="etiqueta-linha">
                            <span class="etiqueta-label">VALIDADE:</span>
                            <span class="etiqueta-valor">${dataExibicao}</span>
                        </div>
                        <div class="etiqueta-footer">
                            <span>${volume} Kg</span>
                            <span>${quantidade} ${unidade}</span>
                        </div>
                        <div class="qr-section">
                            <div class="qr-code-box">
                                <img src="${document.querySelector('#qrcode canvas').toDataURL()}" id="qrcode-img" style="width: 200px; height: 200px;">
                            </div>
                            <div class="qr-info">
                                <p><strong>SKU:</strong> ${sku}</p>
                                <p><strong>Total:</strong> ${resultado.totalUnidades} unidades</p>
                                <p><strong>ID:</strong> ${unidadeId}</p>
                                <p><strong>Ordem:</strong> ${ordem}</p>
                            </div>
                        </div>
                    </div>
                    <script>
                        window.onload = function() { 
                            setTimeout(function() {
                                window.print(); 
                                window.close();

                    <\/script>
                </body>
                </html>
            `;
            
            janelaImpressao.document.write(conteudoImpressao);
            janelaImpressao.document.close();
        }

        // Função para baixar a etiqueta como imagem
        function baixarEtiqueta() {
            const qrCanvas = document.querySelector('#qrcode canvas');
            
            if (!qrCanvas) {
                alert('Aguarde o QR Code ser gerado!');
                return;
            }
            
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // Tamanho GRANDE para a imagem
            canvas.width = 1200;
            canvas.height = 800;
            
            // Fundo branco
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Desenhar borda
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 6;
            ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);
            
            // Formatar data
            let dataExibicao = validade;
            if (validade.includes('/')) {
                const partes = validade.split('/');
                dataExibicao = `${partes[2]}-${partes[1]}-${partes[0]}`;
            }
            
            // Desenhar a etiqueta em tamanho GRANDE
            ctx.font = 'bold 48px "Courier New"';
            ctx.fillStyle = 'black';
            
            // Cabeçalho
            ctx.font = 'bold 52px "Courier New"';
            ctx.fillText(`CODIGO: ${sku}`, 50, 100);
            ctx.font = 'bold 140px "Courier New"';
            ctx.fillText(ordem, 900, 150);
            
            // Linha divisória
            ctx.beginPath();
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 4;
            ctx.moveTo(50, 180);
            ctx.lineTo(1150, 180);
            ctx.stroke();
            
            // Descrição (quebrar se necessário)
            ctx.font = 'bold 48px "Courier New"';
            let descricao = produtoNome;
            if (descricao.length > 25) {
                ctx.fillText(descricao.substring(0, 25), 50, 260);
                ctx.fillText(descricao.substring(25, 50), 50, 320);
            } else {
                ctx.fillText(descricao, 50, 260);
            }
            
            // Lote
            ctx.font = '44px "Courier New"';
            ctx.fillText('LOTE:', 50, 420);
            ctx.font = 'bold 44px "Courier New"';
            ctx.fillText(lote, 250, 420);
            
            // Validade
            ctx.font = '44px "Courier New"';
            ctx.fillText('VALIDADE:', 50, 490);
            ctx.font = 'bold 44px "Courier New"';
            ctx.fillText(dataExibicao, 300, 490);
            
            // Rodapé
            ctx.beginPath();
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 4;
            ctx.moveTo(50, 570);
            ctx.lineTo(1150, 570);
            ctx.stroke();
            
            ctx.font = 'bold 52px "Courier New"';
            ctx.fillText(`${volume} Kg`, 50, 650);
            ctx.fillText(`${quantidade} ${unidade}`, 800, 650);
            
            // Desenhar QR Code
            ctx.drawImage(qrCanvas, 150, 700, 150, 150);
            
            // Informações adicionais
            ctx.font = '24px "Courier New"';
            ctx.fillText(`SKU: ${sku} | Total: ${resultado.totalUnidades} unidades`, 350, 780);
            
            // Baixar imagem
            const link = document.createElement('a');
            link.download = `etiqueta-${sku}-${ordem}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Inicializar
        window.onload = function() {
            atualizarEtiqueta();
            setTimeout(gerarQRCode, 100);
        };

        if (document.readyState === 'complete') {
            atualizarEtiqueta();
            gerarQRCode();
        } else {
            window.addEventListener('load', function() {
                atualizarEtiqueta();
                gerarQRCode();
            });
        }
    </script>
</body>
</html>
