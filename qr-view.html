<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code da Unidade</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            margin: 0;
        }
        
        .qr-container {
            max-width: 600px;
            width: 100%;
        }
        
        .qr-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px solid #fbbf24;
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 30px rgba(251, 191, 36, 0.1);
            position: relative;
            overflow: hidden;
            transition: box-shadow 0.2s ease;
        }
        
        .qr-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #fbbf24, #f59e0b, #fbbf24);
        }
        
        .badge-unidade {
            display: inline-block;
            padding: 8px 20px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #0f172a;
            border-radius: 30px;
            font-weight: 700;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
        }
        
        .qr-code-box {
            background: linear-gradient(135deg, #f1f5f9, #e2e8f0);
            padding: 30px;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
            border: 3px solid #fbbf24;
            box-shadow: 0 15px 40px rgba(251, 191, 36, 0.2);
            min-height: 320px;
        }
        
        #qrcode canvas, #qrcode img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .qr-info {
            background: linear-gradient(135deg, #334155, #1e293b);
            border-radius: 16px;
            padding: 25px;
            margin: 20px 0;
            border: 2px solid #fbbf24;
            text-align: left;
            box-shadow: 0 8px 20px rgba(251, 191, 36, 0.08);
        }
        
        .qr-info p {
            margin: 12px 0;
            color: #cbd5e1;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
            font-size: 1rem;
        }
        
        .qr-info strong {
            color: #fbbf24;
            width: 120px;
            display: inline-block;
            font-weight: 600;
        }
        
        .volume-info {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            padding: 25px;
            background: linear-gradient(135deg, #334155, #1e293b);
            border-radius: 12px;
            border: 2px solid #fbbf24;
            box-shadow: 0 8px 20px rgba(251, 191, 36, 0.08);
        }
        
        .volume-item {
            text-align: center;
        }
        
        .volume-value {
            font-size: 2.2rem;
            font-weight: 700;
            color: #fbbf24;
            line-height: 1.2;
            text-shadow: 0 2px 8px rgba(251, 191, 36, 0.15);
        }
        
        .volume-label {
            font-size: 0.9rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .volumes-table {
            background: linear-gradient(135deg, #334155, #1e293b);
            border-radius: 16px;
            padding: 25px;
            margin: 20px 0;
            border: 2px solid #fbbf24;
            box-shadow: 0 8px 20px rgba(251, 191, 36, 0.08);
        }
        
        .volumes-table h4 {
            color: #fbbf24;
            margin-bottom: 15px;
            text-align: left;
        }
        
        .volumes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }
        
        .volume-card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 18px;
            text-align: left;
            transition: all 0.2s ease;
        }
        
        .volume-card:hover {
            border-color: #fbbf24;
            box-shadow: 0 4px 12px rgba(251, 191, 36, 0.1);
        }
        
        .volume-card .tipo {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        
        .volume-card .tipo.padrao {
            background: #10b981;
            color: white;
        }
        
        .volume-card .tipo.fora {
            background: #f59e0b;
            color: #0f172a;
        }
        
        .volume-card p {
            margin: 5px 0;
            color: #cbd5e1;
            font-size: 0.9rem;
        }
        
        .volume-card p strong {
            color: #fbbf24;
        }
        
        .info-id {
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            color: #fbbf24;
            word-break: break-all;
            margin: 15px 0;
            border: 2px solid #fbbf24;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
        }
        
        .qr-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        
        .qr-actions button {
            padding: 12px 25px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 120px;
            justify-content: center;
        }
        
        .btn-download {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
        }
        
        .btn-print {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #0f172a;
        }
        
        .btn-close {
            background: linear-gradient(135deg, #64748b, #475569);
            color: white;
        }
        
        .qr-actions button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(251, 191, 36, 0.25);
        }
        
        .qr-actions button:active {
            transform: translateY(0);
        }
        
        @media print {
            .qr-actions, .badge-unidade {
                display: none;
            }
            
            .qr-card {
                box-shadow: none;
                border: 1px solid #000;
            }
        }
    </style>
</head>
<body>
    <div class="qr-container">
        <div class="qr-card">
            <div class="badge-unidade">
                <i class="bi bi-qr-code-scan"></i> QR CODE DA UNIDADE
            </div>
            
            <div class="qr-code-box" id="qr-code-container">
                <div id="qrcode"></div>
            </div>
            
            <div class="qr-info" id="qr-info">
                <!-- Informações serão preenchidas via JavaScript -->
            </div>
            
            <!-- Área para volume/quantidade TOTAIS (sempre visível) -->
            <div class="volume-info" id="volume-info">
                <!-- Será preenchido com os totais -->
            </div>
            
            <!-- Área para múltiplos volumes (aparece só quando necessário) -->
            <div class="volumes-table" id="volumes-table" style="display: none;">
                <h4><i class="bi bi-boxes"></i> Detalhamento dos Volumes</h4>
                <div class="volumes-grid" id="volumes-grid"></div>
            </div>
            
            <div class="info-id" id="info-id"></div>
            
            <div class="qr-actions">
                <button class="btn-download" onclick="baixarQR()">
                    <i class="bi bi-download"></i> Baixar
                </button>
                <button class="btn-print" onclick="window.print()">
                    <i class="bi bi-printer"></i> Imprimir
                </button>
                <button class="btn-close" onclick="window.close()">
                    <i class="bi bi-x-lg"></i> Fechar
                </button>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // FUNÇÃO PARA CORRIGIR A ESTRUTURA DOS DADOS
        // ============================================
        function corrigirEstruturaDados(dados) {
            console.log('🔧 Corrigindo estrutura:', dados);
            
            // Caso 1: Já tem produtos e não está vazio
            if (dados.produtos && dados.produtos.length > 0) {
                console.log('✅ Estrutura já está correta (com produtos)');
                return dados;
            }
            
            // Caso 2: Tem produto direto (formato novo)
            if (dados.produto && dados.sku) {
                console.log('✅ Convertendo formato novo para formato esperado');
                return {
                    id: dados.id,
                    produtos: [{
                        nome: dados.produto,
                        sku: dados.sku,
                        tipoEmbalagem: dados.tipoEmbalagem || 'UN',
                        volumes: dados.volumes || []
                    }],
                    totalVolumes: dados.totalVolumes || 0,
                    totalUN: dados.totalUN || 0
                };
            }
            
            // Caso 3: Dados mínimos (fallback)
            console.log('⚠️ Criando estrutura mínima');
            return {
                id: dados.id || 'ID desconhecido',
                produtos: [{
                    nome: dados.nome || dados.produto || 'Produto',
                    sku: dados.sku || 'SKU',
                    tipoEmbalagem: dados.tipoEmbalagem || 'UN',
                    volumes: dados.volumes || []
                }],
                totalVolumes: dados.totalVolumes || 0,
                totalUN: dados.totalUN || 0
            };
        }

        // ============================================
        // CARREGAR DADOS DA URL
        // ============================================
        const urlParams = new URLSearchParams(window.location.search);
        const dadosParam = urlParams.get('dados');
        
        let unidadeData = null;
        let isMultipla = false;
        
        // ============================================
        // PROCESSAR DADOS - COM CORREÇÃO DE ESTRUTURA
        // ============================================
        if (dadosParam) {
            try {
                const dadosParsed = JSON.parse(decodeURIComponent(dadosParam));
                console.log('📦 Dados brutos da URL:', dadosParsed);
                
                // APLICAR A CORREÇÃO DE ESTRUTURA
                unidadeData = corrigirEstruturaDados(dadosParsed);
                isMultipla = true;
                
                console.log('✅ Dados após correção:', unidadeData);
                
            } catch (e) {
                console.error('❌ Erro ao parsear dados:', e);
            }
        }
        
        // ============================================
        // SE NÃO TIVER, É UNIDADE SIMPLES (formato antigo)
        // ============================================
        if (!isMultipla) {
            const id = urlParams.get('id');
            if (id) {
                unidadeData = {
                    id: id,
                    produtos: [{
                        nome: decodeURIComponent(urlParams.get('produto') || ''),
                        sku: urlParams.get('sku') || '',
                        tipoEmbalagem: urlParams.get('unidade') || 'UN',
                        volumes: [{
                            tipo: 'padrao',
                            qtdVolumes: parseFloat(urlParams.get('volume')) || 0,
                            unPorEmbalagem: parseFloat(urlParams.get('qtdPorEmbalagem')) || 1,
                            totalUN: parseFloat(urlParams.get('quantidade')) || 0,
                            lote: urlParams.get('lote') || '',
                            validade: urlParams.get('validade') || '',
                            localizacao: '-'
                        }]
                    }],
                    totalVolumes: parseFloat(urlParams.get('volume')) || 0,
                    totalUN: parseFloat(urlParams.get('quantidade')) || 0
                };
                console.log('📦 Dados do formato antigo:', unidadeData);
            }
        }

        // ============================================
        // CONSTRUIR LINK PARA BAIXA-VIEW
        // ============================================
        const baseUrl = 'https://rdnegocios8.github.io/ControleEstoqueGoogleSheets/baixa-view.html';
        let linkCompleto;
        
        if (unidadeData) {
            linkCompleto = `${baseUrl}?dados=${encodeURIComponent(JSON.stringify(unidadeData))}`;
            console.log('🔗 Link gerado:', linkCompleto);
        }

        // ============================================
        // FUNÇÃO PARA FORMATAR DATA
        // ============================================
        function formatarData(dataString) {
            if (!dataString) return 'N/A';
            if (typeof dataString === 'string' && dataString.includes('-')) {
                const partes = dataString.split('-');
                if (partes.length === 3) {
                    return `${partes[2]}/${partes[1]}/${partes[0]}`;
                }
            }
            return dataString;
        }

        // ============================================
        // FUNÇÃO PARA FORMATAR NÚMERO
        // ============================================
        function formatarNumero(valor) {
            if (!valor && valor !== 0) return '0,00';
            return valor.toFixed(2).replace('.', ',');
        }

        // ============================================
        // FUNÇÃO PARA GERAR QR CODE
        // ============================================
        function gerarQRCode() {
            const qrcodeDiv = document.getElementById('qrcode');
            qrcodeDiv.innerHTML = '';
            
            if (!unidadeData || !unidadeData.id) {
                qrcodeDiv.innerHTML = '<p style="color: #ef4444;">ID da unidade não encontrado</p>';
                return;
            }

            if (typeof QRCode !== 'undefined') {
                try {
                    QRCode.toCanvas(document.createElement('canvas'), linkCompleto, {
                        width: 250,
                        margin: 2
                    }, function(err, canvas) {
                        if (err) {
                            console.error('Erro:', err);
                            qrcodeDiv.innerHTML = '<p style="color: #ef4444;">Erro ao gerar QR Code</p>';
                            return;
                        }
                        
                        qrcodeDiv.innerHTML = '';
                        canvas.style.width = '100%';
                        canvas.style.height = 'auto';
                        qrcodeDiv.appendChild(canvas);
                    });

                    // PEGAR O PRIMEIRO PRODUTO
                    const produto = unidadeData.produtos?.[0];
                    if (!produto) {
                        console.error('❌ Nenhum produto encontrado');
                        return;
                    }
                    
                    const volumes = produto.volumes || [];
                    
                    // PREENCHER INFORMAÇÕES BÁSICAS
                    document.getElementById('qr-info').innerHTML = `
                        <p><strong>Produto:</strong> ${produto.nome || 'N/A'}</p>
                        <p><strong>SKU:</strong> ${produto.sku || 'N/A'}</p>
                        ${volumes.length > 0 ? `
                            <p><strong>Lote:</strong> ${volumes[0].lote || 'N/A'}</p>
                            <p><strong>Validade:</strong> ${formatarData(volumes[0].validade)}</p>
                        ` : ''}
                    `;

                    // MOSTRAR VOLUME E QUANTIDADE TOTAIS
                    document.getElementById('volume-info').innerHTML = `
                        <div class="volume-item">
                            <div class="volume-value">${formatarNumero(unidadeData.totalVolumes || 0)}</div>
                            <div class="volume-label">${produto.tipoEmbalagem || 'UN'}</div>
                        </div>
                        <div class="volume-item">
                            <div class="volume-value">${formatarNumero(unidadeData.totalUN || 0)}</div>
                            <div class="volume-label">UN</div>
                        </div>
                    `;

                    // MOSTRAR DETALHAMENTO DOS VOLUMES
                    if (volumes.length > 0) {
                        document.getElementById('volumes-table').style.display = 'block';
                        const grid = document.getElementById('volumes-grid');
                        grid.innerHTML = '';
                        
                        volumes.forEach((vol, index) => {
                            const card = document.createElement('div');
                            card.className = 'volume-card';
                            card.innerHTML = `
                                <span class="tipo ${vol.tipo === 'padrao' ? 'padrao' : 'fora'}">VOLUME ${index + 1} - ${vol.tipo === 'padrao' ? 'PADRÃO' : 'FORA'}</span>
                                <p><strong>Lote:</strong> ${vol.lote || '-'}</p>
                                <p><strong>Validade:</strong> ${formatarData(vol.validade)}</p>
                                <p><strong>Quantidade:</strong> ${vol.qtdVolumes || 0} ${produto.tipoEmbalagem}</p>
                                <p><strong>UN/Volume:</strong> ${formatarNumero(vol.unPorEmbalagem || 0)}</p>
                                <p><strong>Total UN:</strong> ${formatarNumero(vol.totalUN || 0)}</p>
                            `;
                            grid.appendChild(card);
                        });
                    }

                    document.getElementById('info-id').innerHTML = `
                        <i class="bi bi-upc-scan"></i> ID: ${unidadeData.id}
                    `;

                } catch (e) {
                    console.error('Erro:', e);
                    qrcodeDiv.innerHTML = '<p style="color: #ef4444;">Erro ao gerar QR Code</p>';
                }
            } else {
                qrcodeDiv.innerHTML = '<p style="color: #ef4444;">Biblioteca não carregada</p>';
            }
        }

        function baixarQR() {
            const canvas = document.querySelector('#qrcode canvas');
            if (!canvas) {
                alert('QR Code ainda não foi gerado!');
                return;
            }
            
            const link = document.createElement('a');
            link.download = `qrcode-${unidadeData?.id || 'unidade'}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        window.onload = function() {
            setTimeout(gerarQRCode, 100);
        };
    </script>
</body>
</html>
