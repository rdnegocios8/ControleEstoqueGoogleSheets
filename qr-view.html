<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code da Unidade</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            margin: 0;
        }
        
        .qr-container {
            max-width: 600px;
            width: 100%;
        }
        
        .qr-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px solid #fbbf24;
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }
        
        .qr-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #fbbf24, #f59e0b, #fbbf24);
        }
        
        .badge-unidade {
            display: inline-block;
            padding: 8px 20px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #0f172a;
            border-radius: 30px;
            font-weight: 700;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
        }
        
        .qr-code-box {
            background: linear-gradient(135deg, #ffffff, #f8fafc);
            padding: 25px;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
            border: 3px solid #fbbf24;
            box-shadow: 0 15px 40px rgba(251, 191, 36, 0.2);
            min-height: 300px;
        }
        
        #qrcode canvas, #qrcode img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .qr-info {
            background: #1e293b;
            border-radius: 16px;
            padding: 25px;
            margin: 20px 0;
            border: 1px solid #fbbf24;
            text-align: left;
        }
        
        .qr-info p {
            margin: 12px 0;
            color: #cbd5e1;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
            font-size: 1rem;
        }
        
        .qr-info strong {
            color: #fbbf24;
            width: 120px;
            display: inline-block;
            font-weight: 600;
        }
        
        .volume-info {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            padding: 20px;
            background: #1e293b;
            border-radius: 12px;
            border: 1px solid #334155;
        }
        
        .volume-item {
            text-align: center;
        }
        
        .volume-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #fbbf24;
            line-height: 1.2;
        }
        
        .volume-label {
            font-size: 0.9rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .volumes-table {
            background: #1e293b;
            border-radius: 16px;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid #fbbf24;
        }
        
        .volumes-table h4 {
            color: #fbbf24;
            margin-bottom: 15px;
            text-align: left;
        }
        
        .volumes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }
        
        .volume-card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 15px;
            text-align: left;
        }
        
        .volume-card .tipo {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        
        .volume-card .tipo.padrao {
            background: #10b981;
            color: white;
        }
        
        .volume-card .tipo.fora {
            background: #f59e0b;
            color: #0f172a;
        }
        
        .volume-card p {
            margin: 5px 0;
            color: #cbd5e1;
            font-size: 0.9rem;
        }
        
        .volume-card p strong {
            color: #fbbf24;
        }
        
        .info-id {
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            color: #fbbf24;
            word-break: break-all;
            margin: 15px 0;
            border: 2px solid #fbbf24;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
        }
        
        .qr-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        
        .qr-actions button {
            padding: 12px 25px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 120px;
            justify-content: center;
        }
        
        .btn-download {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
        }
        
        .btn-print {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #0f172a;
        }
        
        .btn-close {
            background: linear-gradient(135deg, #64748b, #475569);
            color: white;
        }
        
        .qr-actions button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(251, 191, 36, 0.3);
        }
        
        @media print {
            .qr-actions, .badge-unidade {
                display: none;
            }
            
            .qr-card {
                box-shadow: none;
                border: 1px solid #000;
            }
        }
    </style>
</head>
<body>
    <div class="qr-container">
        <div class="qr-card">
            <div class="badge-unidade">
                <i class="bi bi-qr-code-scan"></i> QR CODE DA UNIDADE
            </div>
            
            <div class="qr-code-box" id="qr-code-container">
                <div id="qrcode"></div>
            </div>
            
            <div class="qr-info" id="qr-info">
                <!-- Informações serão preenchidas via JavaScript -->
            </div>
            
            <!-- Área para volume/quantidade TOTAIS (sempre visível) -->
            <div class="volume-info" id="volume-info">
                <!-- Será preenchido com os totais -->
            </div>
            
            <!-- Área para múltiplos volumes (aparece só quando necessário) -->
            <div class="volumes-table" id="volumes-table" style="display: none;">
                <h4><i class="bi bi-boxes"></i> Detalhamento dos Volumes</h4>
                <div class="volumes-grid" id="volumes-grid"></div>
            </div>
            
            <div class="info-id" id="info-id"></div>
            
            <div class="qr-actions">
                <button class="btn-download" onclick="baixarQR()">
                    <i class="bi bi-download"></i> Baixar
                </button>
                <button class="btn-print" onclick="window.print()">
                    <i class="bi bi-printer"></i> Imprimir
                </button>
                <button class="btn-close" onclick="window.close()">
                    <i class="bi bi-x-lg"></i> Fechar
                </button>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // CARREGAR DADOS DA URL
        // ============================================
        const urlParams = new URLSearchParams(window.location.search);
        const dadosParam = urlParams.get('dados');
        
        let unidadeData = null;
        let isMultipla = false;
        
        // ============================================
        // SE TIVER PARÂMETRO 'dados' (UNIDADE MÚLTIPLA)
        // ============================================
        if (dadosParam) {
            try {
                unidadeData = JSON.parse(decodeURIComponent(dadosParam));
                isMultipla = true;
                console.log('✅ Dados da unidade múltipla carregados:', unidadeData);
            } catch (e) {
                console.error('❌ Erro ao parsear dados:', e);
            }
        }
        
        // ============================================
        // SE NÃO TIVER, É UNIDADE SIMPLES (formato antigo)
        // ============================================
        if (!isMultipla) {
            // Dados para unidade simples
            unidadeData = {
                id: urlParams.get('id'),
                produtos: [{
                    nome: decodeURIComponent(urlParams.get('produto') || ''),
                    sku: urlParams.get('sku'),
                    tipoEmbalagem: urlParams.get('unidade') || 'UN',
                    volumes: [{
                        tipo: 'padrao',
                        qtdVolumes: parseFloat(urlParams.get('volume')) || 0,
                        unPorEmbalagem: parseFloat(urlParams.get('qtdPorEmbalagem')) || 1,
                        totalUN: parseFloat(urlParams.get('quantidade')) || 0,
                        lote: urlParams.get('lote'),
                        validade: urlParams.get('validade'),
                        localizacao: '-'
                    }]
                }],
                totalVolumes: parseFloat(urlParams.get('volume')) || 0,
                totalUN: parseFloat(urlParams.get('quantidade')) || 0
            };
        }

        // ============================================
        // CONSTRUIR LINK PARA BAIXA-VIEW
        // ============================================
        const baseUrl = 'https://rdnegocios8.github.io/ControleEstoqueGoogleSheets/baixa-view.html';
        let linkCompleto;
        
        if (isMultipla) {
            // Unidade múltipla: passar todos os dados
            linkCompleto = `${baseUrl}?dados=${encodeURIComponent(JSON.stringify(unidadeData))}`;
        } else {
            // Unidade simples: formato original
            linkCompleto = `${baseUrl}?id=${unidadeData.id}&sku=${unidadeData.produtos[0].sku}&lote=${unidadeData.produtos[0].volumes[0].lote}&validade=${unidadeData.produtos[0].volumes[0].validade}&produto=${encodeURIComponent(unidadeData.produtos[0].nome)}&volume=${unidadeData.produtos[0].volumes[0].qtdVolumes}&quantidade=${unidadeData.produtos[0].volumes[0].totalUN}&unidade=${unidadeData.produtos[0].tipoEmbalagem}&unidadeBase=UN&qtdPorEmbalagem=${unidadeData.produtos[0].volumes[0].unPorEmbalagem}`;
        }

        // ============================================
        // FUNÇÃO PARA FORMATAR DATA
        // ============================================
        function formatarData(dataString) {
            if (!dataString) return 'N/A';
            if (typeof dataString === 'string' && dataString.includes('-')) {
                const partes = dataString.split('-');
                if (partes.length === 3) {
                    return `${partes[2]}/${partes[1]}/${partes[0]}`;
                }
            }
            return dataString;
        }

        // ============================================
        // FUNÇÃO PARA FORMATAR NÚMERO
        // ============================================
        function formatarNumero(valor) {
            if (!valor && valor !== 0) return '0,00';
            return valor.toFixed(2).replace('.', ',');
        }

        // ============================================
        // FUNÇÃO PARA GERAR QR CODE
        // ============================================
        function gerarQRCode() {
            const qrcodeDiv = document.getElementById('qrcode');
            qrcodeDiv.innerHTML = '';
            
            if (!unidadeData || !unidadeData.id) {
                qrcodeDiv.innerHTML = '<p style="color: #ef4444;">ID da unidade não encontrado</p>';
                return;
            }

            if (typeof QRCode !== 'undefined') {
                try {
                    QRCode.toCanvas(document.createElement('canvas'), linkCompleto, {
                        width: 250,
                        margin: 2
                    }, function(err, canvas) {
                        if (err) {
                            console.error('Erro:', err);
                            qrcodeDiv.innerHTML = '<p style="color: #ef4444;">Erro ao gerar QR Code</p>';
                            return;
                        }
                        
                        qrcodeDiv.innerHTML = '';
                        canvas.style.width = '100%';
                        canvas.style.height = 'auto';
                        qrcodeDiv.appendChild(canvas);
                    });

                    // ============================================
                    // PREENCHER INFORMAÇÕES BÁSICAS (usando o primeiro volume)
                    // ============================================
                    const primeiroProduto = unidadeData.produtos[0];
                    const primeiroVolume = primeiroProduto.volumes[0];
                    
                    document.getElementById('qr-info').innerHTML = `
                        <p><strong>Produto:</strong> ${primeiroProduto.nome || 'N/A'}</p>
                        <p><strong>SKU:</strong> ${primeiroProduto.sku || 'N/A'}</p>
                        <p><strong>Lote:</strong> ${primeiroVolume.lote || 'N/A'}</p>
                        <p><strong>Validade:</strong> ${formatarData(primeiroVolume.validade)}</p>
                    `;

                    // ============================================
                    // MOSTRAR VOLUME E QUANTIDADE TOTAIS (sempre visível)
                    // ============================================
                    document.getElementById('volume-info').innerHTML = `
                        <div class="volume-item">
                            <div class="volume-value">${formatarNumero(unidadeData.totalVolumes)}</div>
                            <div class="volume-label">${primeiroProduto.tipoEmbalagem}</div>
                        </div>
                        <div class="volume-item">
                            <div class="volume-value">${formatarNumero(unidadeData.totalUN)}</div>
                            <div class="volume-label">UN</div>
                        </div>
                    `;

                    // ============================================
                    // SE FOR UNIDADE MÚLTIPLA, MOSTRAR DETALHAMENTO
                    // ============================================
                    if (isMultipla && unidadeData.produtos[0].volumes.length > 1) {
                        document.getElementById('volumes-table').style.display = 'block';
                        const grid = document.getElementById('volumes-grid');
                        grid.innerHTML = '';
                        
                        unidadeData.produtos[0].volumes.forEach((vol, index) => {
                            const card = document.createElement('div');
                            card.className = 'volume-card';
                            card.innerHTML = `
                                <span class="tipo ${vol.tipo === 'padrao' ? 'padrao' : 'fora'}">VOLUME ${index + 1} - ${vol.tipo === 'padrao' ? 'PADRÃO' : 'FORA'}</span>
                                <p><strong>Lote:</strong> ${vol.lote || '-'}</p>
                                <p><strong>Validade:</strong> ${formatarData(vol.validade)}</p>
                                <p><strong>Quantidade:</strong> ${vol.qtdVolumes} ${primeiroProduto.tipoEmbalagem}</p>
                                <p><strong>UN/Volume:</strong> ${formatarNumero(vol.unPorEmbalagem)}</p>
                                <p><strong>Total UN:</strong> ${formatarNumero(vol.totalUN)}</p>
                            `;
                            grid.appendChild(card);
                        });
                    }

                    document.getElementById('info-id').innerHTML = `
                        <i class="bi bi-upc-scan"></i> ID: ${unidadeData.id}
                    `;

                } catch (e) {
                    console.error('Erro:', e);
                    qrcodeDiv.innerHTML = '<p style="color: #ef4444;">Erro ao gerar QR Code</p>';
                }
            } else {
                qrcodeDiv.innerHTML = '<p style="color: #ef4444;">Biblioteca não carregada</p>';
            }
        }

        function baixarQR() {
            const canvas = document.querySelector('#qrcode canvas');
            if (!canvas) {
                alert('QR Code ainda não foi gerado!');
                return;
            }
            
            const link = document.createElement('a');
            link.download = `qrcode-${unidadeData?.id || 'unidade'}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        window.onload = function() {
            setTimeout(gerarQRCode, 100);
        };
    </script>
</body>
</html>
