<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code da Unidade</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0a0c0f 0%, #1a1e24 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .qr-container {
            max-width: 600px;
            width: 100%;
        }
        
        .qr-card {
            background-color: #1a1e24;
            border: 2px solid #fd7e14;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(220,53,69,0.3);
            position: relative;
            overflow: hidden;
        }
        
        .qr-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #dc3545, #fd7e14, #0d6efd);
        }
        
        .qr-header {
            margin-bottom: 30px;
        }
        
        .qr-header h2 {
            color: #fd7e14;
            font-weight: 700;
            font-size: 2rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .qr-code-box {
            background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
            padding: 25px;
            border-radius: 15px;
            display: inline-block;
            margin: 20px 0;
            border: 3px solid #fd7e14;
            box-shadow: 0 0 30px rgba(253,126,20,0.3);
        }
        
        #qrcode {
            width: 250px;
            height: 250px;
            margin: 0 auto;
        }
        
        #qrcode canvas, #qrcode img {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }
        
        .qr-info {
            background: linear-gradient(135deg, #2c3034 0%, #1a1e24 100%);
            border-radius: 15px;
            padding: 25px;
            margin: 20px 0;
            border: 1px solid #dc3545;
            text-align: left;
        }
        
        .qr-info p {
            margin: 12px 0;
            font-size: 1rem;
            color: #e9ecef;
            border-bottom: 1px solid #2c3034;
            padding-bottom: 8px;
        }
        
        .qr-info strong {
            color: #fd7e14;
            width: 120px;
            display: inline-block;
            font-size: 0.95rem;
        }
        
        .qr-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        
        .qr-actions button {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 120px;
            justify-content: center;
        }
        
        .btn-download {
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
            color: white;
        }
        
        .btn-print {
            background: linear-gradient(135deg, #fd7e14, #cc7a00);
            color: white;
        }
        
        .btn-close {
            background: linear-gradient(135deg, #6c757d, #5a6268);
            color: white;
        }
        
        .qr-actions button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(253,126,20,0.4);
        }
        
        .badge-unidade {
            display: inline-block;
            padding: 8px 20px;
            background: linear-gradient(135deg, #dc3545, #fd7e14);
            color: white;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .info-id {
            background: #2c3034;
            padding: 12px 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.9rem;
            color: #fd7e14;
            word-break: break-all;
            margin: 15px 0;
            border: 1px solid #fd7e14;
        }
        
        .volume-info {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            padding: 15px;
            background: #2c3034;
            border-radius: 10px;
        }
        
        .volume-item {
            text-align: center;
        }
        
        .volume-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fd7e14;
            display: block;
        }
        
        .volume-label {
            font-size: 0.8rem;
            color: #adb5bd;
            text-transform: uppercase;
        }
        
        @media print {
            .qr-actions {
                display: none;
            }
            
            .qr-card {
                box-shadow: none;
                border: 1px solid #000;
            }
        }
    </style>
</head>
<body>
    <div class="qr-container">
        <div class="qr-card">
            <div class="badge-unidade">
                <i class="bi bi-qr-code-scan"></i> QR CODE DA UNIDADE
            </div>
            
            <div class="qr-code-box">
                <div id="qrcode"></div>
            </div>
            
            <div class="qr-info" id="qr-info">
                <!-- Informações serão preenchidas via JavaScript -->
            </div>
            
            <div class="volume-info" id="volume-info">
                <!-- Informações de volume -->
            </div>
            
            <div class="info-id" id="info-id"></div>
            
            <div class="qr-actions">
                <button class="btn-download" onclick="baixarQR()">
                    <i class="bi bi-download"></i> Baixar
                </button>
                <button class="btn-print" onclick="window.print()">
                    <i class="bi bi-printer"></i> Imprimir
                </button>
                <button class="btn-close" onclick="window.close()">
                    <i class="bi bi-x-lg"></i> Fechar
                </button>
            </div>
        </div>
    </div>

    <script>
        // Carregar dados da URL
        const urlParams = new URLSearchParams(window.location.search);
        const unidadeId = urlParams.get('id');
        const sku = urlParams.get('sku');
        const lote = urlParams.get('lote');
        const validade = urlParams.get('validade');
        const produtoNome = decodeURIComponent(urlParams.get('produto') || '');
        const volume = urlParams.get('volume') || '0';
        const quantidade = urlParams.get('quantidade') || '0';
        const unidade = urlParams.get('unidade') || 'UN';

        // Construir o link completo para a página de baixa
        const baseUrl = 'https://rdnegocios8.github.io/ControleEstoqueGoogleSheets/baixa-view.html';
        const linkCompleto = `${baseUrl}?id=${unidadeId}&sku=${sku}&lote=${lote}&validade=${validade}&produto=${encodeURIComponent(produtoNome)}&volume=${volume}&quantidade=${quantidade}&unidade=${unidade}`;

        // Função para gerar QR Code com o link completo
        function gerarQRCode() {
            const qrcodeDiv = document.getElementById('qrcode');
            qrcodeDiv.innerHTML = ''; // Limpar
            
            if (typeof QRCode !== 'undefined' && unidadeId) {
                try {
                    // Gerar QR Code com o LINK COMPLETO
                    new QRCode(qrcodeDiv, {
                        text: linkCompleto,  // Agora usa o link completo!
                        width: 250,
                        height: 250,
                        colorDark: '#000000',
                        colorLight: '#ffffff',
                        correctLevel: QRCode.CorrectLevel.H
                    });
                    
                    // Preencher informações do produto
                    const infoDiv = document.getElementById('qr-info');
                    infoDiv.innerHTML = `
                        <p><strong>Produto:</strong> ${produtoNome || 'N/A'}</p>
                        <p><strong>SKU:</strong> ${sku || 'N/A'}</p>
                        <p><strong>Lote:</strong> ${lote || 'N/A'}</p>
                        <p><strong>Validade:</strong> ${validade ? new Date(validade).toLocaleDateString('pt-BR') : 'N/A'}</p>
                    `;
                    
                    // Preencher informações de volume
                    document.getElementById('volume-info').innerHTML = `
                        <div class="volume-item">
                            <span class="volume-value">${volume}</span>
                            <span class="volume-label">Volume (${unidade})</span>
                        </div>
                        <div class="volume-item">
                            <span class="volume-value">${quantidade}</span>
                            <span class="volume-label">Quantidade</span>
                        </div>
                    `;
                    
                    // Mostrar o ID e o link
                    document.getElementById('info-id').innerHTML = `
                        <i class="bi bi-upc-scan"></i> ID: ${unidadeId}<br>
                        <small style="font-size: 0.7rem; color: #adb5bd;">${linkCompleto}</small>
                    `;
                    
                } catch (e) {
                    console.error('Erro ao gerar QR Code:', e);
                    qrcodeDiv.innerHTML = '<p class="text-danger">Erro ao gerar QR Code</p>';
                }
            } else {
                qrcodeDiv.innerHTML = '<p class="text-danger">ID da unidade não encontrado</p>';
            }
        }

        // Gerar QR Code quando a página carregar
        window.onload = gerarQRCode;

        // Função para baixar QR Code
        function baixarQR() {
            const canvas = document.querySelector('#qrcode canvas');
            if (!canvas) {
                alert('QR Code ainda não foi gerado!');
                return;
            }
            
            const link = document.createElement('a');
            link.download = `qrcode-${unidadeId}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Função para testar o link (opcional)
        function testarLink() {
            window.open(linkCompleto, '_blank');
        }
    </script>
</body>
</html>
