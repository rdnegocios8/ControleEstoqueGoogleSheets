<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etiqueta de Palete - Validade Rotativa</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <style>
        body {
            background: #f0f0f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
        }
        
        .container {
            max-width: 900px;
            width: 100%;
        }
        
        .card {
            background: white;
            border: 2px solid #000;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        /* Estilo da etiqueta igual à imagem */
        .etiqueta {
            font-family: 'Courier New', monospace;
            border: 2px solid #000;
            padding: 20px;
            margin: 20px 0;
            background: white;
            max-width: 500px;
            margin: 0 auto;
        }
        
        .etiqueta-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #000;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        
        .etiqueta-codigo {
            font-size: 20px;
            font-weight: bold;
        }
        
        .etiqueta-ordem {
            font-size: 48px;
            font-weight: bold;
            color: #000;
        }
        
        .etiqueta-descricao {
            font-size: 18px;
            font-weight: bold;
            margin: 15px 0;
            text-transform: uppercase;
            line-height: 1.3;
        }
        
        .etiqueta-linha {
            display: flex;
            margin: 10px 0;
            font-size: 18px;
        }
        
        .etiqueta-label {
            font-weight: bold;
            width: 100px;
        }
        
        .etiqueta-valor {
            flex: 1;
            font-weight: bold;
        }
        
        .etiqueta-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding-top: 10px;
            border-top: 2px solid #000;
            font-weight: bold;
            font-size: 20px;
        }
        
        .qr-code-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
            border: 2px solid #000;
            min-height: 200px;
        }
        
        #qrcode canvas, #qrcode img {
            max-width: 100%;
            height: auto;
        }
        
        .info-paletes {
            background: #f8f9fa;
            border: 2px solid #333;
            border-radius: 5px;
            padding: 20px;
            margin: 20px 0;
        }
        
        .info-paletes h3 {
            margin: 0 0 15px 0;
            color: #000;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }
        
        .tabela-validades {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Courier New', monospace;
        }
        
        .tabela-validades th {
            background: #333;
            color: white;
            padding: 10px;
            text-align: left;
            font-size: 14px;
        }
        
        .tabela-validades td {
            padding: 10px;
            border-bottom: 1px solid #ccc;
            font-size: 14px;
        }
        
        .tabela-validades tr.atual {
            background: #fff3cd;
            font-weight: bold;
        }
        
        .ordem-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 3px;
            font-weight: bold;
            color: white;
        }
        
        .ordem-1 { background: #dc3545; }
        .ordem-2 { background: #fd7e14; }
        .ordem-3 { background: #ffc107; color: #000; }
        .ordem-4 { background: #28a745; }
        .ordem-5 { background: #17a2b8; }
        .ordem-6 { background: #6c757d; }
        
        .qr-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        
        .qr-actions button {
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 120px;
            justify-content: center;
        }
        
        .btn-download {
            background: #007bff;
            color: white;
        }
        
        .btn-print {
            background: #28a745;
            color: white;
        }
        
        .btn-close {
            background: #dc3545;
            color: white;
        }
        
        .btn-view {
            background: #6c757d;
            color: white;
        }
        
        .qr-actions button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .info-id {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin: 15px 0;
            font-family: monospace;
            font-size: 14px;
            border: 1px solid #333;
        }
        
        .resumo-sku {
            background: #e9ecef;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 16px;
            border: 1px solid #333;
        }
        
        @media print {
            body {
                background: white;
                padding: 0;
            }
            
            .container {
                max-width: 100%;
                padding: 0;
            }
            
            .card {
                box-shadow: none;
                border: none;
                padding: 10px;
            }
            
            .qr-actions, .info-paletes, .btn-view, .resumo-sku, h2 {
                display: none !important;
            }
            
            .etiqueta {
                border: 2px solid #000;
                page-break-inside: avoid;
                margin: 0;
                max-width: 100%;
                box-shadow: none;
            }
            
            .qr-code-box {
                border: 1px solid #000;
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2 style="text-align: center; margin-top: 0;">Etiqueta de Palete - Ordem Rotativa</h2>
            
            <!-- Resumo do SKU -->
            <div class="resumo-sku" id="resumo-sku">
                Carregando informações...
            </div>
            
            <!-- Visualização da etiqueta no formato da imagem -->
            <div class="etiqueta" id="etiquetaVisualizacao">
                <!-- Será preenchido via JavaScript -->
            </div>
            
            <div class="qr-code-box" id="qr-code-container">
                <div id="qrcode"></div>
            </div>
            
            <!-- Informações de todos os paletes do mesmo SKU -->
            <div class="info-paletes" id="infoPaletes">
                <!-- Será preenchido via JavaScript -->
            </div>
            
            <div class="info-id" id="info-id"></div>
            
            <div class="qr-actions">
                <button class="btn-download" onclick="baixarEtiqueta()">
                    <i class="bi bi-download"></i> Baixar
                </button>
                <button class="btn-print" onclick="imprimirEtiqueta()">
                    <i class="bi bi-printer"></i> Imprimir Etiqueta
                </button>
                <button class="btn-view" onclick="window.location.href='qr-view.html'">
                    <i class="bi bi-arrow-left"></i> Voltar
                </button>
                <button class="btn-close" onclick="window.close()">
                    <i class="bi bi-x-lg"></i> Fechar
                </button>
            </div>
        </div>
    </div>

    <script>
        // Função para converter data nos formatos DD/MM/YYYY ou YYYY-MM-DD
        function parseData(dataStr) {
            if (!dataStr) return null;
            
            // Tentar formato YYYY-MM-DD
            if (dataStr.includes('-')) {
                const partes = dataStr.split('-');
                if (partes.length === 3) {
                    return new Date(partes[0], partes[1] - 1, partes[2]);
                }
            }
            
            // Tentar formato DD/MM/YYYY
            if (dataStr.includes('/')) {
                const partes = dataStr.split('/');
                if (partes.length === 3) {
                    return new Date(partes[2], partes[1] - 1, partes[0]);
                }
            }
            
            return new Date(dataStr);
        }

        // Função para formatar data
        function formatarData(data) {
            if (!data) return '';
            if (data instanceof Date) {
                return data.toLocaleDateString('pt-BR');
            }
            return data;
        }

        // Função para buscar todas as unidades do mesmo SKU
        function buscarUnidadesPorSKU(sku, unidadeAtualId) {
            // Simulação dos dados baseado na imagem fornecida
            // Em produção, isso viria de uma API ou localStorage
            const todasUnidades = [
                {
                    id: 'UN-KØNLQSNX-AMZK',
                    sku: '00030202',
                    produto: 'FILME BISC. ROSQUINHA COCO EMEGE 600GR',
                    lote: 'AAACXB0101',
                    validade: '07/04/2026',
                    volume: '583.50',
                    quantidade: '1',
                    unidade: 'PLT'
                },
                {
                    id: 'UN-2EP1M8IO-9Y8R',
                    sku: '00030202',
                    produto: 'FILME BISC. ROSQUINHA COCO EMEGE 600GR',
                    lote: 'AAACS60101',
                    validade: '25/06/2026',
                    volume: '535.87',
                    quantidade: '1',
                    unidade: 'PLT'
                },
                {
                    id: 'UN-CUT9HP6G-46K4',
                    sku: '00030202',
                    produto: 'FILME BISC. ROSQUINHA COCO EMEGE 600GR',
                    lote: 'AAACS60101',
                    validade: '25/06/2026',
                    volume: '555.88',
                    quantidade: '1',
                    unidade: 'PLT'
                }
            ];
            
            // Filtrar apenas unidades do mesmo SKU
            return todasUnidades.filter(u => u.sku === sku);
        }

        // Função principal para calcular a ordem baseada no SKU
        function calcularOrdemPorSKU(sku, validadeAtual, unidadeAtualId) {
            // Buscar todas unidades do mesmo SKU
            const unidadesDoSKU = buscarUnidadesPorSKU(sku, unidadeAtualId);
            
            if (!unidadesDoSKU || unidadesDoSKU.length === 0) {
                return { ordem: '1º', posicao: 1, unidades: [] };
            }
            
            // Mapear unidades com suas datas
            const unidadesComData = unidadesDoSKU.map(u => ({
                ...u,
                dataObj: parseData(u.validade)
            })).filter(u => u.dataObj !== null);
            
            // Agrupar por data de validade
            const grupos = {};
            unidadesComData.forEach(u => {
                const dataStr = u.validade;
                if (!grupos[dataStr]) {
                    grupos[dataStr] = [];
                }
                grupos[dataStr].push(u);
            });
            
            // Ordenar as datas (mais antiga primeiro)
            const datasOrdenadas = Object.keys(grupos).sort((a, b) => {
                const dataA = parseData(a);
                const dataB = parseData(b);
                return dataA - dataB;
            });
            
            // Mapear cada data para sua posição
            const posicaoPorData = {};
            datasOrdenadas.forEach((data, index) => {
                posicaoPorData[data] = index + 1; // 1º, 2º, 3º...
            });
            
            // Encontrar a posição da data atual
            const posicao = posicaoPorData[validadeAtual] || 1;
            
            // Converter para ordinal
            const ordinais = ['1º', '2º', '3º', '4º', '5º', '6º', '7º', '8º', '9º', '10º'];
            const ordem = ordinais[Math.min(posicao - 1, ordinais.length - 1)] || posicao + 'º';
            
            return {
                ordem,
                posicao,
                grupos,
                datasOrdenadas,
                unidades: unidadesComData,
                totalUnidades: unidadesComData.length
            };
        }

        // Carregar dados da URL
        const urlParams = new URLSearchParams(window.location.search);
        const unidadeId = urlParams.get('id') || 'UN-2EP1M8IO-9Y8R';
        const sku = urlParams.get('sku') || '00030202';
        const lote = urlParams.get('lote') || 'AAACS60101';
        const validade = urlParams.get('validade') || '25/06/2026';
        const produtoNome = decodeURIComponent(urlParams.get('produto') || 'FILME BISC. ROSQUINHA COCO EMEGE 600GR');
        const volume = urlParams.get('volume') || '535.87';
        const quantidade = urlParams.get('quantidade') || '1';
        const unidade = urlParams.get('unidade') || 'PLT';

        // Calcular ordem baseada em TODAS as unidades do mesmo SKU
        const resultado = calcularOrdemPorSKU(sku, validade, unidadeId);
        const ordem = resultado.ordem;

        // Construir link completo
        const baseUrl = 'https://rdnegocios8.github.io/ControleEstoqueGoogleSheets/baixa-view.html';
        const linkCompleto = `${baseUrl}?id=${unidadeId}&sku=${sku}&lote=${lote}&validade=${validade}&produto=${encodeURIComponent(produtoNome)}&volume=${volume}&quantidade=${quantidade}&unidade=${unidade}`;

        // Função para atualizar a visualização da etiqueta
        function atualizarEtiqueta() {
            const etiquetaDiv = document.getElementById('etiquetaVisualizacao');
            etiquetaDiv.innerHTML = `
                <div class="etiqueta-header">
                    <div class="etiqueta-codigo">CODIGO:${sku}</div>
                    <div class="etiqueta-ordem">${ordem}</div>
                </div>
                <div class="etiqueta-descricao">${produtoNome}</div>
                <div class="etiqueta-linha">
                    <span class="etiqueta-label">LOTE:</span>
                    <span class="etiqueta-valor">${lote}</span>
                </div>
                <div class="etiqueta-linha">
                    <span class="etiqueta-label">VALIDADE:</span>
                    <span class="etiqueta-valor">${validade}</span>
                </div>
                <div class="etiqueta-footer">
                    <span>${volume} Kg</span>
                    <span>${quantidade} ${unidade}</span>
                </div>
            `;
        }

        // Função para gerar QR Code
        function gerarQRCode() {
            const qrcodeDiv = document.getElementById('qrcode');
            qrcodeDiv.innerHTML = '';
            
            if (typeof QRCode !== 'undefined') {
                try {
                    QRCode.toCanvas(document.createElement('canvas'), linkCompleto, {
                        width: 200,
                        margin: 2
                    }, function(err, canvas) {
                        if (err) {
                            console.error('Erro:', err);
                            return;
                        }
                        qrcodeDiv.innerHTML = '';
                        canvas.style.width = '100%';
                        canvas.style.height = 'auto';
                        qrcodeDiv.appendChild(canvas);
                    });

                    // Atualizar resumo do SKU
                    document.getElementById('resumo-sku').innerHTML = `
                        <strong>SKU: ${sku}</strong> | 
                        Total de unidades: ${resultado.totalUnidades} | 
                        Datas diferentes: ${resultado.datasOrdenadas.length}
                    `;

                    // Atualizar tabela com TODAS as unidades do mesmo SKU
                    let infoHtml = '<h3>📦 TODAS AS UNIDADES DO SKU ' + sku + ':</h3>';
                    infoHtml += '<table class="tabela-validades">';
                    infoHtml += '<tr><th>ID</th><th>LOTE</th><th>VALIDADE</th><th>ORDEM</th></tr>';
                    
                    resultado.datasOrdenadas.forEach(data => {
                        const unidadesDaData = resultado.grupos[data];
                        const posicao = resultado.posicao;
                        
                        unidadesDaData.forEach(u => {
                            // Calcular ordem para esta unidade
                            const resultadoUnidade = calcularOrdemPorSKU(sku, u.validade, u.id);
                            
                            let classeOrdem = 'ordem-1';
                            if (resultadoUnidade.posicao === 1) classeOrdem = 'ordem-1';
                            else if (resultadoUnidade.posicao === 2) classeOrdem = 'ordem-2';
                            else if (resultadoUnidade.posicao === 3) classeOrdem = 'ordem-3';
                            else if (resultadoUnidade.posicao === 4) classeOrdem = 'ordem-4';
                            else if (resultadoUnidade.posicao === 5) classeOrdem = 'ordem-5';
                            else classeOrdem = 'ordem-6';
                            
                            infoHtml += `<tr ${u.id === unidadeId ? 'class="atual"' : ''}>`;
                            infoHtml += `<td>${u.id}</td>`;
                            infoHtml += `<td>${u.lote}</td>`;
                            infoHtml += `<td>${u.validade}</td>`;
                            infoHtml += `<td><span class="ordem-badge ${classeOrdem}">${resultadoUnidade.ordem}</span></td>`;
                            infoHtml += `</tr>`;
                        });
                    });
                    
                    infoHtml += '</table>';
                    document.getElementById('infoPaletes').innerHTML = infoHtml;

                    document.getElementById('info-id').innerHTML = `
                        <i class="bi bi-upc-scan"></i> 
                        <strong>ID:</strong> ${unidadeId} | 
                        <strong>SKU:</strong> ${sku} | 
                        <strong>Ordem:</strong> ${ordem} | 
                        <strong>Total SKU:</strong> ${resultado.totalUnidades} unidades
                    `;

                } catch (e) {
                    console.error('Erro:', e);
                }
            }
        }

        // Função para imprimir apenas a etiqueta
        function imprimirEtiqueta() {
            const janelaImpressao = window.open('', '_blank');
            
            const conteudoImpressao = `
                <!DOCTYPE html>
                <html>
                <head>

                            display: flex;

                        }

                </head>
                <body>
                    <div>

            janelaImpressao.document.write(conteudoImpressao);

        }

        // Função para baixar a etiqueta como imagem
        function baixarEtiqueta() {
            const qrCanvas = document.querySelector('#qrcode canvas');
            
            if (!qrCanvas) {
                alert('Aguarde o QR Code ser gerado!');
                return;
            }
            
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = 500;
            canvas.height = 450;
            
            // Fundo branco
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Desenhar a etiqueta
            ctx.font = 'bold 20px "Courier New"';
            ctx.fillStyle = 'black';
            
            // Cabeçalho
            ctx.font = 'bold 20px "Courier New"';
            ctx.fillText(`CODIGO:${sku}`, 20, 40);
            ctx.font = 'bold 48px "Courier New"';
            ctx.fillText(ordem, 380, 60);
            
            // Linha divisória
            ctx.beginPath();
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 2;
            ctx.moveTo(20, 80);
            ctx.lineTo(480, 80);
            ctx.stroke();
            
            // Descrição (quebrar em linhas se necessário)
            ctx.font = 'bold 16px "Courier New"';
            let descricao = produtoNome;
            if (descricao.length > 30) {
                ctx.fillText(descricao.substring(0, 30), 20, 120);
                ctx.fillText(descricao.substring(30, 60), 20, 145);
            } else {
                ctx.fillText(descricao, 20, 120);
            }
            
            // Lote
            ctx.font = '16px "Courier New"';
            ctx.fillText('LOTE:', 20, 185);
            ctx.font = 'bold 16px "Courier New"';
            ctx.fillText(lote, 100, 185);
            
            // Validade
            ctx.font = '16px "Courier New"';
            ctx.fillText('VALIDADE:', 20, 220);
            ctx.font = 'bold 16px "Courier New"';
            ctx.fillText(validade, 130, 220);
            
            // Rodapé
            ctx.beginPath();
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 2;
            ctx.moveTo(20, 260);
            ctx.lineTo(480, 260);
            ctx.stroke();
            
            ctx.font = 'bold 18px "Courier New"';
            ctx.fillText(`${volume} Kg`, 20, 300);
            ctx.fillText(`${quantidade} ${unidade}`, 350, 300);
            
            // Informação do SKU
            ctx.font = '12px "Courier New"';
            ctx.fillText(`SKU: ${sku} | Total: ${resultado.totalUnidades} unid.`, 20, 340);
            
            // Desenhar QR Code
            ctx.drawImage(qrCanvas, 175, 360, 150, 150);
            
            // Baixar imagem
            const link = document.createElement('a');
            link.download = `etiqueta-${sku}-${ordem}-${unidadeId.substring(0,8)}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Inicializar
        window.onload = function() {
            atualizarEtiqueta();
            setTimeout(gerarQRCode, 100);
        };

        if (document.readyState === 'complete') {
            atualizarEtiqueta();
            gerarQRCode();
        } else {
            window.addEventListener('load', function() {
                atualizarEtiqueta();
                gerarQRCode();
            });
        }
    </script>
</body>
</html>
