<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etiqueta de Palete - Validade Rotativa</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <style>
        body {
            background: #f0f0f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
        }
        
        .card {
            background: white;
            border: 2px solid #000;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        /* Estilo da etiqueta igual à imagem */
        .etiqueta {
            font-family: 'Courier New', monospace;
            border: 2px solid #000;
            padding: 20px;
            margin: 20px 0;
            background: white;
            max-width: 500px;
            margin: 0 auto;
        }
        
        .etiqueta-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #000;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        
        .etiqueta-codigo {
            font-size: 24px;
            font-weight: bold;
        }
        
        .etiqueta-ordem {
            font-size: 48px;
            font-weight: bold;
            color: #000;
        }
        
        .etiqueta-descricao {
            font-size: 18px;
            font-weight: bold;
            margin: 15px 0;
            text-transform: uppercase;
        }
        
        .etiqueta-linha {
            display: flex;
            margin: 10px 0;
            font-size: 18px;
        }
        
        .etiqueta-label {
            font-weight: bold;
            width: 80px;
        }
        
        .etiqueta-valor {
            flex: 1;
        }
        
        .etiqueta-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding-top: 10px;
            border-top: 2px solid #000;
            font-weight: bold;
            font-size: 20px;
        }
        
        .qr-code-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
            border: 2px solid #000;
            min-height: 200px;
        }
        
        #qrcode canvas, #qrcode img {
            max-width: 100%;
            height: auto;
        }
        
        .info-paletes {
            background: #f5f5f5;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 15px;
            margin: 20px 0;
        }
        
        .info-paletes h4 {
            margin: 0 0 10px 0;
            color: #333;
        }
        
        .tabela-validades {
            width: 100%;
            border-collapse: collapse;
        }
        
        .tabela-validades th {
            background: #333;
            color: white;
            padding: 8px;
            text-align: left;
        }
        
        .tabela-validades td {
            padding: 8px;
            border-bottom: 1px solid #ccc;
        }
        
        .tabela-validades tr.atual {
            background: #ffffcc;
            font-weight: bold;
        }
        
        .qr-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        
        .qr-actions button {
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 120px;
            justify-content: center;
        }
        
        .btn-download {
            background: #007bff;
            color: white;
        }
        
        .btn-print {
            background: #28a745;
            color: white;
        }
        
        .btn-close {
            background: #dc3545;
            color: white;
        }
        
        .btn-view {
            background: #ffc107;
            color: #000;
        }
        
        .qr-actions button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .info-id {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            margin: 15px 0;
            font-family: monospace;
            word-break: break-all;
        }
        
        @media print {
            body {
                background: white;
                padding: 0;
            }
            
            .container {
                max-width: 100%;
                padding: 0;
            }
            
            .card {
                box-shadow: none;
                border: none;
                padding: 0;
            }
            
            .qr-actions, .badge, .info-paletes, .btn-view, h2 {
                display: none !important;
            }
            
            .etiqueta {
                border: 2px solid #000;
                page-break-inside: avoid;
                margin: 0;
                max-width: 100%;
            }
            
            .qr-code-box {
                border: 1px solid #000;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2 style="text-align: center; margin-top: 0;">Etiqueta de Palete</h2>
            
            <!-- Visualização da etiqueta no formato da imagem -->
            <div class="etiqueta" id="etiquetaVisualizacao">
                <!-- Será preenchido via JavaScript -->
            </div>
            
            <div class="qr-code-box" id="qr-code-container">
                <div id="qrcode"></div>
            </div>
            
            <!-- Informações dos paletes -->
            <div class="info-paletes" id="infoPaletes">
                <!-- Será preenchido via JavaScript -->
            </div>
            
            <div class="info-id" id="info-id"></div>
            
            <div class="qr-actions">
                <button class="btn-download" onclick="baixarEtiqueta()">
                    <i class="bi bi-download"></i> Baixar
                </button>
                <button class="btn-print" onclick="imprimirEtiqueta()">
                    <i class="bi bi-printer"></i> Imprimir
                </button>
                <button class="btn-view" onclick="window.location.href='qr-view.html'">
                    <i class="bi bi-arrow-left"></i> Voltar
                </button>
                <button class="btn-close" onclick="window.close()">
                    <i class="bi bi-x-lg"></i> Fechar
                </button>
            </div>
        </div>
    </div>

    <script>
        // Função para converter data no formato DD/MM/YYYY para Date
        function parseData(dataStr) {
            if (!dataStr) return null;
            const partes = dataStr.split('/');
            if (partes.length === 3) {
                return new Date(partes[2], partes[1] - 1, partes[0]);
            }
            return new Date(dataStr);
        }

        // Função para formatar data
        function formatarData(data) {
            if (!data) return '';
            if (data instanceof Date) {
                return data.toLocaleDateString('pt-BR');
            }
            return data;
        }

        // Função principal para calcular a ordem baseada em TODAS as validades
        function calcularOrdemValidade(dataAtualStr, todasUnidades) {
            if (!dataAtualStr || !todasUnidades || todasUnidades.length === 0) {
                return { ordem: '1º', posicao: 1 };
            }
            
            // Mapear todas as unidades com suas validades
            const unidadesComData = todasUnidades.map(u => ({
                ...u,
                dataObj: parseData(u.validade)
            })).filter(u => u.dataObj !== null);
            
            if (unidadesComData.length === 0) {
                return { ordem: '1º', posicao: 1 };
            }
            
            // Agrupar por data de validade
            const grupos = {};
            unidadesComData.forEach(u => {
                const dataStr = u.validade;
                if (!grupos[dataStr]) {
                    grupos[dataStr] = [];
                }
                grupos[dataStr].push(u);
            });
            
            // Ordenar as datas (mais antiga primeiro)
            const datasOrdenadas = Object.keys(grupos).sort((a, b) => {
                const dataA = parseData(a);
                const dataB = parseData(b);
                return dataA - dataB;
            });
            
            // Mapear cada data para sua posição
            const posicaoPorData = {};
            datasOrdenadas.forEach((data, index) => {
                posicaoPorData[data] = index + 1; // 1º, 2º, 3º...
            });
            
            // Encontrar a posição da data atual
            const posicao = posicaoPorData[dataAtualStr] || 1;
            
            // Converter para ordinal
            const ordinais = ['1º', '2º', '3º', '4º', '5º', '6º', '7º', '8º', '9º', '10º'];
            const ordem = ordinais[Math.min(posicao - 1, ordinais.length - 1)] || posicao + 'º';
            
            return { ordem, posicao, grupos, datasOrdenadas };
        }

        // Carregar dados da URL
        const urlParams = new URLSearchParams(window.location.search);
        const unidadeId = urlParams.get('id');
        const sku = urlParams.get('sku') || '000304394';
        const lote = urlParams.get('lote') || '144142';
        const validade = urlParams.get('validade') || '23/01/2027';
        const produtoNome = decodeURIComponent(urlParams.get('produto') || 'FILME BISC. ROSQUINHA LEITE EMEGE 300GR');
        const volume = urlParams.get('volume') || '500,0';
        const quantidade = urlParams.get('quantidade') || '20';
        const unidade = urlParams.get('unidade') || 'Cx';
        
        // Receber lista de todas as unidades (simulando dados da imagem)
        // Formato esperado: ID, LOTE, VALIDADE, embalagem, volume, qtd
        const unidadesStr = urlParams.get('unidades') || '';
        let todasUnidades = [];
        
        if (unidadesStr) {
            // Se veio parâmetro com todas unidades
            todasUnidades = JSON.parse(decodeURIComponent(unidadesStr));
        } else {
            // Dados simulados baseado na imagem fornecida
            todasUnidades = [
                { id: 'UN-KØNLQSNX-AMZK', lote: 'AAACXB0101', validade: '07/04/2026', volume: '583,50', quantidade: '1' },
                { id: 'UN-2EP1M8IO-9Y8R', lote: 'AAACS60101', validade: '25/06/2026', volume: '535,87', quantidade: '1' },
                { id: 'UN-CUT9HP6G-46K4', lote: 'AAACS60101', validade: '25/06/2026', volume: '555,88', quantidade: '1' }
            ];
        }

        // Calcular ordem baseada em TODAS as validades
        const resultado = calcularOrdemValidade(validade, todasUnidades);
        const ordem = resultado.ordem;

        // Construir link completo
        const baseUrl = 'https://rdnegocios8.github.io/ControleEstoqueGoogleSheets/baixa-view.html';
        const linkCompleto = `${baseUrl}?id=${unidadeId}&sku=${sku}&lote=${lote}&validade=${validade}&produto=${encodeURIComponent(produtoNome)}&volume=${volume}&quantidade=${quantidade}&unidade=${unidade}`;

        // Função para atualizar a visualização da etiqueta
        function atualizarEtiqueta() {
            const etiquetaDiv = document.getElementById('etiquetaVisualizacao');
            etiquetaDiv.innerHTML = `
                <div class="etiqueta-header">
                    <div class="etiqueta-codigo">CODIGO:${sku}</div>
                    <div class="etiqueta-ordem">${ordem}</div>
                </div>
                <div class="etiqueta-descricao">${produtoNome}</div>
                <div class="etiqueta-linha">
                    <span class="etiqueta-label">LOTE:</span>
                    <span class="etiqueta-valor">${lote}</span>
                </div>
                <div class="etiqueta-linha">
                    <span class="etiqueta-label">VALIDADE:</span>
                    <span class="etiqueta-valor">${validade}</span>
                </div>
                <div class="etiqueta-footer">
                    <span>${volume} Kg</span>
                    <span>${quantidade} ${unidade}</span>
                </div>
            `;
        }

        // Função para gerar QR Code
        function gerarQRCode() {
            const qrcodeDiv = document.getElementById('qrcode');
            qrcodeDiv.innerHTML = '';
            
            if (typeof QRCode !== 'undefined') {
                try {
                    QRCode.toCanvas(document.createElement('canvas'), linkCompleto, {
                        width: 200,
                        margin: 2
                    }, function(err, canvas) {
                        if (err) {
                            console.error('Erro:', err);
                            return;
                        }
                        qrcodeDiv.innerHTML = '';
                        canvas.style.width = '100%';
                        canvas.style.height = 'auto';
                        qrcodeDiv.appendChild(canvas);
                    });

                    // Atualizar informações dos paletes
                    let infoHtml = '<h4>📦 Todos os Paletes do Produto:</h4>';
                    infoHtml += '<table class="tabela-validades">';
                    infoHtml += '<tr><th>ID</th><th>LOTE</th><th>VALIDADE</th><th>ORDEM</th></tr>';
                    
                    // Recalcular ordens para cada unidade
                    const resultadoGeral = calcularOrdemValidade('', todasUnidades);
                    const posicaoPorData = {};
                    resultadoGeral.datasOrdenadas.forEach((data, index) => {
                        posicaoPorData[data] = index + 1;
                    });
                    
                    todasUnidades.forEach(u => {
                        const posicao = posicaoPorData[u.validade] || 1;
                        const ordinais = ['1º', '2º', '3º', '4º', '5º'];
                        const ordemUnidade = ordinais[Math.min(posicao - 1, ordinais.length - 1)] || posicao + 'º';
                        
                        infoHtml += `<tr ${u.id === unidadeId ? 'class="atual"' : ''}>`;
                        infoHtml += `<td>${u.id}</td>`;
                        infoHtml += `<td>${u.lote}</td>`;
                        infoHtml += `<td>${u.validade}</td>`;
                        infoHtml += `<td><strong>${ordemUnidade}</strong></td>`;
                        infoHtml += `</tr>`;
                    });
                    
                    infoHtml += '</table>';
                    document.getElementById('infoPaletes').innerHTML = infoHtml;

                    document.getElementById('info-id').innerHTML = `
                        <i class="bi bi-upc-scan"></i> ID: ${unidadeId} | Ordem: ${ordem}
                    `;

                } catch (e) {
                    console.error('Erro:', e);
                }
            }
        }

        // Função para imprimir apenas a etiqueta
        function imprimirEtiqueta() {
            // Criar uma nova janela para impressão
            const janelaImpressao = window.open('', '_blank');
            
            // Conteúdo HTML para impressão
            const conteudoImpressao = `
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Etiqueta de Palete - ${ordem}</title>
                    <style>
                        body {
                            font-family: 'Courier New', monospace;
                            margin: 0;
                            padding: 20px;
                            display: flex;
                            justify-content: center;
                            align-items: center;
                            min-height: 100vh;
                        }
                        .etiqueta {
                            border: 2px solid #000;
                            padding: 20px;
                            width: 400px;
                            margin: 0 auto;
                            page-break-inside: avoid;
                        }
                        .etiqueta-header {
                            display: flex;
                            justify-content: space-between;
                            align-items: center;
                            border-bottom: 2px solid #000;
                            padding-bottom: 10px;
                            margin-bottom: 15px;
                        }
                        .etiqueta-codigo {
                            font-size: 24px;
                            font-weight: bold;
                        }
                        .etiqueta-ordem {
                            font-size: 48px;
                            font-weight: bold;
                        }
                        .etiqueta-descricao {
                            font-size: 18px;
                            font-weight: bold;
                            margin: 15px 0;
                            text-transform: uppercase;
                        }
                        .etiqueta-linha {
                            display: flex;
                            margin: 10px 0;
                            font-size: 18px;
                        }
                        .etiqueta-label {
                            font-weight: bold;
                            width: 80px;
                        }
                        .etiqueta-valor {
                            flex: 1;
                        }
                        .etiqueta-footer {
                            display: flex;
                            justify-content: space-between;
                            margin-top: 20px;
                            padding-top: 10px;
                            border-top: 2px solid #000;
                            font-weight: bold;
                            font-size: 20px;
                        }
                        .qr-code {
                            text-align: center;
                            margin: 20px 0;
                        }
                        @media print {
                            body { padding: 0; }
                            .etiqueta { box-shadow: none; }
                        }
                    </style>
                </head>
                <body>
                    <div>
                        <div class="etiqueta">
                            <div class="etiqueta-header">
                                <div class="etiqueta-codigo">CODIGO:${sku}</div>
                                <div class="etiqueta-ordem">${ordem}</div>
                            </div>
                            <div class="etiqueta-descricao">${produtoNome}</div>
                            <div class="etiqueta-linha">
                                <span class="etiqueta-label">LOTE:</span>
                                <span class="etiqueta-valor">${lote}</span>
                            </div>
                            <div class="etiqueta-linha">
                                <span class="etiqueta-label">VALIDADE:</span>
                                <span class="etiqueta-valor">${validade}</span>
                            </div>
                            <div class="etiqueta-footer">
                                <span>${volume} Kg</span>
                                <span>${quantidade} ${unidade}</span>
                            </div>
                            <div class="qr-code">
                                <img src="${document.querySelector('#qrcode canvas').toDataURL()}" style="width: 150px; height: 150px;">
                            </div>
                        </div>
                    </div>
                    <script>
                        window.onload = function() { window.print(); window.close(); }
                    <\/script>
                </body>
                </html>
            `;
            
            janelaImpressao.document.write(conteudoImpressao);
            janelaImpressao.document.close();
        }

        // Função para baixar a etiqueta como imagem
        function baixarEtiqueta() {
            // Criar um canvas para capturar a etiqueta
            const etiquetaDiv = document.getElementById('etiquetaVisualizacao');
            const qrCanvas = document.querySelector('#qrcode canvas');
            
            if (!qrCanvas) {
                alert('Aguarde o QR Code ser gerado!');
                return;
            }
            
            // Criar um canvas temporário
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // Configurar tamanho do canvas
            canvas.width = 500;
            canvas.height = 400;
            
            // Fundo branco
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Desenhar a etiqueta
            ctx.font = 'bold 20px "Courier New"';
            ctx.fillStyle = 'black';
            
            // Cabeçalho
            ctx.font = 'bold 24px "Courier New"';
            ctx.fillText(`CODIGO:${sku}`, 20, 40);
            ctx.font = 'bold 48px "Courier New"';
            ctx.fillText(ordem, 380, 60);
            
            // Linha divisória
            ctx.beginPath();
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 2;
            ctx.moveTo(20, 80);
            ctx.lineTo(480, 80);
            ctx.stroke();
            
            // Descrição
            ctx.font = 'bold 18px "Courier New"';
            ctx.fillText(produtoNome.substring(0, 35), 20, 120);
            
            // Lote
            ctx.font = '18px "Courier New"';
            ctx.fillText('LOTE:', 20, 160);
            ctx.font = 'bold 18px "Courier New"';
            ctx.fillText(lote, 120, 160);
            
            // Validade
            ctx.font = '18px "Courier New"';
            ctx.fillText('VALIDADE:', 20, 200);
            ctx.font = 'bold 18px "Courier New"';
            ctx.fillText(validade, 140, 200);
            
            // Rodapé
            ctx.beginPath();
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 2;
            ctx.moveTo(20, 250);
            ctx.lineTo(480, 250);
            ctx.stroke();
            
            ctx.font = 'bold 20px "Courier New"';
            ctx.fillText(`${volume} Kg`, 20, 290);
            ctx.fillText(`${quantidade} ${unidade}`, 350, 290);
            
            // Desenhar QR Code
            ctx.drawImage(qrCanvas, 150, 310, 150, 150);
            
            // Baixar imagem
            const link = document.createElement('a');
            link.download = `etiqueta-${ordem}-${unidadeId || 'palete'}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Inicializar
        window.onload = function() {
            atualizarEtiqueta();
            setTimeout(gerarQRCode, 100);
        };

        if (document.readyState === 'complete') {
            atualizarEtiqueta();
            gerarQRCode();
        } else {
            window.addEventListener('load', function() {
                atualizarEtiqueta();
                gerarQRCode();
            });
        }
    </script>
</body>
</html>
