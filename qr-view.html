<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etiqueta de Palete - Validade Rotativa</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            margin: 0;
        }
        
        .container {
            max-width: 1200px;
            width: 100%;
        }
        
        .card {
            background: white;
            border: 2px solid #fbbf24;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        
        h2 {
            color: #fbbf24;
            text-align: center;
            font-size: 36px;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        /* Etiqueta BRANCA (apenas a etiqueta) */
        .etiqueta {
            font-family: 'Courier New', monospace;
            border: 4px solid #000;
            padding: 30px;
            margin: 20px auto;
            background: white;
            width: 100%;
            max-width: 1100px;
            min-height: auto;
            display: flex;
            flex-direction: column;
            page-break-inside: avoid;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .etiqueta-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid #000;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        
        .etiqueta-codigo {
            font-size: 48px;
            font-weight: bold;
        }
        
        .etiqueta-ordem {
            font-size: 120px;
            font-weight: bold;
            color: #000;
            line-height: 1;
        }
        
        .etiqueta-descricao {
            font-size: 42px;
            font-weight: bold;
            margin: 20px 0;
            text-transform: uppercase;
            line-height: 1.3;
            border-bottom: 2px solid #000;
            padding-bottom: 15px;
        }
        
        .etiqueta-linha {
            display: flex;
            margin: 18px 0;
            font-size: 40px;
            align-items: baseline;
        }
        
        .etiqueta-label {
            font-weight: bold;
            width: 200px;
        }
        
        .etiqueta-valor {
            flex: 1;
            font-weight: bold;
        }
        
        .etiqueta-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            padding-top: 15px;
            border-top: 4px solid #000;
            font-weight: bold;
            font-size: 48px;
        }
        
        .qr-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 30px;
            padding: 15px;
            background: #f8f9fa;
            border: 2px solid #000;
        }
        
        .qr-code-box {
            background: white;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #000;
        }
        
        #qrcode canvas, #qrcode img {
            width: 180px;
            height: 180px;
        }
        
        .qr-info {
            font-size: 22px;
            margin-left: 25px;
        }
        
        .qr-info p {
            margin: 8px 0;
        }
        
        .info-paletes {
            background: white;
            border: 2px solid #fbbf24;
            border-radius: 16px;
            padding: 30px;
            margin: 30px 0;
        }
        
        .info-paletes h3 {
            font-size: 32px;
            margin: 0 0 20px 0;
            color: #0f172a;
            border-bottom: 2px solid #fbbf24;
            padding-bottom: 10px;
        }
        
        .tabela-validades {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Courier New', monospace;
            font-size: 20px;
        }
        
        .tabela-validades th {
            background: #0f172a;
            color: #fbbf24;
            padding: 15px;
            text-align: left;
            font-size: 22px;
        }
        
        .tabela-validades td {
            padding: 15px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 20px;
        }
        
        .tabela-validades tr.atual {
            background: #fef3c7;
            font-weight: bold;
        }
        
        .ordem-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 20px;
            color: white;
        }
        
        .ordem-1 { background: #dc2626; }
        .ordem-2 { background: #ea580c; }
        .ordem-3 { background: #ca8a04; }
        .ordem-4 { background: #16a34a; }
        .ordem-5 { background: #0891b2; }
        
        .qr-actions {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        
        .qr-actions button {
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 180px;
            justify-content: center;
        }
        
        .btn-download {
            background: #3b82f6;
            color: white;
        }
        
        .btn-print {
            background: #fbbf24;
            color: #0f172a;
        }
        
        .btn-close {
            background: #64748b;
            color: white;
        }
        
        .btn-view {
            background: #6b7280;
            color: white;
        }
        
        .qr-actions button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(251, 191, 36, 0.3);
        }
        
        .resumo-sku {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            font-size: 24px;
            border: 2px solid #fbbf24;
            color: #0f172a;
        }
        
        /* Ajustes para impressão - UMA ÚNICA FOLHA */
        @media print {
            body {
                background: white;
                padding: 0;
                margin: 0;
            }
            
            .container {
                max-width: 100%;
                padding: 0;
                margin: 0;
            }
            
            .card {
                box-shadow: none;
                border: none;
                padding: 0;
                margin: 0;
                background: white;
            }
            
            h2, .qr-actions, .info-paletes, .btn-view, .resumo-sku {
                display: none !important;
            }
            
            .etiqueta {
                border: 3px solid #000;
                page-break-inside: avoid;
                page-break-after: avoid;
                page-break-before: avoid;
                margin: 0;
                max-width: 100%;
                min-height: auto;
                height: auto;
                box-shadow: none;
                padding: 25px;
                position: relative;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: white;
            }
            
            .qr-section {
                border: 2px solid #000;
                background: white;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>🏷️ Etiqueta de Palete - Ordem Rotativa</h2>
            
            <!-- Resumo do SKU -->
            <div class="resumo-sku" id="resumo-sku">
                Carregando informações...
            </div>
            
            <!-- Visualização da etiqueta BRANCA -->
            <div class="etiqueta" id="etiquetaVisualizacao">
                <!-- Será preenchido via JavaScript -->
            </div>
            
            <!-- Informações de todos os paletes do mesmo SKU -->
            <div class="info-paletes" id="infoPaletes">
                <!-- Será preenchido via JavaScript -->
            </div>
            
            <div class="qr-actions">
                <button class="btn-download" onclick="baixarEtiqueta()">
                    <i class="bi bi-download"></i> Baixar PNG
                </button>
                <button class="btn-print" onclick="imprimirEtiqueta()">
                    <i class="bi bi-printer"></i> Imprimir Etiqueta
                </button>
                <button class="btn-view" onclick="window.location.href='qr-view.html'">
                    <i class="bi bi-arrow-left"></i> Voltar
                </button>
                <button class="btn-close" onclick="window.close()">
                    <i class="bi bi-x-lg"></i> Fechar
                </button>
            </div>
        </div>
    </div>

    <script>
    // ============================================
    // FUNÇÃO DE ORDENAÇÃO CORRIGIDA PARA ETIQUETAS
    // ============================================
    
    /**
     * Calcula a ordem (1º, 2º, 3º...) baseada na validade para um SKU específico
     * @param {string} sku - O código SKU do produto
     * @param {string} validadeAtual - A validade da unidade atual (formato DD/MM/YYYY)
     * @returns {Object} - Objeto contendo a ordem formatada e metadados
     */
    function calcularOrdemPorValidade(sku, validadeAtual) {
        // Buscar todas as unidades do sistema que possuem o mesmo SKU e quantidade > 0
        // Nota: 'unidades' é a variável global do sistema
        if (typeof unidades === 'undefined' || !Array.isArray(unidades)) {
            console.warn('Variável global "unidades" não encontrada. Usando dados simulados.');
            // Fallback para dados simulados caso a variável não exista
            const unidadesSimuladas = [
                { sku: '00030202', validade: '07/04/2026', lote: 'AAACXB0101', quantidade: 1, id: 'UN-KØNLQSNX-AMZK' },
                { sku: '00030202', validade: '25/06/2026', lote: 'AAACS60101', quantidade: 1, id: 'UN-2EP1M8IO-9Y8R' },
                { sku: '00030202', validade: '25/06/2026', lote: 'AAACS60101', quantidade: 1, id: 'UN-CUT9HP6G-46K4' }
            ];
            var unidadesDoSKU = unidadesSimuladas.filter(u => u.sku === sku && u.quantidade > 0);
        } else {
            var unidadesDoSKU = unidades.filter(u => u.sku === sku && u.quantidade > 0);
        }
        
        if (unidadesDoSKU.length === 0) {
            return { ordem: '1º', posicao: 1, totalDatas: 1 };
        }

        // Função auxiliar para padronizar datas para comparação
        const normalizarData = (d) => {
            if (!d) return null;
            if (d.includes('/')) {
                const [dia, mes, ano] = d.split('/');
                return `${ano}-${mes.padStart(2, '0')}-${dia.padStart(2, '0')}`;
            }
            return d; // Assume YYYY-MM-DD
        };

        const dataAtualNorm = normalizarData(validadeAtual);

        // Extrair datas únicas e ordená-las
        const datasUnicas = [...new Set(unidadesDoSKU.map(u => normalizarData(u.validade)))]
            .filter(d => d !== null)
            .sort();

        // Encontrar a posição da data atual
        const index = datasUnicas.indexOf(dataAtualNorm);
        const posicao = index === -1 ? 1 : index + 1;

        // Formatar como ordinal
        const ordinais = ['1º', '2º', '3º', '4º', '5º', '6º', '7º', '8º', '9º', '10º'];
        const ordemFormatada = ordinais[posicao - 1] || `${posicao}º`;

        return {
            ordem: ordemFormatada,
            posicao: posicao,
            totalDatas: datasUnicas.length,
            datasUnicas: datasUnicas
        };
    }

    // ============================================
    // FUNÇÃO PARA GERAR TABELA DE CONFERÊNCIA
    // ============================================
    function gerarTabelaConferencia(sku, unidadeId, validadeAtual) {
        // Usar a variável global unidades ou fallback para dados simulados
        let unidadesDoSKU;
        if (typeof unidades !== 'undefined' && Array.isArray(unidades)) {
            unidadesDoSKU = unidades.filter(u => u.sku === sku && u.quantidade > 0);
        } else {
            // Fallback para dados simulados
            unidadesDoSKU = [
                { sku: '00030202', validade: '07/04/2026', lote: 'AAACXB0101', quantidade: 1, id: 'UN-KØNLQSNX-AMZK' },
                { sku: '00030202', validade: '25/06/2026', lote: 'AAACS60101', quantidade: 1, id: 'UN-2EP1M8IO-9Y8R' },
                { sku: '00030202', validade: '25/06/2026', lote: 'AAACS60101', quantidade: 1, id: 'UN-CUT9HP6G-46K4' }
            ];
        }

        // Função auxiliar para padronizar datas
        const normalizarData = (d) => {
            if (!d) return '';
            if (d.includes('/')) {
                const [dia, mes, ano] = d.split('/');
                return `${ano}-${mes.padStart(2, '0')}-${dia.padStart(2, '0')}`;
            }
            return d;
        };

        // Ordenar por data
        const unidadesOrdenadas = [...unidadesDoSKU].sort((a, b) => {
            const dataA = normalizarData(a.validade);
            const dataB = normalizarData(b.validade);
            return dataA.localeCompare(dataB);
        });

        // Encontrar datas únicas
        const datasUnicas = [...new Set(unidadesOrdenadas.map(u => normalizarData(u.validade)))].sort();

        let tabelaHtml = `<h3>📦 Unidades do SKU ${sku}</h3>
            <table class="tabela-validades">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Lote</th>
                        <th>Validade</th>
                        <th>Ordem</th>
                    </tr>
                </thead>
                <tbody>`;
        
        unidadesOrdenadas.forEach(u => {
            const dataNorm = normalizarData(u.validade);
            const posicao = datasUnicas.indexOf(dataNorm) + 1;
            const classeOrdem = `ordem-${Math.min(posicao, 5)}`;
            const ordinais = ['1º', '2º', '3º', '4º', '5º', '6º', '7º', '8º', '9º', '10º'];
            const ordemTexto = ordinais[posicao - 1] || `${posicao}º`;
            
            const isAtual = (u.id === unidadeId) || (u.validade === validadeAtual && u.lote === lote);
            
            tabelaHtml += `<tr class="${isAtual ? 'atual' : ''}">
                <td>${u.id ? u.id.substring(0, 12) + '...' : '-'}</td>
                <td>${u.lote}</td>
                <td>${u.validade}</td>
                <td><span class="ordem-badge ${classeOrdem}">${ordemTexto}</span></td>
            </tr>`;
        });
        
        tabelaHtml += '</tbody></table>';
        document.getElementById('infoPaletes').innerHTML = tabelaHtml;
    }

    // ============================================
    // PEGAR PARÂMETROS DA URL
    // ============================================
    const urlParams = new URLSearchParams(window.location.search);
    const unidadeId = urlParams.get('id') || 'UN-2EP1M8IO-9Y8R';
    const sku = urlParams.get('sku') || '00030202';
    const lote = urlParams.get('lote') || 'AAACS60101';
    const validade = urlParams.get('validade') || '25/06/2026';
    const produtoNome = decodeURIComponent(urlParams.get('produto') || 'FILME BISC. ROSQUINHA COCO EMEGE 600GR');
    const volume = urlParams.get('volume') || '535.87';
    const quantidade = urlParams.get('quantidade') || '1';
    const unidade = urlParams.get('unidade') || 'PLT';

    // ============================================
    // CALCULAR ORDEM CORRETA
    // ============================================
    const infoOrdem = calcularOrdemPorValidade(sku, validade);
    const ordem = infoOrdem.ordem;

    // ============================================
    // CONSTRUIR LINK DO QR CODE
    // ============================================
    const baseUrl = 'https://rdnegocios8.github.io/ControleEstoqueGoogleSheets/baixa-view.html';
    const linkCompleto = `${baseUrl}?id=${unidadeId}&sku=${sku}&lote=${lote}&validade=${validade}&produto=${encodeURIComponent(produtoNome)}&volume=${volume}&quantidade=${quantidade}&unidade=${unidade}`;

    // ============================================
    // ATUALIZAR ETIQUETA
    // ============================================
    function atualizarEtiqueta() {
        const etiquetaDiv = document.getElementById('etiquetaVisualizacao');
        
        // Formatar a data para exibição
        let dataExibicao = validade;
        if (validade.includes('/')) {
            const partes = validade.split('/');
            dataExibicao = `${partes[2]}-${partes[1]}-${partes[0]}`;
        }
        
        etiquetaDiv.innerHTML = `
            <div class="etiqueta-header">
                <div class="etiqueta-codigo">CODIGO: ${sku}</div>
                <div class="etiqueta-ordem">${ordem}</div>
            </div>
            <div class="etiqueta-descricao">${produtoNome}</div>
            <div class="etiqueta-linha">
                <span class="etiqueta-label">LOTE:</span>
                <span class="etiqueta-valor">${lote}</span>
            </div>
            <div class="etiqueta-linha">
                <span class="etiqueta-label">VALIDADE:</span>
                <span class="etiqueta-valor">${dataExibicao}</span>
            </div>
            <div class="etiqueta-footer">
                <span>${volume} Kg</span>
                <span>${quantidade} ${unidade}</span>
            </div>
            <div class="qr-section">
                <div class="qr-code-box" id="qr-code-container">
                    <div id="qrcode"></div>
                </div>
                <div class="qr-info">
                    <p><strong>SKU:</strong> ${sku}</p>
                    <p><strong>Total:</strong> ${infoOrdem.totalDatas} datas diferentes</p>
                    <p><strong>ID:</strong> ${unidadeId.substring(0, 15)}...</p>
                </div>
            </div>
        `;
    }

    // ============================================
    // GERAR QR CODE
    // ============================================
    function gerarQRCode() {
        const qrcodeDiv = document.getElementById('qrcode');
        if (!qrcodeDiv) return;
        
        qrcodeDiv.innerHTML = '';
        
        if (typeof QRCode !== 'undefined') {
            try {
                QRCode.toCanvas(document.createElement('canvas'), linkCompleto, {
                    width: 180,
                    margin: 1
                }, function(err, canvas) {
                    if (err) {
                        console.error('Erro:', err);
                        return;
                    }
                    qrcodeDiv.innerHTML = '';
                    canvas.style.width = '100%';
                    canvas.style.height = 'auto';
                    qrcodeDiv.appendChild(canvas);
                    
                    // Atualizar resumo do SKU
                    document.getElementById('resumo-sku').innerHTML = `
                        <strong>SKU: ${sku}</strong> | 
                        <strong>Total de unidades:</strong> ${infoOrdem.totalDatas} datas diferentes |
                        <strong>Unidade atual:</strong> <span style="color: #ea580c; font-weight: bold;">${ordem}</span>
                    `;
                    
                    // Gerar tabela de conferência
                    gerarTabelaConferencia(sku, unidadeId, validade);
                });

            } catch (e) {
                console.error('Erro:', e);
            }
        }
    }

    // ============================================
    // IMPRIMIR ETIQUETA
    // ============================================
    function imprimirEtiqueta() {
        window.print();
    }

    // ============================================
    // BAIXAR ETIQUETA COMO PNG
    // ============================================
    function baixarEtiqueta() {
        const qrCanvas = document.querySelector('#qrcode canvas');
        
        if (!qrCanvas) {
            alert('Aguarde o QR Code ser gerado!');
            return;
        }
        
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = 1200;
        canvas.height = 800;
        
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.strokeStyle = 'black';
        ctx.lineWidth = 6;
        ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);
        
        let dataExibicao = validade;
        if (validade.includes('/')) {
            const partes = validade.split('/');
            dataExibicao = `${partes[2]}-${partes[1]}-${partes[0]}`;
        }
        
        ctx.font = 'bold 48px "Courier New"';
        ctx.fillStyle = 'black';
        
        ctx.font = 'bold 52px "Courier New"';
        ctx.fillText(`CODIGO: ${sku}`, 50, 100);
        ctx.font = 'bold 140px "Courier New"';
        ctx.fillText(ordem, 900, 150);
        
        ctx.beginPath();
        ctx.strokeStyle = 'black';
        ctx.lineWidth = 4;
        ctx.moveTo(50, 180);
        ctx.lineTo(1150, 180);
        ctx.stroke();
        
        ctx.font = 'bold 48px "Courier New"';
        let descricao = produtoNome;
        if (descricao.length > 25) {
            ctx.fillText(descricao.substring(0, 25), 50, 260);
            ctx.fillText(descricao.substring(25, 50), 50, 320);
        } else {
            ctx.fillText(descricao, 50, 260);
        }
        
        ctx.font = '44px "Courier New"';
        ctx.fillText('LOTE:', 50, 420);
        ctx.font = 'bold 44px "Courier New"';
        ctx.fillText(lote, 250, 420);
        
        ctx.font = '44px "Courier New"';
        ctx.fillText('VALIDADE:', 50, 490);
        ctx.font = 'bold 44px "Courier New"';
        ctx.fillText(dataExibicao, 300, 490);
        
        ctx.beginPath();
        ctx.strokeStyle = 'black';
        ctx.lineWidth = 4;
        ctx.moveTo(50, 570);
        ctx.lineTo(1150, 570);
        ctx.stroke();
        
        ctx.font = 'bold 52px "Courier New"';
        ctx.fillText(`${volume} Kg`, 50, 650);
        ctx.fillText(`${quantidade} ${unidade}`, 800, 650);
        
        ctx.drawImage(qrCanvas, 150, 680, 150, 150);
        
        ctx.font = '24px "Courier New"';
        ctx.fillText(`SKU: ${sku} | Total: ${infoOrdem.totalDatas} datas`, 350, 780);
        
        const link = document.createElement('a');
        link.download = `etiqueta-${sku}-${ordem}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    }

    // ============================================
    // INICIALIZAR
    // ============================================
    window.onload = function() {
        atualizarEtiqueta();
        setTimeout(gerarQRCode, 100);
    };
</script>
</body>
</html>
