<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code da Unidade</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            margin: 0;
        }
        
        .qr-container {
            max-width: 800px;
            width: 100%;
        }
        
        .qr-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px solid #fbbf24;
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 30px rgba(251, 191, 36, 0.1);
            position: relative;
            overflow: hidden;
            transition: box-shadow 0.2s ease;
        }
        
        .qr-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #fbbf24, #f59e0b, #fbbf24);
        }
        
        .badge-unidade {
            display: inline-block;
            padding: 8px 20px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #0f172a;
            border-radius: 30px;
            font-weight: 700;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
        }
        
        .qr-code-box {
            background: linear-gradient(135deg, #f1f5f9, #e2e8f0);
            padding: 30px;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
            border: 3px solid #fbbf24;
            box-shadow: 0 15px 40px rgba(251, 191, 36, 0.2);
            min-height: 320px;
        }
        
        #qrcode canvas, #qrcode img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .qr-info {
            background: linear-gradient(135deg, #334155, #1e293b);
            border-radius: 16px;
            padding: 25px;
            margin: 20px 0;
            border: 2px solid #fbbf24;
            text-align: left;
            box-shadow: 0 8px 20px rgba(251, 191, 36, 0.08);
        }
        
        .qr-info p {
            margin: 12px 0;
            color: #cbd5e1;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
            font-size: 1rem;
        }
        
        .qr-info strong {
            color: #fbbf24;
            width: 120px;
            display: inline-block;
            font-weight: 600;
        }
        
        .volume-info {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            padding: 25px;
            background: linear-gradient(135deg, #334155, #1e293b);
            border-radius: 12px;
            border: 2px solid #fbbf24;
            box-shadow: 0 8px 20px rgba(251, 191, 36, 0.08);
        }
        
        .volume-item {
            text-align: center;
        }
        
        .volume-value {
            font-size: 2.2rem;
            font-weight: 700;
            color: #fbbf24;
            line-height: 1.2;
            text-shadow: 0 2px 8px rgba(251, 191, 36, 0.15);
        }
        
        .volume-label {
            font-size: 0.9rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .produtos-container {
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .produto-card {
            background: linear-gradient(135deg, #334155, #1e293b);
            border-radius: 16px;
            padding: 20px;
            border: 2px solid #fbbf24;
            box-shadow: 0 8px 20px rgba(251, 191, 36, 0.08);
            text-align: left;
        }
        
        .produto-header {
            color: #fbbf24;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #fbbf2433;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .produto-header small {
            color: #94a3b8;
            font-size: 0.9rem;
            font-weight: normal;
        }
        
        .volumes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }
        
        .volume-card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 18px;
            text-align: left;
            transition: all 0.2s ease;
        }
        
        .volume-card:hover {
            border-color: #fbbf24;
            box-shadow: 0 4px 12px rgba(251, 191, 36, 0.1);
        }
        
        .volume-card .tipo {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        
        .volume-card .tipo.padrao {
            background: #10b981;
            color: white;
        }
        
        .volume-card .tipo.fora {
            background: #f59e0b;
            color: #0f172a;
        }
        
        .volume-card p {
            margin: 5px 0;
            color: #cbd5e1;
            font-size: 0.9rem;
        }
        
        .volume-card p strong {
            color: #fbbf24;
        }
        
        .info-id {
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            color: #fbbf24;
            word-break: break-all;
            margin: 15px 0;
            border: 2px solid #fbbf24;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
        }
        
        .qr-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        
        .qr-actions button {
            padding: 12px 25px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 120px;
            justify-content: center;
        }
        
        .btn-download {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
        }
        
        .btn-print {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #0f172a;
        }
        
        .btn-close {
            background: linear-gradient(135deg, #64748b, #475569);
            color: white;
        }
        
        .qr-actions button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(251, 191, 36, 0.25);
        }
        
        .qr-actions button:active {
            transform: translateY(0);
        }
        
        .produto-resumo {
            background: #1e293b;
            border-radius: 8px;
            padding: 10px 15px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            border-left: 4px solid #fbbf24;
        }
        
        @media print {
            .qr-actions, .badge-unidade {
                display: none;
            }
            
            .qr-card {
                box-shadow: none;
                border: 1px solid #000;
            }
        }
    </style>
</head>
<body>
    <div class="qr-container">
        <div class="qr-card">
            <div class="badge-unidade">
                <i class="bi bi-qr-code-scan"></i> QR CODE DA UNIDADE
            </div>
            
            <div class="qr-code-box" id="qr-code-container">
                <div id="qrcode"></div>
            </div>
            
            <!-- Área para volume/quantidade TOTAIS (sempre visível) -->
            <div class="volume-info" id="volume-info">
                <!-- Será preenchido com os totais -->
            </div>
            
            <!-- Área para produtos e volumes -->
            <div class="produtos-container" id="produtos-container">
                <!-- Produtos serão inseridos aqui -->
            </div>
            
            <div class="info-id" id="info-id"></div>
            
            <div class="qr-actions">
                <button class="btn-download" onclick="baixarQR()">
                    <i class="bi bi-download"></i> Baixar
                </button>
                <button class="btn-print" onclick="window.print()">
                    <i class="bi bi-printer"></i> Imprimir
                </button>
                <button class="btn-close" onclick="window.close()">
                    <i class="bi bi-x-lg"></i> Fechar
                </button>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // FUNÇÃO PARA CORRIGIR A ESTRUTURA DOS DADOS
        // ============================================
        function corrigirEstruturaDados(dados) {
            console.log('🔧 Corrigindo estrutura:', dados);
            
            // CASO 1: Já tem produtos e não está vazio (estrutura correta)
            if (dados.produtos && dados.produtos.length > 0) {
                console.log('✅ Estrutura já está correta (com produtos)');
                
                // Garantir que cada produto tenha um array de volumes
                dados.produtos.forEach(produto => {
                    if (!produto.volumes) produto.volumes = [];
                    if (!produto.tipoEmbalagem) produto.tipoEmbalagem = 'UN';
                });
                
                return dados;
            }
            
            // CASO 2: Tem campos individuais (formato antigo)
            if (dados.id && (dados.produto || dados.sku || dados.nome)) {
                console.log('✅ Convertendo formato antigo para novo formato');
                
                // Verificar se tem volumes
                let volumes = [];
                if (dados.volumes && dados.volumes.length > 0) {
                    volumes = dados.volumes;
                } else if (dados.volume !== undefined) {
                    // Criar volume único a partir dos dados antigos
                    volumes = [{
                        tipo: dados.tipo || 'padrao',
                        qtdVolumes: parseFloat(dados.volume) || 1,
                        unPorEmbalagem: parseFloat(dados.qtdPorEmbalagem) || 1,
                        totalUN: parseFloat(dados.quantidade) || 0,
                        lote: dados.lote || '',
                        validade: dados.validade || '',
                        localizacao: dados.localizacao || '-'
                    }];
                }
                
                return {
                    id: dados.id,
                    produtos: [{
                        nome: dados.produto || dados.nome || 'Produto',
                        sku: dados.sku || 'SKU',
                        tipoEmbalagem: dados.tipoEmbalagem || dados.unidade || 'UN',
                        volumes: volumes
                    }],
                    totalVolumes: dados.totalVolumes || (dados.volume ? parseFloat(dados.volume) : (volumes.length > 0 ? volumes.reduce((sum, v) => sum + (v.qtdVolumes || 1), 0) : 1)),
                    totalUN: dados.totalUN || (dados.quantidade ? parseFloat(dados.quantidade) : (volumes.length > 0 ? volumes.reduce((sum, v) => sum + (v.totalUN || 0), 0) : 0))
                };
            }
            
            // CASO 3: Dados mínimos (fallback)
            console.log('⚠️ Criando estrutura mínima com ID:', dados.id);
            return {
                id: dados.id || 'ID desconhecido',
                produtos: [{
                    nome: dados.produto || dados.nome || 'Produto',
                    sku: dados.sku || 'SKU',
                    tipoEmbalagem: dados.tipoEmbalagem || dados.unidade || 'UN',
                    volumes: [{
                        tipo: 'padrao',
                        qtdVolumes: 1,
                        unPorEmbalagem: 1,
                        totalUN: 0,
                        lote: '',
                        validade: '',
                        localizacao: '-'
                    }]
                }],
                totalVolumes: 1,
                totalUN: 0
            };
        }

        // ============================================
        // CARREGAR DADOS DA URL
        // ============================================
        const urlParams = new URLSearchParams(window.location.search);
        const dadosParam = urlParams.get('dados');
        
        let unidadeData = null;
        
        // ============================================
        // PROCESSAR DADOS - PRIORIDADE MÁXIMA PARA O PARÂMETRO 'dados'
        // ============================================
        if (dadosParam) {
            try {
                // Tentar parsear o JSON
                const dadosParsed = JSON.parse(decodeURIComponent(dadosParam));
                console.log('📦 Dados brutos da URL (parâmetro dados):', dadosParsed);
                
                // APLICAR A CORREÇÃO DE ESTRUTURA
                unidadeData = corrigirEstruturaDados(dadosParsed);
                
                console.log('✅ Dados após correção:', unidadeData);
                
            } catch (e) {
                console.error('❌ Erro ao parsear dados:', e);
                console.log('🔍 String recebida:', dadosParam);
            }
        }
        
        // ============================================
        // SE NÃO TIVER O PARÂMETRO 'dados', TENTAR O FORMATO ANTIGO
        // ============================================
        if (!unidadeData) {
            const id = urlParams.get('id');
            if (id) {
                console.log('📦 Usando formato antigo com parâmetros individuais');
                
                // Coletar todos os parâmetros
                const produto = decodeURIComponent(urlParams.get('produto') || '');
                const sku = urlParams.get('sku') || '';
                const lote = urlParams.get('lote') || '';
                const validade = urlParams.get('validade') || '';
                const volume = parseFloat(urlParams.get('volume')) || 1;
                const quantidade = parseFloat(urlParams.get('quantidade')) || 0;
                const unidade = urlParams.get('unidade') || 'UN';
                const unidadeBase = urlParams.get('unidadeBase') || 'UN';
                const qtdPorEmbalagem = parseFloat(urlParams.get('qtdPorEmbalagem')) || 1;
                
                // Calcular unPorEmbalagem se não veio direto
                let unPorEmbalagem = qtdPorEmbalagem;
                if (volume > 0 && quantidade > 0 && !qtdPorEmbalagem) {
                    unPorEmbalagem = quantidade / volume;
                }
                
                unidadeData = {
                    id: id,
                    produtos: [{
                        nome: produto || 'Produto',
                        sku: sku,
                        tipoEmbalagem: unidade,
                        volumes: [{
                            tipo: 'padrao',
                            qtdVolumes: volume,
                            unPorEmbalagem: unPorEmbalagem,
                            totalUN: quantidade,
                            lote: lote,
                            validade: validade,
                            localizacao: '-'
                        }]
                    }],
                    totalVolumes: volume,
                    totalUN: quantidade
                };
                
                console.log('📦 Dados do formato antigo:', unidadeData);
            }
        }

        // ============================================
        // SE AINDA NÃO TIVER DADOS, MOSTRAR ERRO
        // ============================================
        if (!unidadeData) {
            console.error('❌ Nenhum dado encontrado na URL');
            document.body.innerHTML = '<div class="alert alert-danger m-5">Erro: Nenhum dado encontrado na URL</div>';
            throw new Error('Sem dados');
        }

        // ============================================
        // CONSTRUIR LINK PARA BAIXA-VIEW
        // ============================================
        const baseUrl = 'https://rdnegocios8.github.io/ControleEstoqueGoogleSheets/baixa-view.html';
        let linkCompleto;
        
        // Para o QR code, usar o mesmo objeto
        const dadosParaQR = {
            id: unidadeData.id,
            produtos: unidadeData.produtos,
            totalVolumes: unidadeData.totalVolumes,
            totalUN: unidadeData.totalUN
        };
        
        linkCompleto = `${baseUrl}?dados=${encodeURIComponent(JSON.stringify(dadosParaQR))}`;
        console.log('🔗 Link gerado para QR Code:', linkCompleto);

        // ============================================
        // FUNÇÃO PARA FORMATAR DATA
        // ============================================
        function formatarData(dataString) {
            if (!dataString) return 'N/A';
            if (typeof dataString === 'string' && dataString.includes('-')) {
                const partes = dataString.split('-');
                if (partes.length === 3) {
                    return `${partes[2]}/${partes[1]}/${partes[0]}`;
                }
            }
            return dataString;
        }

        // ============================================
        // FUNÇÃO PARA FORMATAR NÚMERO
        // ============================================
        function formatarNumero(valor) {
            if (valor === undefined || valor === null) return '0,00';
            return valor.toFixed(2).replace('.', ',');
        }

        // ============================================
        // FUNÇÃO PARA GERAR QR CODE
        // ============================================
        function gerarQRCode() {
            const qrcodeDiv = document.getElementById('qrcode');
            qrcodeDiv.innerHTML = '';
            
            if (!unidadeData || !unidadeData.id) {
                qrcodeDiv.innerHTML = '<p style="color: #ef4444;">ID da unidade não encontrado</p>';
                return;
            }

            if (typeof QRCode !== 'undefined') {
                try {
                    // Gerar QR Code
                    QRCode.toCanvas(document.createElement('canvas'), linkCompleto, {
                        width: 250,
                        margin: 2
                    }, function(err, canvas) {
                        if (err) {
                            console.error('Erro:', err);
                            qrcodeDiv.innerHTML = '<p style="color: #ef4444;">Erro ao gerar QR Code</p>';
                            return;
                        }
                        
                        qrcodeDiv.innerHTML = '';
                        canvas.style.width = '100%';
                        canvas.style.height = 'auto';
                        qrcodeDiv.appendChild(canvas);
                    });

                    // ============================================
                    // PREENCHER INFORMAÇÕES NA TELA
                    // ============================================
                    
                    // Coletar todos os volumes de todos os produtos
                    let totalVolumes = 0;
                    let totalUN = 0;
                    unidadeData.produtos.forEach(produto => {
                        if (produto.volumes && produto.volumes.length > 0) {
                            produto.volumes.forEach(vol => {
                                totalVolumes += vol.qtdVolumes || 0;
                                totalUN += vol.totalUN || 0;
                            });
                        }
                    });

                    // MOSTRAR VOLUME E QUANTIDADE TOTAIS
                    document.getElementById('volume-info').innerHTML = `
                        <div class="volume-item">
                            <div class="volume-value">${formatarNumero(totalVolumes)}</div>
                            <div class="volume-label">VOLUMES</div>
                        </div>
                        <div class="volume-item">
                            <div class="volume-value">${formatarNumero(totalUN)}</div>
                            <div class="volume-label">UN</div>
                        </div>
                    `;

                    // ============================================
                    // MOSTRAR PRODUTOS E VOLUMES
                    // ============================================
                    const container = document.getElementById('produtos-container');
                    container.innerHTML = '';
                    
                    unidadeData.produtos.forEach((produto, pIndex) => {
                        if (!produto.volumes || produto.volumes.length === 0) return;
                        
                        const produtoDiv = document.createElement('div');
                        produtoDiv.className = 'produto-card';
                        
                        // Cabeçalho do produto
                        let produtoHeader = `
                            <div class="produto-header">
                                <span>
                                    <i class="bi bi-box"></i> ${produto.nome || 'Produto'}
                                    ${produto.sku ? `<small>(SKU: ${produto.sku})</small>` : ''}
                                </span>
                                <span class="badge bg-info">${produto.tipoEmbalagem || 'UN'}</span>
                            </div>
                        `;
                        
                        // Volumes do produto
                        let volumesHtml = '<div class="volumes-grid">';
                        
                        produto.volumes.forEach((vol, vIndex) => {
                            volumesHtml += `
                                <div class="volume-card">
                                    <span class="tipo ${vol.tipo === 'padrao' ? 'padrao' : 'fora'}">
                                        ${vol.tipo === 'padrao' ? 'PADRÃO' : 'FORA DO PADRÃO'}
                                    </span>
                                    <p><strong>Lote:</strong> ${vol.lote || 'N/A'}</p>
                                    <p><strong>Validade:</strong> ${formatarData(vol.validade)}</p>
                                    <p><strong>Volume:</strong> ${vol.qtdVolumes || 0} ${produto.tipoEmbalagem || 'UN'}</p>
                                    <p><strong>UN/Volume:</strong> ${formatarNumero(vol.unPorEmbalagem || 0)}</p>
                                    <p><strong>Total UN:</strong> ${formatarNumero(vol.totalUN || 0)}</p>
                                    ${vol.localizacao && vol.localizacao !== '-' ? `<p><strong>Local:</strong> ${vol.localizacao}</p>` : ''}
                                </div>
                            `;
                        });
                        
                        volumesHtml += '</div>';
                        
                        produtoDiv.innerHTML = produtoHeader + volumesHtml;
                        container.appendChild(produtoDiv);
                    });

                    document.getElementById('info-id').innerHTML = `
                        <i class="bi bi-upc-scan"></i> ID: ${unidadeData.id}
                    `;

                } catch (e) {
                    console.error('Erro:', e);
                    qrcodeDiv.innerHTML = '<p style="color: #ef4444;">Erro ao gerar QR Code</p>';
                }
            } else {
                qrcodeDiv.innerHTML = '<p style="color: #ef4444;">Biblioteca não carregada</p>';
            }
        }

        function baixarQR() {
            const canvas = document.querySelector('#qrcode canvas');
            if (!canvas) {
                alert('QR Code ainda não foi gerado!');
                return;
            }
            
            const link = document.createElement('a');
            link.download = `qrcode-${unidadeData?.id || 'unidade'}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        window.onload = function() {
            setTimeout(gerarQRCode, 100);
        };
    </script>
</body>
</html>
