<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etiqueta de Palete - Validade Rotativa</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0c10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            margin: 0;
        }
        
        .container {
            max-width: 1200px;
            width: 100%;
        }
        
        .card {
            background: #151515;
            border: 2px solid #ffd700;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        
        h2 {
            color: #ffd700;
            text-align: center;
            font-size: 36px;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        /* Etiqueta ESCURA */
        .etiqueta {
            font-family: 'Courier New', monospace;
            border: 4px solid #ffd700;
            padding: 40px;
            margin: 20px auto;
            background: #1e1e1e;
            width: 100%;
            max-width: 1100px;
            min-height: 700px;
            display: flex;
            flex-direction: column;
            page-break-inside: avoid;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            color: #f0f0f0;
        }
        
        .etiqueta * {
            color: #f0f0f0;
        }
        
        .etiqueta-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid #ffd700;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        
        .etiqueta-codigo {
            font-size: 48px;
            font-weight: bold;
            color: #ffd700 !important;
        }
        
        .etiqueta-ordem {
            font-size: 120px;
            font-weight: bold;
            color: #ffd700 !important;
            line-height: 1;
        }
        
        .etiqueta-ordem sup {
            font-size: 0.55em;
            vertical-align: super;
            margin-left: -0.1em;
            color: #ffd700;
            font-weight: bold;
        }
        
        .etiqueta-descricao {
            font-size: 42px;
            font-weight: bold;
            margin: 30px 0;
            text-transform: uppercase;
            line-height: 1.3;
            border-bottom: 2px solid #ffd700;
            padding-bottom: 20px;
            color: #fff !important;
        }
        
        .etiqueta-linha {
            display: flex;
            margin: 25px 0;
            font-size: 40px;
            align-items: baseline;
        }
        
        .etiqueta-label {
            font-weight: bold;
            width: 200px;
            color: #aaa !important;
        }
        
        .etiqueta-valor {
            flex: 1;
            font-weight: bold;
            color: #ffd700 !important;
        }
        
        .etiqueta-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 4px solid #ffd700;
            font-weight: bold;
            font-size: 48px;
            color: #fff !important;
        }
        
        .qr-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 40px;
            padding: 20px;
            background: #252525;
            border: 2px solid #ffd700;
        }
        
        .qr-code-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #ffd700;
        }
        
        #qrcode canvas, #qrcode img {
            width: 200px;
            height: 200px;
        }
        
        .qr-info {
            font-size: 24px;
            margin-left: 30px;
            color: #ccc !important;
        }
        
        .qr-info p {
            margin: 10px 0;
            color: #ccc !important;
        }
        
        .qr-info strong {
            color: #ffd700 !important;
        }
        
        .info-paletes {
            background: #151515;
            border: 2px solid #ffd700;
            border-radius: 16px;
            padding: 30px;
            margin: 30px 0;
        }
        
        .info-paletes h3 {
            font-size: 32px;
            margin: 0 0 20px 0;
            color: #ffd700;
            border-bottom: 2px solid #ffd700;
            padding-bottom: 10px;
        }
        
        .tabela-validades {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Courier New', monospace;
            font-size: 20px;
        }
        
        .tabela-validades th {
            background: #0a0c10;
            color: #ffd700;
            padding: 15px;
            text-align: left;
            font-size: 22px;
            border-bottom: 2px solid #ffd700;
        }
        
        .tabela-validades td {
            padding: 15px;
            border-bottom: 1px solid #333;
            font-size: 20px;
            color: #ccc;
        }
        
        .tabela-validades tr.atual {
            background: #2a2a0a;
            font-weight: bold;
        }
        
        .tabela-validades tr.atual td {
            color: #ffd700;
        }
        
        .ordem-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 20px;
            color: white;
        }
        
        .ordem-badge sup {
            font-size: 0.7em;
            vertical-align: super;
        }
        
        .ordem-1 { background: #8b0000; }
        .ordem-2 { background: #b45f06; }
        .ordem-3 { background: #9e6d03; }
        .ordem-4 { background: #0e5c3f; }
        .ordem-5 { background: #0b4f6c; }
        
        .qr-actions {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        
        .qr-actions button {
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 180px;
            justify-content: center;
        }
        
        .btn-download {
            background: #0a4f8a;
            color: white;
        }
        
        .btn-print {
            background: #b45f06;
            color: white;
        }
        
        .btn-close {
            background: #5a3a3a;
            color: white;
        }
        
        .btn-view {
            background: #3a4a5a;
            color: white;
        }
        
        .qr-actions button:hover {
            transform: translateY(-3px);
            filter: brightness(1.2);
            box-shadow: 0 10px 25px rgba(255, 215, 0, 0.3);
        }
        
        .resumo-sku {
            background: #151515;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            font-size: 24px;
            border: 2px solid #ffd700;
            color: #ccc;
        }
        
        .resumo-sku strong {
            color: #ffd700;
        }
        
        @media print {
            body {
                background: white;
                padding: 0;
                margin: 0;
            }
            
            .container {
                max-width: 100%;
                padding: 0;
                margin: 0;
            }
            
            .card {
                box-shadow: none;
                border: none;
                padding: 0;
                margin: 0;
                background: white;
            }
            
            h2, .qr-actions, .info-paletes, .btn-view, .resumo-sku {
                display: none !important;
            }
            
            .etiqueta {
                border: 3px solid #000;
                page-break-inside: avoid;
                page-break-after: avoid;
                page-break-before: avoid;
                margin: 0 auto;
                max-width: 100%;
                min-height: auto;
                height: auto;
                box-shadow: none;
                padding: 30px;
                position: relative;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: white;
                color: black;
            }
            
            .etiqueta * {
                color: black !important;
            }
            
            .etiqueta-header {
                border-bottom: 4px solid #000;
            }
            
            .etiqueta-codigo, .etiqueta-ordem, .etiqueta-descricao, 
            .etiqueta-label, .etiqueta-valor, .etiqueta-footer, .qr-info {
                color: black !important;
            }
            
            .etiqueta-ordem sup {
                color: black !important;
                font-size: 0.5em;
            }
            
            .qr-section {
                border: 2px solid #000;
                background: white;
            }
            
            .qr-code-box {
                border: 2px solid #000;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>🏷️ Etiqueta de Palete - Ordem Rotativa</h2>
            
            <div class="resumo-sku" id="resumo-sku">
                Carregando informações...
            </div>
            
            <div class="etiqueta" id="etiquetaVisualizacao">
                <!-- Preenchido via JavaScript -->
            </div>
            
            <div class="info-paletes" id="infoPaletes">
                <!-- Preenchido via JavaScript -->
            </div>
            
            <div class="qr-actions">
                <button class="btn-download" onclick="baixarEtiqueta()">
                    <i class="bi bi-download"></i> Baixar PNG
                </button>
                <button class="btn-print" onclick="imprimirEtiqueta()">
                    <i class="bi bi-printer"></i> Imprimir Etiqueta
                </button>
                <button class="btn-view" onclick="window.location.href='qr-view.html'">
                    <i class="bi bi-arrow-left"></i> Voltar
                </button>
                <button class="btn-close" onclick="window.close()">
                    <i class="bi bi-x-lg"></i> Fechar
                </button>
            </div>
        </div>
    </div>

    <script>
        // Função para buscar todas as unidades do mesmo SKU
        function buscarUnidadesPorSKU(sku, unidadeAtualId) {
            const todasUnidades = [
                {
                    id: 'UN-KØNLQSNX-AMZK',
                    sku: '00030202',
                    produto: 'FILME BISC. ROSQUINHA COCO EMEGE 600GR',
                    lote: 'AAACXB0101',
                    validade: '07/04/2026',
                    volume: '583.50',
                    quantidade: '1',
                    unidade: 'PLT'
                },
                {
                    id: 'UN-2EP1M8IO-9Y8R',
                    sku: '00030202',
                    produto: 'FILME BISC. ROSQUINHA COCO EMEGE 600GR',
                    lote: 'AAACS60101',
                    validade: '25/06/2026',
                    volume: '535.87',
                    quantidade: '1',
                    unidade: 'PLT'
                },
                {
                    id: 'UN-CUT9HP6G-46K4',
                    sku: '00030202',
                    produto: 'FILME BISC. ROSQUINHA COCO EMEGE 600GR',
                    lote: 'AAACS60101',
                    validade: '25/06/2026',
                    volume: '555.88',
                    quantidade: '1',
                    unidade: 'PLT'
                }
            ];
            return todasUnidades.filter(u => u.sku === sku);
        }

        // Carregar dados da URL
        const urlParams = new URLSearchParams(window.location.search);
        const unidadeId = urlParams.get('id') || 'UN-2EP1M8IO-9Y8R';
        const sku = urlParams.get('sku') || '00030202';
        const lote = urlParams.get('lote') || 'AAACS60101';
        const validade = urlParams.get('validade') || '2026-06-26';
        const produtoNome = decodeURIComponent(urlParams.get('produto') || 'FILME BISC. ROSQUINHA COCO EMEGE 600GR');
        const volume = urlParams.get('volume') || '535.87';
        const quantidade = urlParams.get('quantidade') || '1';
        const unidade = urlParams.get('unidade') || 'PLT';

        // ============================================
        // SOLUÇÃO DEFINITIVA - USA A LISTA COMO REFERÊNCIA
        // ============================================
        
        // Buscar todas unidades do SKU
        const todasUnidades = buscarUnidadesPorSKU(sku, unidadeId);

        // Função de normalização (igual da lista)
        const normalizarData = (dataStr) => {
            if (!dataStr) return '';
            // Se já vier YYYY-MM-DD (da URL), mantém
            if (dataStr.includes('-')) {
                return dataStr;
            }
            // Se vier DD/MM/YYYY (dos dados), converte
            if (dataStr.includes('/')) {
                const partes = dataStr.split('/');
                return `${partes[2]}-${partes[1].padStart(2, '0')}-${partes[0].padStart(2, '0')}`;
            }
            return dataStr;
        };

        // Ordenar unidades por data (igual da lista)
        const unidadesOrdenadas = [...todasUnidades].sort((a, b) => {
            const dataA = normalizarData(a.validade);
            const dataB = normalizarData(b.validade);
            return dataA.localeCompare(dataB);
        });

        // Extrair datas únicas (igual da lista)
        const datasUnicas = [...new Set(unidadesOrdenadas.map(u => normalizarData(u.validade)))].sort();

        // Encontrar a posição da unidade atual
        const dataAtualNorm = normalizarData(validade);
        const posicaoNaLista = datasUnicas.indexOf(dataAtualNorm) + 1;

        // VARIÁVEL QUE PUXA DA LISTA - esta é a ordem correta!
        const numeroOrdem = posicaoNaLista; // 2 para a unidade 25/06/2026

        console.log('📊 DATAS ÚNICAS:', datasUnicas);
        console.log('📍 DATA ATUAL:', dataAtualNorm);
        console.log('🎯 ORDEM DA UNIDADE:', numeroOrdem); // DEVE SER 2!

        // Mapa de ordens para usar na tabela
        const mapaOrdem = {};
        unidadesOrdenadas.forEach(u => {
            const dataNorm = normalizarData(u.validade);
            const pos = datasUnicas.indexOf(dataNorm) + 1;
            mapaOrdem[u.id] = pos;
        });

        // Construir link QR Code
        const baseUrl = 'https://rdnegocios8.github.io/ControleEstoqueGoogleSheets/baixa-view.html';
        const linkCompleto = `${baseUrl}?id=${unidadeId}&sku=${sku}&lote=${lote}&validade=${validade}&produto=${encodeURIComponent(produtoNome)}&volume=${volume}&quantidade=${quantidade}&unidade=${unidade}`;

        // Função para atualizar a etiqueta
        function atualizarEtiqueta() {
            const etiquetaDiv = document.getElementById('etiquetaVisualizacao');
            
            // Formatar data para exibição
            let dataExibicao = validade;
            if (validade.includes('-')) {
                const partes = validade.split('-');
                dataExibicao = `${partes[2]}/${partes[1]}/${partes[0]}`;
            }
            
            // Criar HTML do ordinal
            const ordemHTML = `${numeroOrdem}<sup>º</sup>`;
            
            etiquetaDiv.innerHTML = `
                <div class="etiqueta-header">
                    <div class="etiqueta-codigo">CODIGO: ${sku}</div>
                    <div class="etiqueta-ordem">${ordemHTML}</div>
                </div>
                <div class="etiqueta-descricao">${produtoNome}</div>
                <div class="etiqueta-linha">
                    <span class="etiqueta-label">LOTE:</span>
                    <span class="etiqueta-valor">${lote}</span>
                </div>
                <div class="etiqueta-linha">
                    <span class="etiqueta-label">VALIDADE:</span>
                    <span class="etiqueta-valor">${dataExibicao}</span>
                </div>
                <div class="etiqueta-footer">
                    <span>${volume} Kg</span>
                    <span>${quantidade} ${unidade}</span>
                </div>
                <div class="qr-section">
                    <div class="qr-code-box" id="qr-code-container">
                        <div id="qrcode"></div>
                    </div>
                    <div class="qr-info">
                        <p><strong>SKU:</strong> ${sku}</p>
                        <p><strong>Total:</strong> ${todasUnidades.length} unidades</p>
                        <p><strong>ID:</strong> ${unidadeId.substring(0, 15)}...</p>
                    </div>
                </div>
            `;
        }

        // Gerar QR Code
        function gerarQRCode() {
            const qrcodeDiv = document.getElementById('qrcode');
            if (!qrcodeDiv) return;
            
            qrcodeDiv.innerHTML = '';
            
            QRCode.toCanvas(document.createElement('canvas'), linkCompleto, {
                width: 200,
                margin: 2
            }, function(err, canvas) {
                if (err) return;
                qrcodeDiv.appendChild(canvas);
            });

            // Atualizar resumo
            document.getElementById('resumo-sku').innerHTML = `
                <strong>SKU: ${sku}</strong> | 
                <strong>Total de unidades:</strong> ${todasUnidades.length} | 
                <strong>Unidade atual:</strong> <span style="color: #ffd700; font-weight: bold;">${numeroOrdem}º</span>
            `;

            // Gerar tabela (usando o mapa de ordens já calculado)
            let infoHtml = '<h3>📦 TODAS AS UNIDADES DO SKU ' + sku + ':</h3>';
            infoHtml += '<table class="tabela-validades">';
            infoHtml += '<tr><th>ID</th><th>LOTE</th><th>VALIDADE</th><th>ORDEM</th></tr>';
            
            unidadesOrdenadas.forEach(u => {
                const pos = mapaOrdem[u.id];
                const ordemBadge = `${pos}<sup>º</sup>`;
                
                infoHtml += `<tr ${u.id === unidadeId ? 'class="atual"' : ''}>`;
                infoHtml += `<td>${u.id.substring(0, 12)}...</td>`;
                infoHtml += `<td>${u.lote}</td>`;
                infoHtml += `<td>${u.validade}</td>`;
                infoHtml += `<td><span class="ordem-badge ordem-${Math.min(pos, 5)}">${ordemBadge}</span></td>`;
                infoHtml += `</tr>`;
            });
            
            infoHtml += '</table>';
            document.getElementById('infoPaletes').innerHTML = infoHtml;
        }

        // Função para imprimir
        function imprimirEtiqueta() {
            window.print();
        }

        // Função para baixar
        function baixarEtiqueta() {
            const qrCanvas = document.querySelector('#qrcode canvas');
            if (!qrCanvas) {
                alert('Aguarde o QR Code ser gerado!');
                return;
            }
            
            const canvas = document.createElement('canvas');
            canvas.width = 1200;
            canvas.height = 800;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 6;
            ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);
            
            let dataExibicao = validade;
            if (validade.includes('-')) {
                const partes = validade.split('-');
                dataExibicao = `${partes[2]}/${partes[1]}/${partes[0]}`;
            }
            
            ctx.fillStyle = 'black';
            ctx.font = 'bold 52px "Courier New"';
            ctx.fillText(`CODIGO: ${sku}`, 50, 100);
            
            ctx.font = 'bold 140px "Courier New"';
            ctx.fillText(numeroOrdem + 'º', 900, 150);
            
            ctx.beginPath();
            ctx.moveTo(50, 180);
            ctx.lineTo(1150, 180);
            ctx.stroke();
            
            ctx.font = 'bold 48px "Courier New"';
            ctx.fillText(produtoNome.substring(0, 30), 50, 260);
            
            ctx.font = '44px "Courier New"';
            ctx.fillText('LOTE:', 50, 420);
            ctx.font = 'bold 44px "Courier New"';
            ctx.fillText(lote, 250, 420);
            
            ctx.font = '44px "Courier New"';
            ctx.fillText('VALIDADE:', 50, 490);
            ctx.font = 'bold 44px "Courier New"';
            ctx.fillText(dataExibicao, 300, 490);
            
            ctx.beginPath();
            ctx.moveTo(50, 570);
            ctx.lineTo(1150, 570);
            ctx.stroke();
            
            ctx.font = 'bold 52px "Courier New"';
            ctx.fillText(`${volume} Kg`, 50, 650);
            ctx.fillText(`${quantidade} ${unidade}`, 800, 650);
            
            ctx.drawImage(qrCanvas, 150, 680, 150, 150);
            
            ctx.font = '24px "Courier New"';
            ctx.fillText(`SKU: ${sku} | Total: ${todasUnidades.length} unidades`, 350, 780);
            
            const link = document.createElement('a');
            link.download = `etiqueta-${sku}-${numeroOrdem}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Inicializar
        window.onload = function() {
            atualizarEtiqueta();
            setTimeout(gerarQRCode, 100);
        };
    </script>
</body>
</html>
