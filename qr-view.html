<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code da Unidade</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            margin: 0;
        }
        
        .qr-container {
            max-width: 1100px;  /* Aumentado para paisagem */
            width: 100%;
        }
        
        .qr-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 3px solid #fbbf24;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 30px rgba(251, 191, 36, 0.1);
            position: relative;
            overflow: hidden;
        }
        
        .qr-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #fbbf24, #f59e0b, #fbbf24);
        }
        
        .badge-unidade {
            display: inline-block;
            padding: 10px 25px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #0f172a;
            border-radius: 40px;
            font-weight: 800;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 1.1rem;
            border: 2px solid #ffffff33;
        }
        
        /* LAYOUT PAISAGEM: QR Code à esquerda, informações à direita */
        .paisagem-container {
            display: flex;
            gap: 30px;
            align-items: flex-start;
        }
        
        .qr-code-section {
            flex: 0 0 300px;  /* Largura fixa para o QR Code */
            text-align: center;
        }
        
        .qr-code-box {
            background: linear-gradient(135deg, #f1f5f9, #e2e8f0);
            padding: 20px;
            border-radius: 20px;
            border: 3px solid #fbbf24;
            box-shadow: 0 15px 40px rgba(251, 191, 36, 0.2);
            margin-bottom: 15px;
        }
        
        #qrcode canvas, #qrcode img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .info-section {
            flex: 1;
            min-width: 0; /* Evita overflow */
        }
        
        /* Título do produto BEM GRANDE */
        .produto-titulo-grande {
            background: linear-gradient(135deg, #334155, #1e293b);
            border: 2px solid #fbbf24;
            border-radius: 16px;
            padding: 20px 25px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(251, 191, 36, 0.08);
        }
        
        .produto-titulo-grande h2 {
            color: #fbbf24;
            font-size: 1.8rem;
            font-weight: 800;
            margin: 0 0 10px 0;
            line-height: 1.3;
            word-break: break-word;
        }
        
        .produto-titulo-grande .produto-sku {
            color: #94a3b8;
            font-size: 1.2rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .produto-titulo-grande .produto-sku strong {
            color: #fbbf24;
            font-size: 1.3rem;
        }
        
        .volume-info-paisagem {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }
        
        .volume-card-destaque {
            flex: 1;
            background: linear-gradient(135deg, #334155, #1e293b);
            border: 2px solid #fbbf24;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }
        
        .volume-card-destaque .volume-valor {
            font-size: 2.5rem;
            font-weight: 800;
            color: #fbbf24;
            line-height: 1.2;
        }
        
        .volume-card-destaque .volume-label {
            font-size: 1rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .produtos-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }
        
        .produto-card {
            background: linear-gradient(135deg, #334155, #1e293b);
            border-radius: 16px;
            padding: 20px;
            border: 2px solid #fbbf24;
            box-shadow: 0 8px 20px rgba(251, 191, 36, 0.08);
        }
        
        .produto-header {
            color: #fbbf24;
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #fbbf2433;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .produto-header small {
            color: #94a3b8;
            font-size: 1rem;
            font-weight: normal;
        }
        
        .volumes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
        }
        
        .volume-card {
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 18px;
            transition: all 0.2s ease;
        }
        
        .volume-card:hover {
            border-color: #fbbf24;
            box-shadow: 0 4px 12px rgba(251, 191, 36, 0.1);
        }
        
        .volume-card .tipo {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }
        
        .volume-card .tipo.padrao {
            background: #10b981;
            color: white;
        }
        
        .volume-card .tipo.fora {
            background: #f59e0b;
            color: #0f172a;
        }
        
        .volume-card p {
            margin: 10px 0;
            color: #cbd5e1;
            font-size: 1rem;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }
        
        .volume-card p strong {
            color: #fbbf24;
            font-size: 1.1rem;
        }
        
        .info-id {
            background: #1e293b;
            padding: 15px 20px;
            border-radius: 12px;
            color: #fbbf24;
            word-break: break-all;
            margin: 20px 0;
            border: 2px solid #fbbf24;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            font-weight: 600;
        }
        
        .qr-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        
        .qr-actions button {
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 150px;
            justify-content: center;
        }
        
        .btn-download {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
        }
        
        .btn-print {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #0f172a;
        }
        
        .btn-close {
            background: linear-gradient(135deg, #64748b, #475569);
            color: white;
        }
        
        .qr-actions button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(251, 191, 36, 0.25);
        }
        
        .qr-actions button:active {
            transform: translateY(0);
        }
        
        /* ESTILO PARA IMPRESSÃO */
        @media print {
            body {
                background: white;
                padding: 0.5cm;
            }
            
            .qr-card {
                background: white;
                border: 2px solid #000;
                box-shadow: none;
                padding: 0.5cm;
            }
            
            .badge-unidade {
                background: #000;
                color: white;
                border: none;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            
            .qr-actions {
                display: none;
            }
            
            .qr-code-box {
                background: white;
                border: 2px solid #000;
                box-shadow: none;
            }
            
            .produto-titulo-grande,
            .volume-card-destaque,
            .produto-card,
            .volume-card {
                background: white;
                border: 2px solid #000;
                box-shadow: none;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            
            .produto-titulo-grande h2,
            .produto-header {
                color: #000;
            }
            
            .volume-card .tipo.padrao {
                background: #000;
                color: white;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            
            .volume-card .tipo.fora {
                background: #666;
                color: white;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            
            .volume-valor,
            .volume-card p strong {
                color: #000;
                font-weight: bold;
            }
            
            .info-id {
                border: 2px solid #000;
                color: #000;
                background: white;
            }
        }
    </style>
</head>
<body>
    <div class="qr-container">
        <div class="qr-card">
            <div class="badge-unidade">
                <i class="bi bi-qr-code-scan"></i> QR CODE DA UNIDADE
            </div>
            
            <div class="paisagem-container">
                <!-- QR Code à esquerda -->
                <div class="qr-code-section">
                    <div class="qr-code-box" id="qr-code-container">
                        <div id="qrcode"></div>
                    </div>
                    
                    <div class="info-id" id="info-id"></div>
                </div>
                
                <!-- Informações à direita -->
                <div class="info-section">
                    <!-- Título do produto BEM GRANDE (será preenchido via JS) -->
                    <div class="produto-titulo-grande" id="produto-titulo-grande">
                        <h2 id="produto-nome-grande">Carregando...</h2>
                        <div class="produto-sku" id="produto-sku-grande"></div>
                    </div>
                    
                    <!-- Totais em destaque -->
                    <div class="volume-info-paisagem" id="volume-info-paisagem">
                        <div class="volume-card-destaque">
                            <div class="volume-valor" id="total-volumes-destaque">0</div>
                            <div class="volume-label">VOLUMES</div>
                        </div>
                        <div class="volume-card-destaque">
                            <div class="volume-valor" id="total-un-destaque">0</div>
                            <div class="volume-label">UNIDADES</div>
                        </div>
                    </div>
                    
                    <!-- Lista de produtos e volumes -->
                    <div class="produtos-container" id="produtos-container"></div>
                </div>
            </div>
            
            <div class="qr-actions">
                <button class="btn-download" onclick="baixarQR()">
                    <i class="bi bi-download"></i> Baixar QR
                </button>
                <button class="btn-print" onclick="window.print()">
                    <i class="bi bi-printer"></i> Imprimir
                </button>
                <button class="btn-close" onclick="window.close()">
                    <i class="bi bi-x-lg"></i> Fechar
                </button>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // FUNÇÃO PARA CORRIGIR A ESTRUTURA DOS DADOS
        // ============================================
        function corrigirEstruturaDados(dados) {
            console.log('🔧 Corrigindo estrutura:', dados);
            
            if (dados.produtos && dados.produtos.length > 0) {
                dados.produtos.forEach(produto => {
                    if (!produto.volumes) produto.volumes = [];
                    if (!produto.tipoEmbalagem) produto.tipoEmbalagem = 'UN';
                });
                return dados;
            }
            
            if (dados.id && (dados.produto || dados.sku || dados.nome)) {
                let volumes = [];
                if (dados.volumes && dados.volumes.length > 0) {
                    volumes = dados.volumes;
                } else if (dados.volume !== undefined) {
                    volumes = [{
                        tipo: dados.tipo || 'padrao',
                        qtdVolumes: parseFloat(dados.volume) || 1,
                        unPorEmbalagem: parseFloat(dados.qtdPorEmbalagem) || 1,
                        totalUN: parseFloat(dados.quantidade) || 0,
                        lote: dados.lote || '',
                        validade: dados.validade || '',
                        localizacao: dados.localizacao || '-'
                    }];
                }
                
                return {
                    id: dados.id,
                    produtos: [{
                        nome: dados.produto || dados.nome || 'Produto',
                        sku: dados.sku || 'SKU',
                        tipoEmbalagem: dados.tipoEmbalagem || dados.unidade || 'UN',
                        volumes: volumes
                    }],
                    totalVolumes: dados.totalVolumes || (dados.volume ? parseFloat(dados.volume) : volumes.reduce((sum, v) => sum + (v.qtdVolumes || 1), 0)),
                    totalUN: dados.totalUN || (dados.quantidade ? parseFloat(dados.quantidade) : volumes.reduce((sum, v) => sum + (v.totalUN || 0), 0))
                };
            }
            
            return {
                id: dados.id || 'ID desconhecido',
                produtos: [{
                    nome: dados.produto || dados.nome || 'Produto',
                    sku: dados.sku || 'SKU',
                    tipoEmbalagem: dados.tipoEmbalagem || dados.unidade || 'UN',
                    volumes: [{
                        tipo: 'padrao',
                        qtdVolumes: 1,
                        unPorEmbalagem: 1,
                        totalUN: 0,
                        lote: '',
                        validade: '',
                        localizacao: '-'
                    }]
                }],
                totalVolumes: 1,
                totalUN: 0
            };
        }

        // ============================================
        // CARREGAR DADOS DA URL
        // ============================================
        const urlParams = new URLSearchParams(window.location.search);
        const dadosParam = urlParams.get('dados');
        
        let unidadeData = null;
        
        if (dadosParam) {
            try {
                const dadosParsed = JSON.parse(decodeURIComponent(dadosParam));
                unidadeData = corrigirEstruturaDados(dadosParsed);
                console.log('✅ Dados carregados:', unidadeData);
            } catch (e) {
                console.error('❌ Erro ao parsear dados:', e);
            }
        }
        
        if (!unidadeData) {
            const id = urlParams.get('id');
            if (id) {
                const produto = decodeURIComponent(urlParams.get('produto') || '');
                const sku = urlParams.get('sku') || '';
                const lote = urlParams.get('lote') || '';
                const validade = urlParams.get('validade') || '';
                const volume = parseFloat(urlParams.get('volume')) || 1;
                const quantidade = parseFloat(urlParams.get('quantidade')) || 0;
                const unidade = urlParams.get('unidade') || 'UN';
                const qtdPorEmbalagem = parseFloat(urlParams.get('qtdPorEmbalagem')) || 1;
                
                unidadeData = {
                    id: id,
                    produtos: [{
                        nome: produto || 'Produto',
                        sku: sku,
                        tipoEmbalagem: unidade,
                        volumes: [{
                            tipo: 'padrao',
                            qtdVolumes: volume,
                            unPorEmbalagem: qtdPorEmbalagem,
                            totalUN: quantidade,
                            lote: lote,
                            validade: validade,
                            localizacao: '-'
                        }]
                    }],
                    totalVolumes: volume,
                    totalUN: quantidade
                };
            }
        }

        if (!unidadeData) {
            document.body.innerHTML = '<div class="alert alert-danger m-5">Erro: Nenhum dado encontrado</div>';
            throw new Error('Sem dados');
        }

        // ============================================
        // FUNÇÕES AUXILIARES
        // ============================================
        function formatarData(dataString) {
            if (!dataString) return 'N/A';
            if (typeof dataString === 'string' && dataString.includes('-')) {
                const partes = dataString.split('-');
                if (partes.length === 3) {
                    return `${partes[2]}/${partes[1]}/${partes[0]}`;
                }
            }
            return dataString;
        }

        function formatarNumero(valor) {
            if (valor === undefined || valor === null) return '0,00';
            return valor.toFixed(2).replace('.', ',');
        }

        // ============================================
        // GERAR QR CODE E PREENCHER TELA
        // ============================================
        function gerarQRCode() {
            const qrcodeDiv = document.getElementById('qrcode');
            qrcodeDiv.innerHTML = '';
            
            if (!unidadeData || !unidadeData.id) {
                qrcodeDiv.innerHTML = '<p style="color: #ef4444;">ID não encontrado</p>';
                return;
            }

            const baseUrl = 'https://rdnegocios8.github.io/ControleEstoqueGoogleSheets/baixa-view.html';
            const dadosParaQR = {
                id: unidadeData.id,
                produtos: unidadeData.produtos,
                totalVolumes: unidadeData.totalVolumes,
                totalUN: unidadeData.totalUN
            };
            
            const linkCompleto = `${baseUrl}?dados=${encodeURIComponent(JSON.stringify(dadosParaQR))}`;

            if (typeof QRCode !== 'undefined') {
                try {
                    QRCode.toCanvas(document.createElement('canvas'), linkCompleto, {
                        width: 250,
                        margin: 2
                    }, function(err, canvas) {
                        if (err) {
                            console.error('Erro:', err);
                            qrcodeDiv.innerHTML = '<p style="color: #ef4444;">Erro ao gerar QR</p>';
                            return;
                        }
                        
                        qrcodeDiv.innerHTML = '';
                        canvas.style.width = '100%';
                        canvas.style.height = 'auto';
                        qrcodeDiv.appendChild(canvas);
                    });

                    // ============================================
                    // PREENCHER INFORMAÇÕES NA TELA
                    // ============================================
                    
                    // Se for unidade múltipla, mostrar todos os produtos
                    if (unidadeData.produtos.length > 1) {
                        // Título genérico
                        document.getElementById('produto-nome-grande').textContent = 'UNIDADE MÚLTIPLA';
                        document.getElementById('produto-sku-grande').innerHTML = `<strong>${unidadeData.produtos.length} produtos</strong> na unidade`;
                    } else {
                        // Produto único - mostrar nome GRANDE
                        const produto = unidadeData.produtos[0];
                        document.getElementById('produto-nome-grande').textContent = produto.nome || 'Produto';
                        document.getElementById('produto-sku-grande').innerHTML = `<strong>SKU:</strong> ${produto.sku || 'N/A'} | <strong>Embalagem:</strong> ${produto.tipoEmbalagem || 'UN'}`;
                    }
                    
                    // Calcular totais
                    let totalVolumes = 0;
                    let totalUN = 0;
                    unidadeData.produtos.forEach(produto => {
                        if (produto.volumes) {
                            produto.volumes.forEach(vol => {
                                totalVolumes += vol.qtdVolumes || 0;
                                totalUN += vol.totalUN || 0;
                            });
                        }
                    });

                    // Mostrar totais em destaque
                    document.getElementById('total-volumes-destaque').textContent = formatarNumero(totalVolumes);
                    document.getElementById('total-un-destaque').textContent = formatarNumero(totalUN);
                    
                    // Mostrar ID
                    document.getElementById('info-id').innerHTML = `<i class="bi bi-upc-scan"></i> ID: ${unidadeData.id}`;

                    // ============================================
                    // MOSTRAR PRODUTOS E VOLUMES
                    // ============================================
                    const container = document.getElementById('produtos-container');
                    container.innerHTML = '';
                    
                    unidadeData.produtos.forEach((produto, pIndex) => {
                        if (!produto.volumes || produto.volumes.length === 0) return;
                        
                        const produtoDiv = document.createElement('div');
                        produtoDiv.className = 'produto-card';
                        
                        // Cabeçalho do produto
                        let produtoHeader = `
                            <div class="produto-header">
                                <span>
                                    <i class="bi bi-box"></i> ${produto.nome || 'Produto'}
                                    ${unidadeData.produtos.length > 1 ? `<small>(SKU: ${produto.sku})</small>` : ''}
                                </span>
                                <span class="badge bg-info" style="font-size: 1rem; padding: 5px 15px;">${produto.tipoEmbalagem || 'UN'}</span>
                            </div>
                        `;
                        
                        // Volumes do produto
                        let volumesHtml = '<div class="volumes-grid">';
                        
                        produto.volumes.forEach((vol, vIndex) => {
                            volumesHtml += `
                                <div class="volume-card">
                                    <div class="tipo ${vol.tipo === 'padrao' ? 'padrao' : 'fora'}">
                                        ${vol.tipo === 'padrao' ? '⚡ PADRÃO' : '⚠️ FORA DO PADRÃO'}
                                    </div>
                                    <p>
                                        <strong>Lote:</strong> 
                                        <span>${vol.lote || 'N/A'}</span>
                                    </p>
                                    <p>
                                        <strong>Validade:</strong> 
                                        <span>${formatarData(vol.validade)}</span>
                                    </p>
                                    <p>
                                        <strong>Volume:</strong> 
                                        <span>${vol.qtdVolumes || 0} ${produto.tipoEmbalagem}</span>
                                    </p>
                                    <p>
                                        <strong>UN/Volume:</strong> 
                                        <span>${formatarNumero(vol.unPorEmbalagem || 0)}</span>
                                    </p>
                                    <p>
                                        <strong>Total UN:</strong> 
                                        <span style="color: #fbbf24; font-weight: 700;">${formatarNumero(vol.totalUN || 0)}</span>
                                    </p>
                                    ${vol.localizacao && vol.localizacao !== '-' ? 
                                        `<p><strong>Local:</strong> <span>${vol.localizacao}</span></p>` : ''}
                                </div>
                            `;
                        });
                        
                        volumesHtml += '</div>';
                        
                        produtoDiv.innerHTML = produtoHeader + volumesHtml;
                        container.appendChild(produtoDiv);
                    });

                } catch (e) {
                    console.error('Erro:', e);
                    qrcodeDiv.innerHTML = '<p style="color: #ef4444;">Erro ao gerar QR Code</p>';
                }
            } else {
                qrcodeDiv.innerHTML = '<p style="color: #ef4444;">Biblioteca não carregada</p>';
            }
        }

        function baixarQR() {
            const canvas = document.querySelector('#qrcode canvas');
            if (!canvas) {
                alert('QR Code ainda não foi gerado!');
                return;
            }
            
            const link = document.createElement('a');
            link.download = `qrcode-${unidadeData?.id || 'unidade'}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        window.onload = function() {
            setTimeout(gerarQRCode, 100);
        };
    </script>
</body>
</html>
