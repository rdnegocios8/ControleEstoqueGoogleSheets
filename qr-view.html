<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code da Unidade</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Usando biblioteca mais estável -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            margin: 0;
        }
        
        .qr-container {
            max-width: 600px;
            width: 100%;
        }
        
        .qr-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px solid #fbbf24;
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }
        
        .qr-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #fbbf24, #f59e0b, #fbbf24);
        }
        
        .qr-header {
            margin-bottom: 30px;
        }
        
        .qr-header h2 {
            color: #fbbf24;
            font-weight: 700;
            font-size: 2rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: none;
        }
        
        .qr-code-box {
            background: linear-gradient(135deg, #ffffff, #f8fafc);
            padding: 25px;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
            border: 3px solid #fbbf24;
            box-shadow: 0 15px 40px rgba(251, 191, 36, 0.2);
            min-height: 300px;
        }
        
        #qrcode canvas, #qrcode img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .qr-info {
            background: #1e293b;
            border-radius: 16px;
            padding: 25px;
            margin: 20px 0;
            border: 1px solid #fbbf24;
            text-align: left;
        }
        
        .qr-info p {
            margin: 12px 0;
            color: #cbd5e1;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
            font-size: 1rem;
        }
        
        .qr-info strong {
            color: #fbbf24;
            width: 120px;
            display: inline-block;
            font-weight: 600;
        }
        
        .qr-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        
        .qr-actions button {
            padding: 12px 25px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 120px;
            justify-content: center;
        }
        
        .btn-download {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
        }
        
        .btn-print {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #0f172a;
        }
        
        .btn-close {
            background: linear-gradient(135deg, #64748b, #475569);
            color: white;
        }
        
        .qr-actions button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(251, 191, 36, 0.3);
        }
        
        .badge-unidade {
            display: inline-block;
            padding: 8px 20px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #0f172a;
            border-radius: 30px;
            font-weight: 700;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
        }
        
        .info-id {
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            color: #fbbf24;
            word-break: break-all;
            margin: 15px 0;
            border: 2px solid #fbbf24;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
        }
        
        .volume-info {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            padding: 20px;
            background: #1e293b;
            border-radius: 12px;
            border: 1px solid #334155;
        }
        
        .volume-item {
            text-align: center;
        }
        
        .volume-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #fbbf24;
            line-height: 1.2;
        }
        
        .volume-label {
            font-size: 0.9rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        @media print {
            .qr-actions, .badge-unidade {
                display: none;
            }
            
            .qr-card {
                box-shadow: none;
                border: 1px solid #000;
            }
        }
    </style>
</head>
<body>
    <div class="qr-container">
        <div class="qr-card">
            <div class="badge-unidade">
                <i class="bi bi-qr-code-scan"></i> QR CODE DA UNIDADE
            </div>
            
            <div class="qr-code-box" id="qr-code-container">
                <div id="qrcode"></div>
            </div>
            
            <div class="qr-info" id="qr-info">
                <!-- Informações serão preenchidas via JavaScript -->
            </div>
            
            <div class="volume-info" id="volume-info">
                <!-- Informações de volume serão preenchidas -->
            </div>
            
            <div class="info-id" id="info-id"></div>
            
            <div class="qr-actions">
                <button class="btn-download" onclick="baixarQR()">
                    <i class="bi bi-download"></i> Baixar
                </button>
                <button class="btn-print" onclick="window.print()">
                    <i class="bi bi-printer"></i> Imprimir
                </button>
                <button class="btn-close" onclick="window.close()">
                    <i class="bi bi-x-lg"></i> Fechar
                </button>
            </div>
        </div>
    </div>

    <script>
        // Carregar dados da URL
        const urlParams = new URLSearchParams(window.location.search);
        const unidadeId = urlParams.get('id');
        const sku = urlParams.get('sku');
        const lote = urlParams.get('lote');
        const validade = urlParams.get('validade');
        const produtoNome = decodeURIComponent(urlParams.get('produto') || '');
        const volume = urlParams.get('volume') || '0';
        const quantidade = urlParams.get('quantidade') || '0';
        const unidade = urlParams.get('unidade') || 'UN';

        // Construir link completo
        const baseUrl = 'https://rdnegocios8.github.io/ControleEstoqueGoogleSheets/baixa-view.html';
        const linkCompleto = `${baseUrl}?id=${unidadeId}&sku=${sku}&lote=${lote}&validade=${validade}&produto=${encodeURIComponent(produtoNome)}&volume=${volume}&quantidade=${quantidade}&unidade=${unidade}`;

        // ============================================
        // FUNÇÃO PARA FORMATAR DATA SEM PROBLEMAS DE FUSO
        // ============================================
        function formatarDataSemFuso(dataString) {
            if (!dataString) return 'N/A';
            
            // Se for string no formato YYYY-MM-DD
            if (typeof dataString === 'string' && dataString.includes('-')) {
                const partes = dataString.split('-');
                if (partes.length === 3) {
                    const ano = partes[0];
                    const mes = partes[1];
                    const dia = partes[2];
                    return `${dia}/${mes}/${ano}`;
                }
            }
            
            // Tentar converter outros formatos
            try {
                const data = new Date(dataString);
                if (isNaN(data.getTime())) return dataString;
                
                const dia = data.getDate().toString().padStart(2, '0');
                const mes = (data.getMonth() + 1).toString().padStart(2, '0');
                const ano = data.getFullYear();
                return `${dia}/${mes}/${ano}`;
            } catch (e) {
                return dataString;
            }
        }

        // ============================================
        // FUNÇÃO PARA GERAR QR CODE
        // ============================================
        function gerarQRCode() {
            const qrcodeDiv = document.getElementById('qrcode');
            qrcodeDiv.innerHTML = ''; // Limpar
            
            if (!unidadeId) {
                qrcodeDiv.innerHTML = '<p style="color: #ef4444;">ID da unidade não encontrado</p>';
                return;
            }

            // Usar a biblioteca QRCode.js
            if (typeof QRCode !== 'undefined') {
                try {
                    // Gerar QR Code
                    QRCode.toCanvas(document.createElement('canvas'), linkCompleto, {
                        width: 250,
                        margin: 2,
                        color: {
                            dark: '#000000',
                            light: '#ffffff'
                        }
                    }, function(err, canvas) {
                        if (err) {
                            console.error('Erro ao gerar QR Code:', err);
                            qrcodeDiv.innerHTML = '<p style="color: #ef4444;">Erro ao gerar QR Code</p>';
                            return;
                        }
                        
                        // Limpar e adicionar o canvas
                        qrcodeDiv.innerHTML = '';
                        canvas.style.width = '100%';
                        canvas.style.height = 'auto';
                        canvas.style.borderRadius = '8px';
                        qrcodeDiv.appendChild(canvas);
                    });

                    // ============================================
                    // PREENCHER INFORMAÇÕES COM DATA CORRIGIDA
                    // ============================================
                    document.getElementById('qr-info').innerHTML = `
                        <p><strong>Produto:</strong> ${produtoNome || 'N/A'}</p>
                        <p><strong>SKU:</strong> ${sku || 'N/A'}</p>
                        <p><strong>Lote:</strong> ${lote || 'N/A'}</p>
                        <p><strong>Validade:</strong> ${formatarDataSemFuso(validade)}</p>
                    `;

                    document.getElementById('volume-info').innerHTML = `
                        <div class="volume-item">
                            <div class="volume-value">${volume}</div>
                            <div class="volume-label">${unidade}</div>
                        </div>
                        <div class="volume-item">
                            <div class="volume-value">${parseFloat(quantidade).toFixed(2).replace('.', ',')}</div>
                            <div class="volume-label">UNIDADES</div>
                        </div>
                    `;

                    document.getElementById('info-id').innerHTML = `
                        <i class="bi bi-upc-scan"></i> ID: ${unidadeId}
                    `;

                } catch (e) {
                    console.error('Erro:', e);
                    qrcodeDiv.innerHTML = '<p style="color: #ef4444;">Erro ao gerar QR Code</p>';
                }
            } else {
                qrcodeDiv.innerHTML = '<p style="color: #ef4444;">Biblioteca QR Code não carregada</p>';
                console.error('QRCode library not loaded');
            }
        }

        // ============================================
        // FUNÇÃO PARA BAIXAR QR CODE
        // ============================================
        function baixarQR() {
            const canvas = document.querySelector('#qrcode canvas');
            if (!canvas) {
                alert('QR Code ainda não foi gerado!');
                return;
            }
            
            const link = document.createElement('a');
            link.download = `qrcode-${unidadeId || 'unidade'}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Gerar QR Code quando a página carregar
        window.onload = function() {
            setTimeout(gerarQRCode, 100);
        };

        // Fallback se a biblioteca demorar a carregar
        if (document.readyState === 'complete') {
            gerarQRCode();
        } else {
            window.addEventListener('load', gerarQRCode);
        }
    </script>
</body>
</html>
