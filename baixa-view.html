<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dar Baixa - Unidade</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            margin: 0;
        }
        
        .baixa-container {
            max-width: 700px;
            width: 100%;
        }
        
        .baixa-card {
            background: #0f172a;
            border: 2px solid #fbbf24;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }
        
        .baixa-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #fbbf24, #f59e0b, #fbbf24);
        }
        
        .produto-header {
            border-bottom: 2px solid #fbbf24;
            padding-bottom: 20px;
            margin-bottom: 25px;
            text-align: center;
        }
        
        .produto-titulo {
            color: #fbbf24;
            font-size: 1.8rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.5px;
        }
        
        .produto-sku {
            color: #94a3b8;
            font-size: 1rem;
            margin-top: 8px;
        }
        
        .estoque-info {
            background: #1e293b;
            border: 1px solid #fbbf24;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-around;
        }
        
        .estoque-item {
            text-align: center;
        }
        
        .estoque-valor {
            font-size: 2rem;
            font-weight: 700;
            color: #fbbf24;
            display: block;
            line-height: 1.2;
        }
        
        .estoque-label {
            font-size: 0.9rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            font-weight: 600;
            color: #fbbf24;
            margin-bottom: 8px;
            display: block;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }
        
        .form-control, .form-select {
            width: 100%;
            padding: 12px 15px;
            background-color: #1e293b;
            border: 2px solid #334155;
            border-radius: 12px;
            color: #e2e8f0;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-control:focus, .form-select:focus {
            outline: none;
            border-color: #fbbf24;
            box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.2);
            background-color: #2d3a4f;
        }
        
        .form-control[readonly] {
            background-color: #1a2634;
            color: #fbbf24;
            font-weight: 600;
            border-color: #fbbf24;
        }
        
        .disponivel-badge {
            color: #10b981;
            font-weight: normal;
            font-size: 0.85rem;
            margin-left: 10px;
            background: rgba(16, 185, 129, 0.1);
            padding: 2px 8px;
            border-radius: 20px;
        }
        
        .transferencia-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        
        .transferencia-option {
            background-color: #1e293b;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #cbd5e1;
            font-weight: 500;
            font-size: 0.9rem;
        }
        
        .transferencia-option:hover {
            background-color: #fbbf24;
            border-color: #fbbf24;
            color: #0f172a;
            transform: translateY(-2px);
        }
        
        .transferencia-option.selected {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            border-color: #fbbf24;
            color: #0f172a;
            font-weight: 600;
        }
        
        .observacao {
            width: 100%;
            padding: 12px 15px;
            background-color: #1e293b;
            border: 2px solid #334155;
            border-radius: 12px;
            color: #e2e8f0;
            font-size: 1rem;
            resize: vertical;
            min-height: 80px;
        }
        
        .observacao:focus {
            outline: none;
            border-color: #fbbf24;
        }
        
        .btn-confirmar {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #0f172a;
            border: none;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn-confirmar:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(251, 191, 36, 0.3);
        }
        
        .btn-confirmar i {
            font-size: 1.3rem;
        }
        
        .badge-unidade {
            display: inline-block;
            padding: 5px 12px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 15px;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #334155;
        }
        
        .info-label {
            color: #94a3b8;
            font-weight: 500;
        }
        
        .info-value {
            color: #fbbf24;
            font-weight: 600;
            font-family: monospace;
        }
        
        .lote-badge {
            background: #1e293b;
            padding: 8px 15px;
            border-radius: 30px;
            border: 1px solid #fbbf24;
            display: inline-block;
            color: #fbbf24;
            font-weight: 600;
        }
        
        .volume-info-text {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-top: 5px;
            display: block;
        }
        
        small.text-muted {
            color: #64748b !important;
            display: block;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="baixa-container">
        <div class="baixa-card">
            <div class="badge-unidade">
                <i class="bi bi-qr-code-scan"></i> TRANSFERÊNCIA DE UNIDADE
            </div>
            
            <div class="produto-header">
                <h1 class="produto-titulo" id="produto-nome">Carregando...</h1>
                <div class="produto-sku" id="produto-sku">SKU: </div>
            </div>

            <div class="estoque-info" id="estoque-info">
                <div class="estoque-item">
                    <span class="estoque-valor" id="display-volume">0</span>
                    <span class="estoque-label" id="display-unidade-volume">PCT</span>
                </div>
                <div class="estoque-item">
                    <span class="estoque-valor" id="display-quantidade">0</span>
                    <span class="estoque-label">UNIDADES</span>
                </div>
            </div>

            <form id="form-baixa">
                <input type="hidden" id="unidade-id">
                <input type="hidden" id="unidade-sku">
                <input type="hidden" id="unidade-destino">
                
                <div class="form-group">
                    <label class="form-label">
                        <i class="bi bi-tag"></i> Lote
                    </label>
                    <div class="lote-badge" id="lote">-</div>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="bi bi-box"></i> Volume a Transferir (<span id="label-unidade-volume">PCT</span>)
                        <span class="disponivel-badge" id="volume-disponivel"></span>
                    </label>
                    <input type="number" class="form-control" id="volume-transferir" min="1" required>
                    <small class="volume-info-text" id="volume-info"></small>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="bi bi-calculator"></i> Quantidade a Transferir (UNIDADES)
                        <span class="disponivel-badge" id="quantidade-disponivel"></span>
                    </label>
                    <input type="number" class="form-control" id="quantidade-transferir" min="1" readonly>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="bi bi-arrow-right-circle"></i> Transferido para <span style="color: #ef4444;">*</span>
                    </label>
                    <div class="transferencia-options" id="transferencia-options">
                        <div class="transferencia-option" onclick="selecionarDestino('Farinheira')">Farinheira</div>
                        <div class="transferencia-option" onclick="selecionarDestino('Doméstica')">Doméstica</div>
                        <div class="transferencia-option" onclick="selecionarDestino('Massas')">Massas</div>
                        <div class="transferencia-option" onclick="selecionarDestino('Biscoito')">Biscoito</div>
                        <div class="transferencia-option" onclick="selecionarDestino('Transferência MV')">Transferência MV</div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="bi bi-chat-text"></i> Observações
                    </label>
                    <textarea class="observacao" id="observacao" placeholder="Informações adicionais..."></textarea>
                </div>

                <div class="info-row">
                    <span class="info-label"><i class="bi bi-upc-scan"></i> ID da Unidade:</span>
                    <span class="info-value" id="info-id"></span>
                </div>
                <div class="info-row">
                    <span class="info-label"><i class="bi bi-calendar"></i> Validade:</span>
                    <span class="info-value" id="info-validade"></span>
                </div>

                <button type="button" class="btn-confirmar" onclick="confirmarBaixa()">
                    <i class="bi bi-check-circle"></i> Confirmar Baixa
                </button>
            </form>
        </div>
    </div>

    <script>
    // Carregar dados da URL
    const urlParams = new URLSearchParams(window.location.search);
    const unidadeId = urlParams.get('id');
    const sku = urlParams.get('sku');
    const lote = urlParams.get('lote');
    const validade = urlParams.get('validade');
    const produtoNome = decodeURIComponent(urlParams.get('produto') || '');
    
    // CORREÇÃO: Usar parseFloat em vez de parseInt para permitir decimais
    const volumeTotal = parseFloat(urlParams.get('volume')) || 0;
    const quantidadeTotal = parseFloat(urlParams.get('quantidade')) || 0;
    const unidadeVolume = urlParams.get('unidade') || 'UN';
    const unidadeBase = urlParams.get('unidadeBase') || 'UN';  // <--- NOVO
    const qtdPorEmbalagem = parseFloat(urlParams.get('qtdPorEmbalagem')) || 1;

    let destinoSelecionado = '';

    // ============================================
    // FUNÇÃO PARA FORMATAR NÚMERO COM VÍRGULA
    // ============================================
    function formatarNumero(valor) {
        if (valor === undefined || valor === null) return '0,00';
        return valor.toFixed(2).replace('.', ',');
    }

    // ============================================
    // FUNÇÃO PARA CONVERTER STRING COM VÍRGULA PARA NÚMERO
    // ============================================
    function converterParaNumero(valorStr) {
        if (!valorStr) return 0;
        if (typeof valorStr === 'number') return valorStr;
        return parseFloat(valorStr.replace(',', '.')) || 0;
    }

    // ============================================
    // FUNÇÃO PARA FORMATAR DATA SEM PROBLEMAS DE FUSO
    // ============================================
    function formatarDataSemFuso(dataString) {
        if (!dataString) return 'N/A';
        
        if (typeof dataString === 'string' && dataString.includes('-')) {
            const partes = dataString.split('-');
            if (partes.length === 3) {
                const ano = partes[0];
                const mes = partes[1];
                const dia = partes[2];
                return `${dia}/${mes}/${ano}`;
            }
        }
        
        try {
            const data = new Date(dataString);
            if (isNaN(data.getTime())) return dataString;
            
            const dia = data.getDate().toString().padStart(2, '0');
            const mes = (data.getMonth() + 1).toString().padStart(2, '0');
            const ano = data.getFullYear();
            return `${dia}/${mes}/${ano}`;
        } catch (e) {
            return dataString;
        }
    }

    // Calcular unidades por embalagem com precisão decimal
    const unidadesPorEmbalagem = volumeTotal > 0 ? quantidadeTotal / volumeTotal : qtdPorEmbalagem;

    // Preencher dados iniciais com formatação correta
    document.getElementById('produto-nome').textContent = produtoNome;
    document.getElementById('produto-sku').textContent = `SKU: ${sku}`;
    document.getElementById('unidade-id').value = unidadeId;
    document.getElementById('unidade-sku').value = sku;
    document.getElementById('lote').textContent = lote;
    document.getElementById('info-id').textContent = unidadeId;
    document.getElementById('info-validade').textContent = formatarDataSemFuso(validade);

    // CORREÇÃO: Mostrar valores com 2 casas decimais
    document.getElementById('display-volume').textContent = formatarNumero(volumeTotal);
    document.getElementById('display-unidade-volume').textContent = unidadeVolume;
    
    // CORREÇÃO: Usar unidadeBase em vez de "UN" fixo
    document.getElementById('display-quantidade').innerHTML = `${formatarNumero(quantidadeTotal)} <span class="estoque-label">${unidadeBase}</span>`;
    document.getElementById('label-unidade-volume').textContent = unidadeVolume;
    
    // Badges de disponível
    document.getElementById('volume-disponivel').textContent = `Disponível: ${formatarNumero(volumeTotal)} ${unidadeVolume}`;
    document.getElementById('quantidade-disponivel').textContent = `Disponível: ${formatarNumero(quantidadeTotal)} ${unidadeBase}`;
    
    // Informação de conversão
    document.getElementById('volume-info').textContent = `Cada ${unidadeVolume} contém ${formatarNumero(unidadesPorEmbalagem)} ${unidadeBase}`;

    // Input aceita decimais e step="any"
    document.getElementById('volume-transferir').max = volumeTotal;
    document.getElementById('volume-transferir').value = formatarNumero(1).replace(',', '.');
    document.getElementById('volume-transferir').step = "any";
    
    // Calcular quantidade inicial
    document.getElementById('quantidade-transferir').value = formatarNumero(unidadesPorEmbalagem).replace(',', '.');

    // Calcular quantidade ao digitar volume (com decimais)
    document.getElementById('volume-transferir').addEventListener('input', function() {
        const volume = converterParaNumero(this.value);
        const quantidade = volume * unidadesPorEmbalagem;
        document.getElementById('quantidade-transferir').value = formatarNumero(quantidade).replace(',', '.');
    });

    function selecionarDestino(destino) {
        destinoSelecionado = destino;
        document.getElementById('unidade-destino').value = destino;
        
        document.querySelectorAll('.transferencia-option').forEach(opt => {
            opt.classList.remove('selected');
        });
        event.target.classList.add('selected');
    }

    async function confirmarBaixa() {
        // Converter valores com vírgula para número
        const volumeTransferir = converterParaNumero(document.getElementById('volume-transferir').value);
        const quantidadeTransferir = volumeTransferir * unidadesPorEmbalagem;

        if (!destinoSelecionado) {
            alert('Selecione um destino para a transferência!');
            return;
        }

        if (volumeTransferir < 0.01 || volumeTransferir > volumeTotal) {
            alert(`Volume deve estar entre 0,01 e ${formatarNumero(volumeTotal)}`);
            return;
        }

        const novaQuantidade = quantidadeTotal - quantidadeTransferir;
        
        // Calcular novo volume com precisão decimal
        const novoVolume = novaQuantidade <= 0.01 ? 0 : Math.ceil(novaQuantidade * 100) / 100;
        const novoStatus = novaQuantidade <= 0.01 ? 'Transferido' : 'Disponível';
        const novoDestino = novaQuantidade <= 0.01 ? destinoSelecionado : '';

        const unidadeAtualizada = {
            tipo: 'unidade',
            id: unidadeId,
            sku: sku,
            lote: lote,
            validade: validade,
            volume: novoVolume,
            quantidade: novaQuantidade,
            unidadeEmbalagem: unidadeVolume,
            status: novoStatus,
            localizacao: '-',
            destino: novoDestino,
            foraPadrao: false,
            qtdRealPorEmbalagem: null
        };

        const movimentacao = {
            tipo: 'movimentacao',
            data: new Date().toISOString().split('T')[0],
            tipoMov: 'Transferência',
            idUnidade: unidadeId,
            sku: sku,
            volume: volumeTransferir,
            quantidade: quantidadeTransferir,
            unidadeEmbalagem: unidadeVolume,
            destino: destinoSelecionado,
            responsavel: 'Sistema',
            observacao: document.getElementById('observacao').value
        };

        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbysRomAyxbYAgrqdqqURTTAbwnGFiv9VXD_x11nzwdYbwmKMySmReWH9MBNcR3aeX9S/exec';

        try {
            await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(movimentacao)
            });

            await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(unidadeAtualizada)
            });

            alert('Transferência realizada com sucesso!');
            setTimeout(() => window.close(), 2000);
        } catch (error) {
            console.error('Erro:', error);
            alert('Erro ao realizar transferência.');
        }
    }
</script>
</body>
</html>
