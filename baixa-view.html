<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dar Baixa - Unidade</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            margin: 0;
        }
        
        .baixa-container {
            max-width: 700px;
            width: 100%;
        }
        
        .baixa-card {
            background: #0f172a;
            border: 2px solid #fbbf24;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }
        
        .baixa-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #fbbf24, #f59e0b, #fbbf24);
        }
        
        .produto-header {
            border-bottom: 2px solid #fbbf24;
            padding-bottom: 20px;
            margin-bottom: 25px;
            text-align: center;
        }
        
        .produto-titulo {
            color: #fbbf24;
            font-size: 1.8rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.5px;
        }
        
        .produto-sku {
            color: #94a3b8;
            font-size: 1rem;
            margin-top: 8px;
        }
        
        .estoque-info {
            background: #1e293b;
            border: 1px solid #fbbf24;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-around;
        }
        
        .estoque-item {
            text-align: center;
        }
        
        .estoque-valor {
            font-size: 2rem;
            font-weight: 700;
            color: #fbbf24;
            display: block;
            line-height: 1.2;
        }
        
        .estoque-label {
            font-size: 0.9rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            font-weight: 600;
            color: #fbbf24;
            margin-bottom: 8px;
            display: block;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }
        
        .form-control, .form-select {
            width: 100%;
            padding: 12px 15px;
            background-color: #1e293b;
            border: 2px solid #334155;
            border-radius: 12px;
            color: #e2e8f0;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-control:focus, .form-select:focus {
            outline: none;
            border-color: #fbbf24;
            box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.2);
            background-color: #2d3a4f;
        }
        
        .form-control[readonly] {
            background-color: #1a2634;
            color: #fbbf24;
            font-weight: 600;
            border-color: #fbbf24;
        }
        
        .disponivel-badge {
            color: #10b981;
            font-weight: normal;
            font-size: 0.85rem;
            margin-left: 10px;
            background: rgba(16, 185, 129, 0.1);
            padding: 2px 8px;
            border-radius: 20px;
        }
        
        .transferencia-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        
        .transferencia-option {
            background-color: #1e293b;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #cbd5e1;
            font-weight: 500;
            font-size: 0.9rem;
        }
        
        .transferencia-option:hover {
            background-color: #fbbf24;
            border-color: #fbbf24;
            color: #0f172a;
            transform: translateY(-2px);
        }
        
        .transferencia-option.selected {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            border-color: #fbbf24;
            color: #0f172a;
            font-weight: 600;
        }
        
        .volumes-container {
            background: #1e293b;
            border: 1px solid #fbbf24;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .volumes-container h4 {
            color: #fbbf24;
            margin-bottom: 15px;
            text-align: left;
        }
        
        .volume-card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .volume-card .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        
        .volume-card .badge.padrao {
            background: #10b981;
            color: white;
        }
        
        .volume-card .badge.fora {
            background: #f59e0b;
            color: #0f172a;
        }
        
        .volume-card .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #334155;
        }
        
        .volume-card .info-label {
            color: #94a3b8;
            font-size: 0.9rem;
        }
        
        .volume-card .info-value {
            color: #fbbf24;
            font-weight: 600;
        }
        
        .observacao {
            width: 100%;
            padding: 12px 15px;
            background-color: #1e293b;
            border: 2px solid #334155;
            border-radius: 12px;
            color: #e2e8f0;
            font-size: 1rem;
            resize: vertical;
            min-height: 80px;
        }
        
        .observacao:focus {
            outline: none;
            border-color: #fbbf24;
        }
        
        .btn-confirmar {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #0f172a;
            border: none;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn-confirmar:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(251, 191, 36, 0.3);
        }
        
        .btn-confirmar i {
            font-size: 1.3rem;
        }
        
        .badge-unidade {
            display: inline-block;
            padding: 5px 12px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 15px;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #334155;
        }
        
        .info-label {
            color: #94a3b8;
            font-weight: 500;
        }
        
        .info-value {
            color: #fbbf24;
            font-weight: 600;
            font-family: monospace;
        }
        
        .lote-badge {
            background: #1e293b;
            padding: 8px 15px;
            border-radius: 30px;
            border: 1px solid #fbbf24;
            display: inline-block;
            color: #fbbf24;
            font-weight: 600;
        }
        
        .volume-info-text {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-top: 5px;
            display: block;
        }
        
        small.text-muted {
            color: #64748b !important;
            display: block;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="baixa-container">
        <div class="baixa-card">
            <div class="badge-unidade">
                <i class="bi bi-qr-code-scan"></i> TRANSFERÊNCIA DE UNIDADE
            </div>
            
            <div class="produto-header">
                <h1 class="produto-titulo" id="produto-nome">Carregando...</h1>
                <div class="produto-sku" id="produto-sku">SKU: </div>
            </div>

            <div class="estoque-info" id="estoque-info">
                <div class="estoque-item">
                    <span class="estoque-valor" id="display-volume">0</span>
                    <span class="estoque-label" id="display-unidade-volume">TBR</span>
                </div>
                <div class="estoque-item">
                    <span class="estoque-valor" id="display-quantidade">0</span>
                    <span class="estoque-label" id="display-unidade-base">KG</span>
                </div>
            </div>

            <form id="form-baixa">
                <input type="hidden" id="unidade-id">
                <input type="hidden" id="unidade-destino">
                
                <!-- Área para múltiplos volumes (aparece quando tem JSON) -->
                <div id="volumes-area" style="display: none;">
                    <div class="volumes-container">
                        <h4><i class="bi bi-boxes"></i> Volumes Disponíveis</h4>
                        <div id="volumes-list"></div>
                    </div>
                </div>
                
                <!-- Área para volume único (formato antigo) -->
                <div id="volume-unico-area">
                    <div class="form-group">
                        <label class="form-label">
                            <i class="bi bi-tag"></i> Lote
                        </label>
                        <div class="lote-badge" id="lote">-</div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">
                            <i class="bi bi-box"></i> Volume a Transferir (<span id="label-unidade-volume">TBR</span>)
                            <span class="disponivel-badge" id="volume-disponivel"></span>
                        </label>
                        <input type="number" class="form-control" id="volume-transferir" min="0.01" step="any" required>
                        <small class="volume-info-text" id="volume-info"></small>
                    </div>

                    <div class="form-group">
                        <label class="form-label">
                            <i class="bi bi-calculator"></i> Quantidade a Transferir (<span id="label-unidade-base">KG</span>)
                            <span class="disponivel-badge" id="quantidade-disponivel"></span>
                        </label>
                        <input type="number" class="form-control" id="quantidade-transferir" min="0.01" step="any" readonly>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="bi bi-arrow-right-circle"></i> Transferido para <span style="color: #ef4444;">*</span>
                    </label>
                    <div class="transferencia-options" id="transferencia-options">
                        <div class="transferencia-option" onclick="selecionarDestino('Farinheira')">Farinheira</div>
                        <div class="transferencia-option" onclick="selecionarDestino('Doméstica')">Doméstica</div>
                        <div class="transferencia-option" onclick="selecionarDestino('Massas')">Massas</div>
                        <div class="transferencia-option" onclick="selecionarDestino('Biscoito')">Biscoito</div>
                        <div class="transferencia-option" onclick="selecionarDestino('Transferência MV')">Transferência MV</div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="bi bi-chat-text"></i> Observações
                    </label>
                    <textarea class="observacao" id="observacao" placeholder="Informações adicionais..."></textarea>
                </div>

                <div class="info-row">
                    <span class="info-label"><i class="bi bi-upc-scan"></i> ID da Unidade:</span>
                    <span class="info-value" id="info-id"></span>
                </div>
                <div class="info-row">
                    <span class="info-label"><i class="bi bi-calendar"></i> Validade:</span>
                    <span class="info-value" id="info-validade"></span>
                </div>

                <button type="button" class="btn-confirmar" onclick="confirmarBaixa()">
                    <i class="bi bi-check-circle"></i> Confirmar Baixa
                </button>
            </form>
        </div>
    </div>

    <script>
        // ============================================
        // CARREGAR DADOS DA URL
        // ============================================
        const urlParams = new URLSearchParams(window.location.search);
        const dadosParam = urlParams.get('dados');
        
        let unidadeData = null;
        let isMultipla = false;
        let volumesList = [];
        
        // ============================================
        // SE TIVER PARÂMETRO 'dados' (UNIDADE MÚLTIPLA)
        // ============================================
        if (dadosParam) {
            try {
                unidadeData = JSON.parse(decodeURIComponent(dadosParam));
                isMultipla = true;
                console.log('✅ Dados da unidade múltipla carregados:', unidadeData);
            } catch (e) {
                console.error('❌ Erro ao parsear dados:', e);
            }
        }
        
        // ============================================
        // SE NÃO TIVER, É UNIDADE SIMPLES (formato antigo)
        // ============================================
        if (!isMultipla) {
            unidadeData = {
                id: urlParams.get('id') || '',
                produtos: [{
                    nome: decodeURIComponent(urlParams.get('produto') || ''),
                    sku: urlParams.get('sku') || '',
                    tipoEmbalagem: urlParams.get('unidade') || 'UN',
                    volumes: [{
                        tipo: 'padrao',
                        qtdVolumes: parseFloat(urlParams.get('volume')) || 0,
                        unPorEmbalagem: parseFloat(urlParams.get('qtdPorEmbalagem')) || 1,
                        totalUN: parseFloat(urlParams.get('quantidade')) || 0,
                        lote: urlParams.get('lote') || '',
                        validade: urlParams.get('validade') || '',
                        localizacao: '-'
                    }]
                }],
                totalVolumes: parseFloat(urlParams.get('volume')) || 0,
                totalUN: parseFloat(urlParams.get('quantidade')) || 0
            };
        }

        // Variáveis globais
        let destinoSelecionado = '';
        const produto = unidadeData.produtos[0];
        
        // ============================================
        // FUNÇÕES AUXILIARES
        // ============================================
        function formatarNumero(valor) {
            if (valor === undefined || valor === null) return '0,00';
            return valor.toFixed(2).replace('.', ',');
        }

        function converterParaNumero(valorStr) {
            if (!valorStr) return 0;
            if (typeof valorStr === 'number') return valorStr;
            return parseFloat(valorStr.replace(',', '.')) || 0;
        }

        function formatarData(dataString) {
            if (!dataString) return 'N/A';
            if (typeof dataString === 'string' && dataString.includes('-')) {
                const partes = dataString.split('-');
                if (partes.length === 3) {
                    return `${partes[2]}/${partes[1]}/${partes[0]}`;
                }
            }
            return dataString;
        }

        // ============================================
        // PREENCHER DADOS INICIAIS
        // ============================================
        document.getElementById('produto-nome').textContent = produto.nome;
        document.getElementById('produto-sku').textContent = `SKU: ${produto.sku}`;
        document.getElementById('unidade-id').value = unidadeData.id;
        document.getElementById('info-id').textContent = unidadeData.id;

        // Totais
        document.getElementById('display-volume').textContent = formatarNumero(unidadeData.totalVolumes);
        document.getElementById('display-unidade-volume').textContent = produto.tipoEmbalagem;
        document.getElementById('display-quantidade').textContent = formatarNumero(unidadeData.totalUN);
        document.getElementById('display-unidade-base').textContent = 'UN';

        // ============================================
        // SE FOR UNIDADE MÚLTIPLA, MOSTRAR TODOS OS VOLUMES
        // ============================================
        if (isMultipla && produto.volumes.length > 1) {
            document.getElementById('volumes-area').style.display = 'block';
            document.getElementById('volume-unico-area').style.display = 'none';
            
            const volumesList = document.getElementById('volumes-list');
            volumesList.innerHTML = '';
            
            produto.volumes.forEach((vol, index) => {
                const card = document.createElement('div');
                card.className = 'volume-card';
                card.innerHTML = `
                    <div class="badge ${vol.tipo === 'padrao' ? 'padrao' : 'fora'}">
                        ${vol.tipo === 'padrao' ? 'PADRÃO' : 'FORA DO PADRÃO'}
                    </div>
                    <div class="info-row">
                        <span class="info-label">Lote:</span>
                        <span class="info-value">${vol.lote || '-'}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Validade:</span>
                        <span class="info-value">${formatarData(vol.validade)}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Quantidade:</span>
                        <span class="info-value">${vol.qtdVolumes} ${produto.tipoEmbalagem}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">UN/Volume:</span>
                        <span class="info-value">${formatarNumero(vol.unPorEmbalagem)}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Total UN:</span>
                        <span class="info-value">${formatarNumero(vol.totalUN)}</span>
                    </div>
                    <div class="form-group mt-2">
                        <label class="form-label">Transferir deste volume:</label>
                        <input type="number" class="form-control volume-transferir-item" 
                               data-index="${index}" 
                               data-max="${vol.qtdVolumes}"
                               data-un="${vol.unPorEmbalagem}"
                               min="0" max="${vol.qtdVolumes}" step="0.01"
                               placeholder="Quantidade em ${produto.tipoEmbalagem}">
                    </div>
                `;
                volumesList.appendChild(card);
            });
        } else {
            // ============================================
            // UNIDADE SIMPLES (formato antigo)
            // ============================================
            const volume = produto.volumes[0];
            
            document.getElementById('lote').textContent = volume.lote;
            document.getElementById('info-validade').textContent = formatarData(volume.validade);
            
            document.getElementById('label-unidade-volume').textContent = produto.tipoEmbalagem;
            document.getElementById('label-unidade-base').textContent = 'UN';
            
            document.getElementById('volume-disponivel').textContent = 
                `Disponível: ${formatarNumero(volume.qtdVolumes)} ${produto.tipoEmbalagem}`;
            document.getElementById('quantidade-disponivel').textContent = 
                `Disponível: ${formatarNumero(volume.totalUN)} UN`;
            
            document.getElementById('volume-info').textContent = 
                `Cada ${produto.tipoEmbalagem} contém ${formatarNumero(volume.unPorEmbalagem)} UN`;
            
            document.getElementById('volume-transferir').max = volume.qtdVolumes;
            document.getElementById('volume-transferir').value = formatarNumero(1).replace(',', '.');
            document.getElementById('volume-transferir').step = "any";
            
            document.getElementById('quantidade-transferir').value = 
                formatarNumero(volume.unPorEmbalagem).replace(',', '.');
            
            document.getElementById('volume-transferir').addEventListener('input', function() {
                const vol = converterParaNumero(this.value);
                const qtd = vol * volume.unPorEmbalagem;
                document.getElementById('quantidade-transferir').value = formatarNumero(qtd).replace(',', '.');
            });
        }

        // ============================================
        // FUNÇÃO: Selecionar destino
        // ============================================
        function selecionarDestino(destino) {
            destinoSelecionado = destino;
            document.getElementById('unidade-destino').value = destino;
            
            document.querySelectorAll('.transferencia-option').forEach(opt => {
                opt.classList.remove('selected');
            });
            event.target.classList.add('selected');
        }

        // ============================================
        // FUNÇÃO: Confirmar baixa
        // ============================================
        async function confirmarBaixa() {
            if (!destinoSelecionado) {
                alert('Selecione um destino para a transferência!');
                return;
            }

            const observacao = document.getElementById('observacao').value;

            if (isMultipla && produto.volumes.length > 1) {
                // ============================================
                // CASO MÚLTIPLO: processar cada volume
                // ============================================
                const inputs = document.querySelectorAll('.volume-transferir-item');
                let temTransferencia = false;
                
                for (let i = 0; i < inputs.length; i++) {
                    const input = inputs[i];
                    const index = parseInt(input.dataset.index);
                    const volume = produto.volumes[index];
                    const qtdTransferir = converterParaNumero(input.value);
                    
                    if (qtdTransferir > 0) {
                        temTransferencia = true;
                        
                        if (qtdTransferir > volume.qtdVolumes) {
                            alert(`Volume ${index+1}: quantidade maior que o disponível (${volume.qtdVolumes} ${produto.tipoEmbalagem})`);
                            return;
                        }
                        
                        const qtdUNTransferir = qtdTransferir * volume.unPorEmbalagem;
                        const novaQuantidadeUN = volume.totalUN - qtdUNTransferir;
                        const novoVolume = novaQuantidadeUN <= 0.01 ? 0 : (novaQuantidadeUN / volume.unPorEmbalagem);
                        
                        // Aqui você pode implementar a lógica para salvar cada transferência
                        console.log(`Transferindo volume ${index+1}: ${qtdTransferir} ${produto.tipoEmbalagem} (${qtdUNTransferir} UN)`);
                    }
                }
                
                if (!temTransferencia) {
                    alert('Informe pelo menos um volume para transferir!');
                    return;
                }
                
                alert('Transferência múltipla realizada com sucesso!');
                setTimeout(() => window.close(), 2000);
                
            } else {
                // ============================================
                // CASO SIMPLES: manter o código original
                // ============================================
                const volume = produto.volumes[0];
                const volumeTransferir = converterParaNumero(document.getElementById('volume-transferir').value);
                const quantidadeTransferir = volumeTransferir * volume.unPorEmbalagem;

                if (volumeTransferir < 0.01 || volumeTransferir > volume.qtdVolumes) {
                    alert(`Volume deve estar entre 0,01 e ${formatarNumero(volume.qtdVolumes)} ${produto.tipoEmbalagem}`);
                    return;
                }

                const novaQuantidade = volume.totalUN - quantidadeTransferir;
                const novoVolume = novaQuantidade <= 0.01 ? 0 : (novaQuantidade / volume.unPorEmbalagem);
                const novoStatus = novaQuantidade <= 0.01 ? 'Transferido' : 'Disponível';
                const novoDestino = novaQuantidade <= 0.01 ? destinoSelecionado : '';

                const unidadeAtualizada = {
                    tipo: 'unidade',
                    id: unidadeData.id,
                    sku: produto.sku,
                    lote: volume.lote,
                    validade: volume.validade,
                    volume: novoVolume,
                    quantidade: novaQuantidade,
                    unidadeEmbalagem: produto.tipoEmbalagem,
                    status: novoStatus,
                    localizacao: '-',
                    destino: novoDestino,
                    foraPadrao: volume.tipo === 'fora-padrao',
                    qtdRealPorEmbalagem: volume.tipo === 'fora-padrao' ? volume.unPorEmbalagem : null
                };

                const movimentacao = {
                    tipo: 'movimentacao',
                    data: new Date().toISOString().split('T')[0],
                    tipoMov: 'Transferência',
                    idUnidade: unidadeData.id,
                    sku: produto.sku,
                    volume: volumeTransferir,
                    quantidade: quantidadeTransferir,
                    unidadeEmbalagem: produto.tipoEmbalagem,
                    destino: destinoSelecionado,
                    responsavel: 'Sistema',
                    observacao: observacao
                };

                const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbysRomAyxbYAgrqdqqURTTAbwnGFiv9VXD_x11nzwdYbwmKMySmReWH9MBNcR3aeX9S/exec';

                try {
                    await fetch(WEB_APP_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(movimentacao)
                    });

                    await fetch(WEB_APP_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(unidadeAtualizada)
                    });

                    alert('Transferência realizada com sucesso!');
                    setTimeout(() => window.close(), 2000);
                } catch (error) {
                    console.error('Erro:', error);
                    alert('Erro ao realizar transferência.');
                }
            }
        }
    </script>
</body>
</html>
