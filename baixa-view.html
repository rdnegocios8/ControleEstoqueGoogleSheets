<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dar Baixa - Unidade</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #0a0c0f 0%, #1a1e24 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .baixa-container {
            max-width: 700px;
            width: 100%;
        }
        
        .baixa-card {
            background-color: #1a1e24;
            border: 2px solid #dc3545;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(220,53,69,0.3);
            position: relative;
            overflow: hidden;
        }
        
        .baixa-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #dc3545, #fd7e14, #0d6efd);
        }
        
        .produto-header {
            border-bottom: 2px solid #fd7e14;
            padding-bottom: 20px;
            margin-bottom: 25px;
            text-align: center;
        }
        
        .produto-titulo {
            color: #fd7e14;
            font-size: 1.8rem;
            font-weight: 700;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .produto-sku {
            color: #adb5bd;
            font-size: 1rem;
            margin-top: 8px;
        }
        
        .estoque-info {
            background: linear-gradient(135deg, #2c3034 0%, #1a1e24 100%);
            border: 1px solid #fd7e14;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-around;
        }
        
        .estoque-item {
            text-align: center;
        }
        
        .estoque-valor {
            font-size: 2rem;
            font-weight: 700;
            color: #fd7e14;
            display: block;
            line-height: 1.2;
        }
        
        .estoque-label {
            font-size: 0.9rem;
            color: #adb5bd;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-label {
            font-weight: 600;
            color: #fd7e14;
            margin-bottom: 10px;
            display: block;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }
        
        .form-control, .form-select {
            width: 100%;
            padding: 12px 15px;
            background-color: #2c3034;
            border: 2px solid #3a3f45;
            border-radius: 10px;
            font-size: 1rem;
            color: #e9ecef;
            transition: all 0.3s;
        }
        
        .form-control:focus, .form-select:focus {
            outline: none;
            border-color: #fd7e14;
            box-shadow: 0 0 0 3px rgba(253,126,20,0.2);
        }
        
        .form-control[readonly] {
            background-color: #1a1e24;
            border-color: #3a3f45;
            color: #fd7e14;
            font-weight: 600;
        }
        
        .disponivel-badge {
            color: #28a745;
            font-weight: normal;
            font-size: 0.85rem;
            margin-left: 10px;
            background: rgba(40,167,69,0.2);
            padding: 2px 8px;
            border-radius: 20px;
        }
        
        .transferencia-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        
        .transferencia-option {
            background-color: #2c3034;
            border: 2px solid #3a3f45;
            border-radius: 10px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            color: #e9ecef;
            font-weight: 500;
            font-size: 0.9rem;
        }
        
        .transferencia-option:hover {
            background-color: #fd7e14;
            border-color: #fd7e14;
            color: white;
            transform: translateY(-2px);
        }
        
        .transferencia-option.selected {
            background: linear-gradient(135deg, #dc3545, #fd7e14);
            border-color: #fd7e14;
            color: white;
            font-weight: 600;
        }
        
        .observacao {
            width: 100%;
            padding: 12px 15px;
            background-color: #2c3034;
            border: 2px solid #3a3f45;
            border-radius: 10px;
            font-size: 1rem;
            color: #e9ecef;
            resize: vertical;
            min-height: 80px;
        }
        
        .btn-confirmar {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #dc3545, #fd7e14);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn-confirmar:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(220,53,69,0.4);
        }
        
        .btn-confirmar i {
            font-size: 1.3rem;
        }
        
        .badge-unidade {
            display: inline-block;
            padding: 5px 12px;
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
            color: white;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 15px;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #2c3034;
        }
        
        .info-label {
            color: #adb5bd;
            font-weight: 500;
        }
        
        .info-value {
            color: #fd7e14;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="baixa-container">
        <div class="baixa-card">
            <div class="badge-unidade">
                <i class="bi bi-qr-code"></i> TRANSFERÊNCIA DE UNIDADE
            </div>
            
            <div class="produto-header">
                <h1 class="produto-titulo" id="produto-nome">Carregando...</h1>
                <div class="produto-sku" id="produto-sku">SKU: </div>
            </div>

            <div class="estoque-info" id="estoque-info">
                <!-- Informações de estoque serão preenchidas -->
            </div>

            <form id="form-baixa">
                <input type="hidden" id="unidade-id">
                <input type="hidden" id="unidade-sku">
                <input type="hidden" id="unidade-destino">
                
                <div class="form-group">
                    <label class="form-label">Lote</label>
                    <input type="text" class="form-control" id="lote" readonly>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        Volume 
                        <span class="disponivel-badge" id="volume-disponivel"></span>
                    </label>
                    <input type="number" class="form-control" id="volume" min="1" required>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        Quantidade 
                        <span class="disponivel-badge" id="quantidade-disponivel"></span>
                    </label>
                    <input type="number" class="form-control" id="quantidade" min="1" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Unidade de Medida</label>
                    <select class="form-select" id="unidade-medida" required>
                        <option value="KG">KG (Quilograma)</option>
                        <option value="LT">LT (Litro)</option>
                        <option value="UN">UN (Unidade)</option>
                        <option value="CX">CX (Caixa)</option>
                        <option value="PLT">PLT (Palete)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Transferido para <span style="color: #dc3545;">*</span></label>
                    <div class="transferencia-options" id="transferencia-options">
                        <div class="transferencia-option" onclick="selecionarDestino('Farinheira')">Farinheira</div>
                        <div class="transferencia-option" onclick="selecionarDestino('Doméstica')">Doméstica</div>
                        <div class="transferencia-option" onclick="selecionarDestino('Massas')">Massas</div>
                        <div class="transferencia-option" onclick="selecionarDestino('Biscoito')">Biscoito</div>
                        <div class="transferencia-option" onclick="selecionarDestino('Transferência MV')">Transferência MV</div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Observações (opcional)</label>
                    <textarea class="observacao" id="observacao" placeholder="Informações adicionais..."></textarea>
                </div>

                <div class="info-row">
                    <span class="info-label">ID da Unidade:</span>
                    <span class="info-value" id="info-id"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">Validade:</span>
                    <span class="info-value" id="info-validade"></span>
                </div>

                <button type="button" class="btn-confirmar" onclick="confirmarBaixa()">
                    <i class="bi bi-check-circle"></i> Confirmar Baixa
                </button>
            </form>
        </div>
    </div>

    <script>
        // Configurações
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbysRomAyxbYAgrqdqqURTTAbwnGFiv9VXD_x11nzwdYbwmKMySmReWH9MBNcR3aeX9S/exec';
        
        // Carregar dados da URL
        const urlParams = new URLSearchParams(window.location.search);
        const unidadeId = urlParams.get('id');
        const sku = urlParams.get('sku');
        const lote = urlParams.get('lote');
        const validade = urlParams.get('validade');
        const produtoNome = decodeURIComponent(urlParams.get('produto') || '');
        const volumeTotal = parseInt(urlParams.get('volume')) || 1;
        const quantidadeTotal = parseFloat(urlParams.get('quantidade')) || 0;
        const unidade = urlParams.get('unidade') || 'UN';

        // Variáveis
        let destinoSelecionado = '';

        // Preencher dados do produto
        document.getElementById('produto-nome').textContent = produtoNome || 'Produto não identificado';
        document.getElementById('produto-sku').textContent = `SKU: ${sku || 'N/A'}`;
        document.getElementById('unidade-id').value = unidadeId || '';
        document.getElementById('unidade-sku').value = sku || '';
        document.getElementById('lote').value = lote || '';
        document.getElementById('unidade-medida').value = unidade;
        document.getElementById('info-id').textContent = unidadeId || '';
        document.getElementById('info-validade').textContent = validade ? new Date(validade).toLocaleDateString('pt-BR') : 'N/A';

        // Configurar limites
        document.getElementById('volume').max = volumeTotal;
        document.getElementById('volume').value = 1;
        document.getElementById('quantidade').max = quantidadeTotal;
        document.getElementById('quantidade').value = quantidadeTotal;

        // Preencher informações de disponibilidade
        document.getElementById('estoque-info').innerHTML = `
            <div class="estoque-item">
                <span class="estoque-valor">${volumeTotal}</span>
                <span class="estoque-label">Volume (${unidade})</span>
            </div>
            <div class="estoque-item">
                <span class="estoque-valor">${quantidadeTotal}</span>
                <span class="estoque-label">Quantidade</span>
            </div>
        `;

        document.getElementById('volume-disponivel').textContent = `Disponível: ${volumeTotal} ${unidade}`;
        document.getElementById('quantidade-disponivel').textContent = `Disponível: ${quantidadeTotal}`;

        // Função para selecionar destino
        function selecionarDestino(destino) {
            destinoSelecionado = destino;
            document.getElementById('unidade-destino').value = destino;
            
            // Remover seleção anterior
            document.querySelectorAll('.transferencia-option').forEach(opt => {
                opt.classList.remove('selected');
            });
            
            // Adicionar seleção ao clicado
            event.target.classList.add('selected');
        }

        // Função para confirmar baixa
        async function confirmarBaixa() {
            const volume = parseInt(document.getElementById('volume').value);
            const quantidade = parseFloat(document.getElementById('quantidade').value);
            const novaUnidade = document.getElementById('unidade-medida').value;
            const destino = destinoSelecionado;
            const observacao = document.getElementById('observacao').value;

            // Validações
            if (!destino) {
                alert('Selecione um destino para a transferência!');
                return;
            }

            if (volume < 1 || volume > volumeTotal) {
                alert(`Volume deve estar entre 1 e ${volumeTotal}`);
                return;
            }

            if (quantidade < 1 || quantidade > quantidadeTotal) {
                alert(`Quantidade deve estar entre 1 e ${quantidadeTotal}`);
                return;
            }

            // Criar movimentação
            const movimentacao = {
                tipo: 'movimentacao',
                data: new Date().toISOString().split('T')[0],
                tipoMov: 'Transferência',
                idUnidade: unidadeId,
                sku: sku,
                volume: volume,
                quantidade: quantidade,
                destino: destino,
                responsavel: 'Sistema',
                observacao: observacao
            };

            // Atualizar unidade (diminuir quantidade)
            const novaQuantidade = quantidadeTotal - quantidade;
            const novoVolume = Math.ceil(novaQuantidade / (quantidadeTotal / volumeTotal));
            
            const unidadeAtualizada = {
                tipo: 'unidade',
                id: unidadeId,
                sku: sku,
                lote: lote,
                validade: validade,
                volume: novoVolume,
                quantidade: novaQuantidade,
                unidade: novaUnidade,
                status: novaQuantidade > 0 ? 'Disponível' : 'Transferido',
                localizacao: destino,
                destino: novaQuantidade > 0 ? '' : destino
            };

            try {
                // Enviar movimentação
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(movimentacao)
                });

                // Atualizar unidade
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(unidadeAtualizada)
                });

                alert('Transferência realizada com sucesso!');
                
                // Fechar a janela
                setTimeout(() => {
                    window.close();
                }, 2000);
                
            } catch (error) {
                console.error('Erro ao realizar transferência:', error);
                alert('Erro ao realizar transferência. Tente novamente.');
            }
        }
    </script>
</body>
</html>
